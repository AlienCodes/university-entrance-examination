<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="file:///workspace/tem8-project/%E5%9B%9B%E7%BA%A7/tools/fonts/fonts.css"><link rel="stylesheet" href="file:///workspace/tem8-project/%E4%B8%93%E5%85%AB/tools/fonts/fonts.css"><link rel="stylesheet" href="file:///workspace/tem8-project/%E4%B8%93%E5%85%AB/tools/fonts/eb-garamond-bold.css"><style>
*{box-sizing:border-box;margin:0;padding:0}

.main{position:absolute;left:110px;top:140px;bottom:96px;width:1070px;display:flex;align-items:center}

.en{font-family:'EB Garamond','Noto Serif SC',serif;font-size:var(--fs);line-height:1.5}
.w{font-weight:600;color:#1f5c4a}.ph{font-weight:600;color:#a14a2a}
sup{font-family:'Inter';font-size:calc(var(--fs)*.36);font-weight:700;color:#fff;background:#1f5c4a;border-radius:1em;padding:.05em .45em;margin-left:.12em;vertical-align:.95em;line-height:1}
.ph sup{background:#a14a2a}
.zh{font-size:calc(var(--fs)*.68);line-height:1.65;color:#3c4642;margin-top:calc(var(--fs)*.5);padding-left:24px;border-left:4px solid #d7d2c3}
.side{position:absolute;right:90px;top:140px;bottom:96px;width:600px;background:#eef2ec;border-radius:6px;padding:30px 36px;display:flex;flex-direction:column;justify-content:center}
#list{display:flex;flex-direction:column;gap:calc(var(--vs)*.42)}
.side h3{font-family:'Inter';font-size:20px;letter-spacing:.2em;color:#1f5c4a;margin-bottom:14px}
.v{display:grid;grid-template-columns:calc(var(--vs)*1.3) 1fr;column-gap:12px;font-size:var(--vs);line-height:1.32}
.v em{font-style:normal;font-family:'Inter';font-weight:700;font-size:calc(var(--vs)*.7);color:#fff;background:#1f5c4a;border-radius:50%;width:calc(var(--vs)*1.2);height:calc(var(--vs)*1.2);display:flex;align-items:center;justify-content:center;margin-top:.1em}
.v.ph em{background:#a14a2a}
.v b{font-family:'EB Garamond';font-weight:600;font-size:calc(var(--vs)*1.3)}
.v.ph b{color:#a14a2a}
.v i{font-style:italic;font-family:'EB Garamond';color:#6b746f;margin-right:10px}
.v b{margin-right:10px}
.v span{color:#3c4642}
.zh,.v .g{text-spacing-trim:space-all}
x-i{position:relative;margin:0 .03em}x-i::before,x-i::after{content:'';position:absolute;left:50%;width:.2em;margin-left:-.1em;height:.08em;background:currentColor;border-radius:.03em}
x-i::before{top:.295em}x-i::after{top:.945em}
.en .w x-i::before,.en .ph x-i::before,.en .w x-i::after,.en .ph x-i::after,.v b x-i::before,.v b x-i::after{width:.25em;margin-left:-.125em;height:.135em}
.en .w x-i::before,.en .ph x-i::before,.v b x-i::before{top:.29em}.en .w x-i::after,.en .ph x-i::after,.v b x-i::after{top:.89em}
sup.sd{margin-right:calc(var(--fs)*.084)}   /* 编号后紧跟破折号时留空：专八编号是英文字号的 0.36 倍（中考 0.42），按英文字号定，等于中考的 0.2 × 0.42（t08 “¹¹—”原来只隔 3.7 像素） */
.pr{margin-right:-.5em}.pl{margin-left:-.5em}.pq{margin-left:-.3em}
x-n>.pr:last-child{display:inline-block;width:.5em;margin-right:0;white-space:nowrap}   /* 释义分句末尾的标点（“（内容）广泛的；”）：负外边距让行内块的自身宽度少算半个字，块内放不下、自己折成两行，FIT 只好改成行内拆开（考研 k09 第 10 句 括注分离）；改成半字宽的行内块，宽度算法与排版一致 */
.en .ph{white-space:nowrap}   /* 高亮短语整体不断行（t03 第二轮审阅：rough / treatment、at the / expense of），比一行还长的由 FIT 放开（phr） */
x-n{display:inline-block}     /* 释义里的长括注：放得下一行就整体换到下一行（t03 第二轮审阅：（同 / gunwale）），放不下由 FIT 改成行内、只在指定处断开（notes） */
.cont{color:#9aa39e;font-weight:400}
.en x-ps{font-weight:400;color:var(--ink,#1c2421)}   /* 只是排版前的初值：FIT 一开始把所有格的颜色、粗细、字体设成英文正文实测的样式（六级黑板审阅：--ink 只有样式 1、2 定义，黑板上所有格成了近黑色、几乎看不见） */
x-ap{font-family:'Inter'}     /* 中文里英文词中间的撇号（Hunt’s）：思源黑体的“’”是全角（1 字宽，六级 s57 第 10 句 “Hunt’ s在”），改用英文字体画（zh_html 包 x-ap；画面 C 不包） */
.bot{position:absolute;left:110px;right:90px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-family:'Inter';font-size:22px;color:#6b746f;letter-spacing:.1em}
.bar{flex:1;height:3px;background:#dcd8cc;margin:0 30px}.bar i{display:block;height:100%;background:#1f5c4a}
.ttl{position:absolute;left:150px;right:150px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.ttl .tag{font-family:'Inter';font-weight:800;letter-spacing:.3em;font-size:28px;color:#1f5c4a}
.ttl h1{font-size:96px;font-weight:700;margin:30px 0 26px;line-height:1.25}
.ttl .sub{font-size:44px;color:#3c4642}
.ttl .sub i{font-family:'EB Garamond';font-style:italic}
.ttl .meta{margin-top:50px;padding-top:26px;border-top:2px solid #1c2421;font-size:30px;color:#6b746f;display:flex;justify-content:space-between}
.legend{position:absolute;right:120px;bottom:60px;display:flex;gap:30px;font-size:24px;color:#3c4642}
.legend em{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:8px;vertical-align:-3px}
.legend .lw{background:#1f5c4a}.legend .lp{background:#a14a2a}
</style><style>/* 专八专用样式「书卷水墨」（用户 2026-10-10 从多种设计中选定）：追加在 make_video.py 通用样式之后覆盖它。
   只改颜色、字体、装饰与封面，不改版面尺寸；定稿前对 t01—t10 全部 481 屏重新适配字号：全部放得下，没有任何一屏字号变小；
   对比度：英文 14.8、中文 11.3、单词高亮 8.3、短语高亮 5.2（WCAG）。靛青 = 单词，朱砂 = 短语（方角编号）。 */
:root{
  --paper:#f4eee2; --paper2:#ece4d4; --ink:#1e1b17; --ink2:#34302a; --mute:#6a6255; --faint:#a39a8a; --rule:#d3c8b2;
  --dian:#1f4677;   /* 靛青 indigo  : single words */
  --zhu:#b03c2a;    /* 朱砂 cinnabar: phrases, seals */
  --cloth:#1c3150; --thread:#e9dfc9;
}
html,body{background:var(--paper);color:var(--ink)}

/* spine: indigo cloth strip with the white thread of a stitched (线装) binding */
.band{background:var(--dian)}
.band::before{content:'';position:absolute;inset:0;opacity:.55;
  background:linear-gradient(var(--thread),var(--thread)) 13px 0/1px 100% no-repeat,
  linear-gradient(var(--thread),var(--thread)) 0 128px/14px 1px no-repeat,linear-gradient(var(--thread),var(--thread)) 0 404px/14px 1px no-repeat,
  linear-gradient(var(--thread),var(--thread)) 0 676px/14px 1px no-repeat,linear-gradient(var(--thread),var(--thread)) 0 950px/14px 1px no-repeat}

/* header: 文武线 (thick + thin rule, as on a woodblock page frame) */
.top{border-bottom:3px solid var(--ink)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:1px;background:var(--ink)}
.top b{font-family:'Inter';font-weight:700;letter-spacing:.18em;color:var(--ink)}
.top b::before{content:'';display:inline-block;width:14px;height:14px;background:var(--zhu);margin-right:16px;vertical-align:1px}
.top span{font-family:'EB Garamond','LXGW WenKai';font-size:27px;color:var(--mute)}

/* English: the hero */
.en{color:var(--ink)}
.w{color:var(--dian)}
.ph{color:var(--zhu)}
sup{color:var(--paper);background:var(--dian)}
.ph sup{background:var(--zhu);border-radius:.16em}

/* Chinese translation */
.zh{font-family:'LXGW WenKai';color:var(--ink2);border-left:4px solid var(--rule)}

/* vocabulary panel */
.side{background:var(--paper2);border-radius:0;box-shadow:inset 0 0 0 1px #cfc3ab}
.side h3{color:var(--zhu);font-weight:700}
.v em{background:var(--dian);color:var(--paper)}
.v.ph em{background:var(--zhu);border-radius:4px}
.v b{color:var(--ink)}
.v.ph b{color:var(--zhu)}
.v i{color:var(--mute)}
.v span{color:var(--ink2)}
.cont{color:var(--faint)}

/* footer */
.bot{color:var(--mute)}
.bot span:last-child{font-family:'LXGW WenKai';font-size:26px;letter-spacing:.2em}
.bar{background:var(--rule);height:2px}
.bar i{background:var(--dian);position:relative}
.bar i::after{content:'';position:absolute;right:-6px;top:-5px;width:12px;height:12px;background:var(--zhu)}

/* ---------- cover: indigo book cloth (书衣) + rice-paper title slip (题签) + cinnabar seal ---------- */
body:has(.ttl){background:var(--cloth)}
body:has(.ttl) .band{width:96px;background:#16273f}
body:has(.ttl) .band::before{opacity:1;
  background:linear-gradient(var(--thread),var(--thread)) 60px 0/2px 100% no-repeat,
  linear-gradient(var(--thread),var(--thread)) 0 128px/62px 2px no-repeat,linear-gradient(var(--thread),var(--thread)) 0 404px/62px 2px no-repeat,
  linear-gradient(var(--thread),var(--thread)) 0 676px/62px 2px no-repeat,linear-gradient(var(--thread),var(--thread)) 0 950px/62px 2px no-repeat}
.ttl{left:230px;right:150px;top:130px;bottom:130px;background:var(--paper);padding:0 120px;
  box-shadow:inset 0 0 0 20px var(--paper),inset 0 0 0 23px var(--ink),inset 0 0 0 29px var(--paper),inset 0 0 0 30px var(--ink)}
.ttl .tag{font-family:'Inter';font-weight:700;font-size:26px;letter-spacing:.32em;color:var(--zhu);position:relative}
.ttl .tag::after{content:'专八精读';position:absolute;right:0;bottom:-6px;writing-mode:vertical-rl;width:128px;height:128px;
  font-family:'LXGW WenKai';font-weight:700;font-size:46px;line-height:52px;letter-spacing:0;color:#fbf6ec;background:var(--zhu);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 12px;
  box-shadow:inset 0 0 0 5px var(--zhu),inset 0 0 0 7px #fbf6ec}
.ttl h1{font-family:'LXGW WenKai';font-weight:700;font-size:100px;line-height:1.22;color:var(--ink);margin:34px 0 30px;letter-spacing:.03em;text-wrap:balance}
.ttl .sub{font-family:'EB Garamond','LXGW WenKai';font-size:44px;color:var(--ink2)}
.ttl .sub i{color:var(--dian)}
.ttl .meta{font-family:'EB Garamond','LXGW WenKai';font-size:30px;border-top:2px solid var(--ink);color:var(--mute);margin-top:44px;padding-top:24px}
.legend{font-family:'LXGW WenKai';color:var(--ink2);right:300px;bottom:190px;font-size:26px}
.legend .lw{background:var(--dian)}
.legend .lp{background:var(--zhu);border-radius:4px}

/* 定稿补充：封面标题按字数排成一行（--n 由 title_slide 给出），不在词中间断行；中文译文避免末行只剩一两个字 */
.ttl h1{font-size:clamp(64px, calc(1240px / var(--n) / 1.03), 100px)}
.zh{text-wrap:pretty}

/* 用户 2026-10-10：中文翻译太小，放大约 15%（.68 → .78 倍英文字号）；为不挤小英文，中文行距 1.65 → 1.55、英中间距 .5 → .4、英文行距 1.5 → 1.45。
   481 屏重新适配：450 屏英文字号不变，31 屏长句英文小 2—4px；t09 第 18 句低于下限，加了分屏。 */
.zh{font-size:calc(var(--fs)*.78);line-height:1.55;margin-top:calc(var(--fs)*.4)}
.en{line-height:1.45}
</style><style>/* 专八大字版「书卷水墨」（用户 2026-10-23）：用原来的古风主题，沿用新的字体模式；看过样片后又要求“所有的字都用粗体”——
   英文、正文卡片里的中文译文、右边词汇卡的单词和中文释义、页眉页脚、片头，一律加粗（700）；生词、短语、词条再重一级（800）。
   字体都有真字重：EB Garamond 700/800、700 斜体（fonts/eb-garamond-bold.css），霞鹜文楷 Bold，思源宋体 700，Inter 700/800。颜色、纸张、印章仍是书卷水墨原样。
   译文“稍微大点”：字号.json 的 C@水墨 由 字号标定.py 按变体的 zh_scale（1.1）放大，不手改。 */
body, body *{font-weight:700 !important}
.en .w, .en .ph, .v b{font-weight:800 !important}
/* 书卷水墨原样式的 .zh{text-wrap:pretty} 会为了“末行不太短”把整个词推到下一行，上一行空出两三个字（layoutcheck 译文短行）；断行由引擎的规则管，恢复普通换行 */
.zh{text-wrap:wrap}
/* 用户 2026-10-23（看过 t01 样片）：右边词汇卡的单词要和文章里标注的颜色一样——文章里生词是蓝色（.w = --dian），词汇卡里的生词也用蓝色；
   短语在文章和词汇卡里本来就都是朱红（.v.ph b 选择器更具体，仍是 --zhu）。只改颜色，不影响换行 */
.v b{color:var(--dian)}
/* 用户 2026-10-23（看 t01 样片后）：原来的靛青生词“跟黑色正文差不多、不显眼”，朱砂短语“看着不太舒服”——“选两个看着最舒服、又比较显眼的颜色”。
   同一屏画了 4 组候选（晴空蓝+翠绿、宝蓝+松石绿、湖蓝+草木绿、钴蓝+紫罗兰）放大对比并实测：选 A 晴空蓝 #1f6fd6 + 翠绿 #2a9142——
   离黑色正文最远（CIELAB ΔE 75 / 71，原来的靛青只有 41），两色最分得开（ΔE 111；钴蓝+紫罗兰只有 24），对纸 4.2 / 3.5、对词汇栏 3.9 / 3.2
   （英文 73px 粗体属于大号字，可读下限 3:1）；也是校园版用户看过多种之后选定的蓝绿两色。只改生词、短语（文章、编号、词汇卡、片头图例），
   左边色条、进度条、片头的 Passage 字样仍是靛青，印章、页眉方块仍是朱砂。 */
:root{--w:#1f6fd6;--ph:#2a9142}
.w{color:var(--w)}sup{background:var(--w)}.v em{background:var(--w)}.v b{color:var(--w)}.legend .lw{background:var(--w)}
.ph{color:var(--ph)}.ph sup{background:var(--ph)}.v.ph em{background:var(--ph)}.v.ph b{color:var(--ph)}.legend .lp{background:var(--ph)}
/* 释义里的撇号用西文字形（fonts/eb-garamond-bold.css 的 InkQuote 只含 ‘ ’）：思源宋体的“’”是全角，“don’t”显示成“don’ t”（layoutcheck 西文撇号，t04、t05） */
.v span{font-family:'InkQuote','Noto Serif SC',serif}
/* 词条以 f 结尾（a lot of、a set of、a type of）：EB Garamond 粗体 f 的弯钩伸出字身，紧贴后面的释义（水墨截图盲审：“of一套”只空 6 像素，别的词条约 15 像素）；
   引擎给这类词条加 class f（make_video.py），这里补上弯钩伸出的那一截 */
.v b.f{padding-right:.16em}
/* 译文里的中文单引号（‘画’、‘伤心巷’，t13、t19、t27）：霞鹜文楷网页字体（lxgw-wenkai-webfont）各分包都不含 U+2018/2019，原来落到系统字体（layoutcheck 字体回退）；
   放在霞鹜文楷之后用 InkQuote（EB Garamond 粗体的 ‘ ’），只有这两个字落到它，其余字不变 */
.zh{font-family:'LXGW WenKai','InkQuote'}
