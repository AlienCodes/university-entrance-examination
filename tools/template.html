<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高考阅读词汇精读</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1b; --ink2:#5b5a55; --ink3:#8a8984; --line:#e4e2db;
  --accent:#2f5d8a; --accent-bg:#e8eff6;
  --core:#b45309; --core-bg:#fdf0dc;
  --ext:#7c3aed; --ext-bg:#efe7fd;
  --phr:#0f766e; --phr-bg:#dcf3ef;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink2:#b3b1aa; --ink3:#85837d; --line:#33322e;
    --accent:#8db8e6; --accent-bg:#22303d;
    --core:#f2a54a; --core-bg:#3a2a14;
    --ext:#b99bf7; --ext-bg:#2e2443;
    --phr:#4fd1c0; --phr-bg:#13332f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink2:#b3b1aa; --ink3:#85837d; --line:#33322e;
  --accent:#8db8e6; --accent-bg:#22303d;
  --core:#f2a54a; --core-bg:#3a2a14;
  --ext:#b99bf7; --ext-bg:#2e2443;
  --phr:#4fd1c0; --phr-bg:#13332f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3);letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
nav.cat{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;box-shadow:var(--shadow)}
.yr{padding:10px 14px 4px;font-weight:700;font-size:13px;color:var(--ink3);letter-spacing:.06em}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 14px;font-size:14px;line-height:1.35;color:var(--ink)}
.it:hover:not([disabled]){background:var(--accent-bg)}
.it.on{background:var(--accent-bg);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.it[disabled]{color:var(--ink3);cursor:default}
.it .n{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.it .todo{margin-left:auto;font-size:11px;color:var(--ink3)}
.catsel{display:none}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ph{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.ph .nm{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.03em}
.ph h1{font-size:24px;line-height:1.3;margin:4px 0 8px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.sum{margin:12px 0 0;font-size:14.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.tg.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tg.pri{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.core{background:var(--core)}.dot.ext{background:var(--ext)}.dot.phr{background:var(--phr)}
.body{padding:8px 22px 22px}
.para{padding:6px 0;border-bottom:1px dashed var(--line)}
.para:last-child{border-bottom:0}
.s{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:10px 0}
.s .k{font-size:12px;color:var(--ink3);padding-top:4px;font-variant-numeric:tabular-nums;text-align:right}
.en{font-size:17.5px;line-height:1.75;font-family:Georgia,"Times New Roman","Songti SC",serif}
.zh{font-size:15px;color:var(--ink2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;line-height:1.3;border-radius:7px;padding:3px 8px;border:1px solid transparent}
.chip b{font-weight:600;margin-right:4px}
.chip.core{background:var(--core-bg);color:var(--ink)}.chip.core b{color:var(--core)}
.chip.ext{background:var(--ext-bg);color:var(--ink)}.chip.ext b{color:var(--ext)}
.chip.phr{background:var(--phr-bg);color:var(--ink)}.chip.phr b{color:var(--phr)}
mark.w{background:none;color:inherit;border-radius:3px;padding:0 1px;cursor:pointer;border-bottom:2px solid}
mark.w.core{color:var(--core);border-color:var(--core);background:var(--core-bg)}
mark.w.ext{color:var(--ext);border-color:var(--ext);background:var(--ext-bg)}
mark.w.phr{color:var(--phr);border-color:var(--phr);background:var(--phr-bg)}
.nohl mark.w{color:inherit;background:none;border-color:transparent}
.nozh .zh{display:none}
.nochip .chips{display:none}
.pop{position:fixed;z-index:50;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px;display:none}
.pop h4{margin:0 0 2px;font-size:18px;font-family:Georgia,serif}
.pop .tier{font-size:11px;font-weight:600;letter-spacing:.04em}
.pop .m{margin:6px 0}
.pop .f{font-size:12px;color:var(--ink3)}
.pop button{margin-top:8px}
/* bank */
.bk-h{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.bk-h h1{font-size:22px;margin:0 0 4px}
.bk-h p{margin:0;color:var(--ink2);font-size:14px}
.bk-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.bk-c input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:14px}
.bk-c select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 8px;font-size:13px}
.rows{padding:4px 0}
.row{display:grid;grid-template-columns:28px minmax(120px,220px) minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:10px 22px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .hw{font-family:Georgia,serif;font-size:17px;font-weight:600}
.row .hw.core{color:var(--core)}.row .hw.ext{color:var(--ext)}.row .hw.phr{color:var(--phr)}
.row .mm{font-size:14px}
.row .src{grid-column:3/5;display:flex;flex-wrap:wrap;gap:4px}
.row .src button{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:1px 6px;color:var(--ink2)}
.row .src button[disabled]{opacity:.55;cursor:default}
.row .fq{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.known{opacity:.45}
.row input{margin-top:6px;width:16px;height:16px}
.empty{padding:30px 22px;color:var(--ink3);text-align:center}
/* reader mode */
.rd{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.rd.on{display:flex}
.rd-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rd-top .t{font-weight:600;font-size:14px;margin-right:auto}
.rd-main{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.rd-in{max-width:980px;width:100%}
.rd .en{font-size:clamp(22px,3.4vw,40px);line-height:1.6}
.rd .zh{font-size:clamp(17px,2.2vw,26px);margin-top:18px}
.rd .chips{margin-top:26px;gap:10px}
.rd .chip{font-size:clamp(14px,1.6vw,19px);padding:6px 12px}
.rd-bot{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.rd-bot .pg{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:70px;text-align:center}
.rd-bot button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 18px}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:12px}
  nav.cat{display:none}
  .catsel{display:block;width:100%;margin-bottom:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:15px}
  .ph,.bar,.body,.bk-h,.bk-c{padding-left:16px;padding-right:16px}
  .row{grid-template-columns:24px minmax(0,1fr) auto;padding:10px 16px}
  .row .mm{grid-column:2/4}
  .row .src{grid-column:2/4}
  .legend{margin-left:0;width:100%}
  .en{font-size:16.5px}
}

.it .todo{margin-left:auto;font-size:11px;color:var(--ink3)}
.it.todo-it{color:var(--ink2)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.player .lbl{font-size:13px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 12px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--panel);font-weight:600}
.play{border:0;background:var(--accent);color:var(--panel);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600}
.ptime{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:86px}
.pbar{flex:1 1 160px;height:6px;background:var(--line);border-radius:3px;cursor:pointer;position:relative;min-width:120px}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.s .k{cursor:pointer;border-radius:6px}
.s .k:hover{background:var(--accent-bg);color:var(--accent)}
.s .k::after{content:'▶';display:block;font-size:9px;opacity:.55;margin-top:2px}
.s.now{background:var(--accent-bg);border-radius:10px;box-shadow:-6px 0 0 var(--accent-bg),6px 0 0 var(--accent-bg)}
.s.now .k{color:var(--accent);font-weight:700}
.note{margin:0;padding:10px 22px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}
.rd-top .seg button{padding:3px 10px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">高考英语阅读 C·D 篇 · 词汇精读<small>2022–2026 全国及各省市真题 · 逐句翻译 · 生词标注</small></div>
  <div class="tabs" role="tablist"><button id="tabP" class="on">文章精读</button><button id="tabB">总词库</button></div>
</div></header>
<div class="wrap">
  <nav class="cat" id="cat"></nav>
  <main id="main"></main>
</div>
<div class="pop" id="pop"></div>
<div class="rd" id="rd">
  <div class="rd-top"><span class="t" id="rdT"></span>
    <span class="seg" id="rdV"></span><button class="tg pri" id="rdPlay">▶ 自动播放</button><button class="tg" id="rdZh">中文</button><button class="tg" id="rdCh">词表</button><button class="tg" id="rdX">退出 Esc</button></div>
  <div class="prog"><i id="rdP"></i></div>
  <div class="rd-main"><div class="rd-in" id="rdIn"></div></div>
  <div class="rd-bot"><button id="rdPrev">← 上一句</button><span class="pg" id="rdPg"></span><button id="rdNext">下一句 →</button></div>
</div>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
