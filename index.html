<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高考阅读词汇精读</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1b; --ink2:#5b5a55; --ink3:#8a8984; --line:#e4e2db;
  --accent:#2f5d8a; --accent-bg:#e8eff6;
  --core:#b45309; --core-bg:#fdf0dc;
  --ext:#7c3aed; --ext-bg:#efe7fd;
  --phr:#0f766e; --phr-bg:#dcf3ef;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink2:#b3b1aa; --ink3:#85837d; --line:#33322e;
    --accent:#8db8e6; --accent-bg:#22303d;
    --core:#f2a54a; --core-bg:#3a2a14;
    --ext:#b99bf7; --ext-bg:#2e2443;
    --phr:#4fd1c0; --phr-bg:#13332f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink2:#b3b1aa; --ink3:#85837d; --line:#33322e;
  --accent:#8db8e6; --accent-bg:#22303d;
  --core:#f2a54a; --core-bg:#3a2a14;
  --ext:#b99bf7; --ext-bg:#2e2443;
  --phr:#4fd1c0; --phr-bg:#13332f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3);letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
nav.cat{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;box-shadow:var(--shadow)}
.yr{padding:10px 14px 4px;font-weight:700;font-size:13px;color:var(--ink3);letter-spacing:.06em}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 14px;font-size:14px;line-height:1.35;color:var(--ink)}
.it:hover:not([disabled]){background:var(--accent-bg)}
.it.on{background:var(--accent-bg);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.it[disabled]{color:var(--ink3);cursor:default}
.it .n{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.it .todo{margin-left:auto;font-size:11px;color:var(--ink3)}
.catsel{display:none}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ph{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.ph .nm{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.03em}
.ph h1{font-size:24px;line-height:1.3;margin:4px 0 8px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.sum{margin:12px 0 0;font-size:14.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.tg.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tg.pri{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.core{background:var(--core)}.dot.ext{background:var(--ext)}.dot.phr{background:var(--phr)}
.body{padding:8px 22px 22px}
.para{padding:6px 0;border-bottom:1px dashed var(--line)}
.para:last-child{border-bottom:0}
.s{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:10px 0}
.s .k{font-size:12px;color:var(--ink3);padding-top:4px;font-variant-numeric:tabular-nums;text-align:right}
.en{font-size:17.5px;line-height:1.75;font-family:Georgia,"Times New Roman","Songti SC",serif}
.zh{font-size:15px;color:var(--ink2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;line-height:1.3;border-radius:7px;padding:3px 8px;border:1px solid transparent}
.chip b{font-weight:600;margin-right:4px}
.chip.core{background:var(--core-bg);color:var(--ink)}.chip.core b{color:var(--core)}
.chip.ext{background:var(--ext-bg);color:var(--ink)}.chip.ext b{color:var(--ext)}
.chip.phr{background:var(--phr-bg);color:var(--ink)}.chip.phr b{color:var(--phr)}
mark.w{background:none;color:inherit;border-radius:3px;padding:0 1px;cursor:pointer;border-bottom:2px solid}
mark.w.core{color:var(--core);border-color:var(--core);background:var(--core-bg)}
mark.w.ext{color:var(--ext);border-color:var(--ext);background:var(--ext-bg)}
mark.w.phr{color:var(--phr);border-color:var(--phr);background:var(--phr-bg)}
.nohl mark.w{color:inherit;background:none;border-color:transparent}
.nozh .zh{display:none}
.nochip .chips{display:none}
.pop{position:fixed;z-index:50;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px;display:none}
.pop h4{margin:0 0 2px;font-size:18px;font-family:Georgia,serif}
.pop .tier{font-size:11px;font-weight:600;letter-spacing:.04em}
.pop .m{margin:6px 0}
.pop .f{font-size:12px;color:var(--ink3)}
.pop button{margin-top:8px}
/* bank */
.bk-h{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.bk-h h1{font-size:22px;margin:0 0 4px}
.bk-h p{margin:0;color:var(--ink2);font-size:14px}
.bk-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.bk-c input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:14px}
.bk-c select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 8px;font-size:13px}
.rows{padding:4px 0}
.row{display:grid;grid-template-columns:28px minmax(120px,220px) minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:10px 22px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .hw{font-family:Georgia,serif;font-size:17px;font-weight:600}
.row .hw.core{color:var(--core)}.row .hw.ext{color:var(--ext)}.row .hw.phr{color:var(--phr)}
.row .mm{font-size:14px}
.row .src{grid-column:3/5;display:flex;flex-wrap:wrap;gap:4px}
.row .src button{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:1px 6px;color:var(--ink2)}
.row .src button[disabled]{opacity:.55;cursor:default}
.row .fq{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.known{opacity:.45}
.row input{margin-top:6px;width:16px;height:16px}
.empty{padding:30px 22px;color:var(--ink3);text-align:center}
/* reader mode */
.rd{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.rd.on{display:flex}
.rd-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rd-top .t{font-weight:600;font-size:14px;margin-right:auto}
.rd-main{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.rd-in{max-width:980px;width:100%}
.rd .en{font-size:clamp(22px,3.4vw,40px);line-height:1.6}
.rd .zh{font-size:clamp(17px,2.2vw,26px);margin-top:18px}
.rd .chips{margin-top:26px;gap:10px}
.rd .chip{font-size:clamp(14px,1.6vw,19px);padding:6px 12px}
.rd-bot{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.rd-bot .pg{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:70px;text-align:center}
.rd-bot button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 18px}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:12px}
  nav.cat{display:none}
  .catsel{display:block;width:100%;margin-bottom:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:15px}
  .ph,.bar,.body,.bk-h,.bk-c{padding-left:16px;padding-right:16px}
  .row{grid-template-columns:24px minmax(0,1fr) auto;padding:10px 16px}
  .row .mm{grid-column:2/4}
  .row .src{grid-column:2/4}
  .legend{margin-left:0;width:100%}
  .en{font-size:16.5px}
}
</style>
</head>

 of thousands of trees each year.", "zh": "为了配合扩大绿地的长期计划，纽约市每年都种植数以万计的树木。", "w": [{"t": "phr", "h": "in line with", "m": "与……一致；按照", "sp": [[0, 12]]}, {"t": "ext", "h": "longstanding", "m": "adj. 长期存在的", "sp": [[13, 25]]}, {"t": "core", "h": "initiative", "m": "n. 倡议；（新）计划", "sp": [[26, 37]]}, {"t": "core", "h": "expand", "m": "v. 扩大", "sp": [[41, 47]]}, {"t": "phr", "h": "tens of thousands of", "m": "数以万计的", "sp": [[92, 112]]}, {"t": "core", "h": "plant", "m": "v. 种植", "sp": [[83, 91]]}]}, {"en": "They provide shade, lower surface temperatures, absorb a surprising amount of airborne carbon, remove tiny pollutants, and provide wildlife habitat along with just plain beauty.", "zh": "它们提供树荫，降低地表温度，吸收数量惊人的空气中的碳，清除微小的污染物，为野生动物提供栖息地，同时还带来纯粹的美感。", "w": [{"t": "core", "h": "shade", "m": "n. 树荫", "sp": [[13, 18]]}, {"t": "core", "h": "lower", "m": "v. 降低", "sp": [[20, 25]]}, {"t": "core", "h": "surface", "m": "n. 表面；地表", "sp": [[26, 33]]}, {"t": "core", "h": "absorb", "m": "v. 吸收", "sp": [[48, 54]]}, {"t": "ext", "h": "airborne", "m": "adj. 空气中的；空气传播的", "sp": [[78, 86]]}, {"t": "core", "h": "carbon", "m": "n. 碳", "sp": [[87, 93]]}, {"t": "core", "h": "pollutant", "m": "n. 污染物", "sp": [[107, 117]]}, {"t": "core", "h": "wildlife", "m": "n. 野生动物", "sp": [[131, 139]]}, {"t": "core", "h": "habitat", "m": "n. 栖息地", "sp": [[140, 147]]}, {"t": "phr", "h": "along with", "m": "连同；以及", "sp": [[148, 158]]}, {"t": "core", "h": "plain", "m": "adj. 纯粹的；朴素的", "sp": [[164, 169]]}]}], [{"en": "Something could go wrong, though, according to a new study.", "zh": "不过，根据一项新研究，这件事也可能出问题。", "w": [{"t": "phr", "h": "go wrong", "m": "出问题；出差错", "sp": [[16, 24]]}, {"t": "phr", "h": "according to", "m": "根据", "sp": [[34, 46]]}]}, {"en": "Oaks and sweetgums, which currently account for a majority of the city’s trees, produce huge amounts of a chemical substance called isoprene.", "zh": "橡树和枫香树目前占该市树木的大多数，它们会产生大量一种叫作异戊二烯的化学物质。", "w": [{"t": "ext", "h": "oak", "m": "n. 橡树", "sp": [[0, 4]]}, {"t": "ext", "h": "sweetgum", "m": "n. 枫香树", "sp": [[9, 18]]}, {"t": "core", "h": "currently", "m": "adv. 目前", "sp": [[26, 35]]}, {"t": "phr", "h": "account for", "m": "（数量上）占", "sp": [[36, 47]]}, {"t": "core", "h": "majority", "m": "n. 大多数", "sp": [[50, 58]]}, {"t": "core", "h": "chemical", "m": "adj. 化学的", "sp": [[106, 114]]}, {"t": "core", "h": "substance", "m": "n. 物质", "sp": [[115, 124]]}, {"t": "ext", "h": "isoprene", "m": "n. 异戊二烯", "sp": [[132, 140]]}]}, {"en": "Harmless by itself, isoprene interacts rapidly with polluting nitrogen oxides released by vehicles, buildings and industry to form ground-level ozone (臭氧) — a major factor in many breathing problems.", "zh": "异戊二烯本身无害，但它会与车辆、建筑和工业排放的污染性氮氧化物迅速发生反应，生成近地面臭氧——这是导致许多呼吸问题的主要因素。", "w": [{"t": "core", "h": "harmless", "m": "adj. 无害的", "sp": [[0, 8]]}, {"t": "phr", "h": "by itself", "m": "本身；单独地", "sp": [[9, 18]]}, {"t": "core", "h": "interact", "m": "v. 相互作用；发生反应", "sp": [[29, 38]]}, {"t": "core", "h": "rapidly", "m": "adv. 迅速地", "sp": [[39, 46]]}, {"t": "core", "h": "pollute", "m": "v. 污染", "sp": [[52, 61]]}, {"t": "ext", "h": "nitrogen", "m": "n. 氮", "sp": [[62, 70]]}, {"t": "ext", "h": "oxide", "m": "n. 氧化物", "sp": [[71, 77]]}, {"t": "core", "h": "release", "m": "v. 释放；排放", "sp": [[78, 86]]}, {"t": "core", "h": "vehicle", "m": "n. 车辆", "sp": [[90, 98]]}, {"t": "core", "h": "industry", "m": "n. 工业", "sp": [[114, 122]]}, {"t": "ext", "h": "ozone", "m": "n. 臭氧", "sp": [[144, 149]]}, {"t": "core", "h": "factor", "m": "n. 因素", "sp": [[165, 171]]}, {"t": "core", "h": "breathe", "m": "v. 呼吸", "sp": [[180, 189]]}]}], [{"en": "The research, carried out by scientists at the Columbia Climate School and other institutions, found that if the city maintains past species patterns in new plantings, isoprene production in Manhattan in coming decades will go up by about 140%, and resulting summer ozone levels as much as 30%.", "zh": "这项由哥伦比亚大学气候学院及其他机构的科学家开展的研究发现，如果该市在新种植中沿用过去的树种结构，未来几十年曼哈顿的异戊二烯产量将增加约140%，由此导致的夏季臭氧水平最多会上升30%。", "w": [{"t": "phr", "h": "carry out", "m": "开展；实施", "sp": [[14, 25]]}, {"t": "core", "h": "institution", "m": "n. 机构", "sp": [[81, 93]]}, {"t": "core", "h": "maintain", "m": "v. 保持；维持", "sp": [[118, 127]]}, {"t": "core", "h": "species", "m": "n. 物种", "sp": [[133, 140]]}, {"t": "core", "h": "pattern", "m": "n. 模式；格局", "sp": [[141, 149]]}, {"t": "core", "h": "production", "m": "n. 产生；产量", "sp": [[177, 187]]}, {"t": "core", "h": "decade", "m": "n. 十年", "sp": [[211, 218]]}, {"t": "phr", "h": "go up", "m": "上升", "sp": [[224, 229]]}, {"t": "core", "h": "result", "m": "v. 由……产生；导致", "sp": [[249, 258]]}, {"t": "phr", "h": "as much as", "m": "多达", "sp": [[279, 289]]}]}], [{"en": "“We’re all for planting more trees.", "zh": "“我们完全赞成多种树。", "w": [{"t": "phr", "h": "be all for", "m": "完全赞成", "sp": [[7, 14]]}]}, {"en": "They bring so many good things,” said study coauthor Róisín Commane.", "zh": "树木带来了那么多好处，”该研究的合著者罗伊辛·康曼说。", "w": [{"t": "ext", "h": "coauthor", "m": "n. 合著者", "sp": [[44, 52]]}]}, {"en": "“But if we’re not careful, we could make air quality worse.”", "zh": "“但如果我们不小心，就可能让空气质量变得更糟。”", "w": [{"t": "core", "h": "quality", "m": "n. 质量", "sp": [[45, 52]]}]}], [{"en": "The Parks Department is not oblivious to the issue.", "zh": "公园管理局并非没有意识到这个问题。", "w": [{"t": "core", "h": "department", "m": "n. 部门", "sp": [[10, 20]]}, {"t": "ext", "h": "oblivious", "m": "adj. 未察觉的；没意识到的", "sp": [[28, 37]]}, {"t": "core", "h": "issue", "m": "n. 问题", "sp": [[45, 50]]}]}, {"en": "A study carried out by some of its researchers several years ago concluded that city trees did release isoprene.", "zh": "几年前该局部分研究人员开展的一项研究就得出结论：城市树木确实会释放异戊二烯。", "w": [{"t": "core", "h": "conclude", "m": "v. 得出结论", "sp": [[65, 74]]}]}, {"en": "“We didn’t make a big deal of that,” said Novem Auyeung, a Parks Department senior scientist.", "zh": "“我们当时没把这当回事，”公园管理局的资深科学家诺文·欧阳说。", "w": [{"t": "phr", "h": "make a big deal of", "m": "把……当回事；小题大做", "sp": [[11, 29]]}, {"t": "core", "h": "senior", "m": "adj. 资深的；高级的", "sp": [[76, 82]]}]}, {"en": "She said trees should not be viewed as the enemy.", "zh": "她说，不应该把树木视为敌人。", "w": [{"t": "phr", "h": "view…as", "m": "把……看作", "sp": [[29, 35], [36, 38]]}, {"t": "core", "h": "enemy", "m": "n. 敌人", "sp": [[43, 48]]}]}, {"en": "“We could plant any trees we want to, if we just rethink our car-centric lifestyle,” she said.", "zh": "“只要我们重新审视以汽车为中心的生活方式，我们想种什么树都可以，”她说。", "w": [{"t": "core", "h": "rethink", "m": "v. 重新考虑", "sp": [[49, 56]]}, {"t": "ext", "h": "car-centric", "m": "adj. 以汽车为中心的", "sp": [[61, 72]]}, {"t": "core", "h": "lifestyle", "m": "n. 生活方式", "sp": [[73, 82]]}]}], [{"en": "“We’re not going to go cutting down any big old oaks,” and neither will the department completely stop planting new ones, said Auyeung.", "zh": "“我们不会去砍掉任何高大的老橡树，”欧阳说，管理局也不会完全停止种植新的橡树。", "w": [{"t": "phr", "h": "cut down", "m": "砍倒", "sp": [[23, 35]]}, {"t": "core", "h": "completely", "m": "adv. 完全地", "sp": [[87, 97]]}]}, {"en": "“You have to think about what you would lose if you do that.”", "zh": "“你得想想，如果那样做，你会失去什么。”", "w": []}, {"en": "Oaks are keystone species, she pointed out, providing food and habitat for native insects, birds and other animals.", "zh": "她指出，橡树是关键物种，为本地的昆虫、鸟类和其他动物提供食物和栖息地。", "w": [{"t": "ext", "h": "keystone species", "m": "关键物种", "sp": [[9, 25]]}, {"t": "phr", "h": "point out", "m": "指出", "sp": [[31, 42]]}, {"t": "core", "h": "native", "m": "adj. 本地的；土生的", "sp": [[75, 81]]}, {"t": "core", "h": "insect", "m": "n. 昆虫", "sp": [[82, 89]]}]}]], "nv": 70}, {"id": "p59", "year": 2026, "paper": "全国Ⅰ卷", "part": "D", "words": 323, "file": "f37", "name": "2026 全国Ⅰ卷 阅读D", "done": true, "title": "欣赏艺术之美能激发抽象思维", "genre": "说明文 · 心理学研究", "summary": "剑桥心理学家在美术馆做实验：主动评判作品美感的一组，抽象思维得分比对照组平均高约14%，有艺术爱好的人高出25%以上，而且更多产生被感动、受启发的“自我超越”感受；但他们并没有更快乐，说明起作用的是对美的投入。研究者认为欣赏美可能是开启抽象思维的理想方式。", "paras": [[{"en": "A team of Cambridge psychologists conducted an experiment to compare the cognitive (认知的) effects of merely seeing art with actively judging how beautiful it is.", "zh": "剑桥大学的一个心理学家团队开展了一项实验，比较仅仅观看艺术与主动评判艺术之美对认知产生的不同影响。", "w": [{"t": "core", "h": "psychologist", "m": "n. 心理学家", "sp": [[20, 33]]}, {"t": "core", "h": "conduct", "m": "v. 实施；开展", "sp": [[34, 43]]}, {"t": "core", "h": "experiment", "m": "n. 实验", "sp": [[47, 57]]}, {"t": "phr", "h": "compare…with", "m": "把……与……比较", "sp": [[61, 68], [118, 122]]}, {"t": "core", "h": "cognitive", "m": "adj. 认知的", "sp": [[73, 82]]}, {"t": "core", "h": "effect", "m": "n. 影响；效果", "sp": [[89, 96]]}, {"t": "core", "h": "merely", "m": "adv. 仅仅", "sp": [[100, 106]]}, {"t": "core", "h": "actively", "m": "adv. 主动地", "sp": [[123, 131]]}, {"t": "core", "h": "judge", "m": "v. 判断；评判", "sp": [[132, 139]]}]}], [{"en": "In the study, 187 people were invited to visit Kettle’s Yard gallery during an exhibition of handmade clay objects.", "zh": "在研究中，187人受邀在一场手工陶土作品展期间参观了凯特尔庭院美术馆。", "w": [{"t": "core", "h": "invite", "m": "v. 邀请", "sp": [[30, 37]]}, {"t": "core", "h": "gallery", "m": "n. 美术馆；画廊", "sp": [[61, 68]]}, {"t": "core", "h": "exhibition", "m": "n. 展览", "sp": [[79, 89]]}, {"t": "core", "h": "handmade", "m": "adj. 手工制作的", "sp": [[93, 101]]}, {"t": "ext", "h": "clay", "m": "n. 黏土；陶土", "sp": [[102, 106]]}, {"t": "core", "h": "object", "m": "n. 物体；物品", "sp": [[107, 114]]}]}, {"en": "Participants were randomly divided into two groups: the “beauty” group was asked to actively consider and then rate the beauty of each object they viewed, while the control group just matched a line drawing of the object with the artwork itself.", "zh": "参与者被随机分成两组：“美感组”被要求主动思考，并给所看到的每件作品的美打分；而对照组只需把作品的线描图和作品本身配对。", "w": [{"t": "core", "h": "participant", "m": "n. 参与者", "sp": [[0, 12]]}, {"t": "core", "h": "randomly", "m": "adv. 随机地", "sp": [[18, 26]]}, {"t": "phr", "h": "divide…into", "m": "把……分成", "sp": [[27, 34], [35, 39]]}, {"t": "core", "h": "rate", "m": "v. 评分；评价", "sp": [[111, 115]]}, {"t": "core", "h": "view", "m": "v. 观看", "sp": [[147, 153]]}, {"t": "phr", "h": "control group", "m": "对照组", "sp": [[165, 178]]}, {"t": "phr", "h": "match…with", "m": "把……与……匹配", "sp": [[184, 191], [221, 225]]}, {"t": "core", "h": "artwork", "m": "n. 艺术品", "sp": [[230, 237]]}]}, {"en": "All participants were then tested on how they process information, and whether it’s in a more practical or abstract way.", "zh": "随后，所有参与者都接受了测试，看他们如何处理信息，是更偏向实际的方式，还是更抽象的方式。", "w": [{"t": "core", "h": "process", "m": "v. 处理", "sp": [[46, 53]]}, {"t": "core", "h": "practical", "m": "adj. 实际的；务实的", "sp": [[94, 103]]}, {"t": "core", "h": "abstract", "m": "adj. 抽象的", "sp": [[107, 115]]}]}], [{"en": "Across all participants, those in the beauty group scored almost 14% higher on average than the control group in abstract thinking.", "zh": "从全体参与者来看，美感组在抽象思维上的得分平均比对照组高出近14%。", "w": [{"t": "core", "h": "score", "m": "v. 得分", "sp": [[51, 57]]}, {"t": "phr", "h": "on average", "m": "平均", "sp": [[76, 86]]}]}, {"en": "While they were told the study was about cognitive processes, participants were asked about interests, with around half saying they had an artistic hobby.", "zh": "虽然参与者被告知这项研究是关于认知过程的，但他们也被问及兴趣爱好，约一半人说自己有艺术方面的爱好。", "w": [{"t": "core", "h": "artistic", "m": "adj. 艺术的", "sp": [[139, 147]]}, {"t": "core", "h": "hobby", "m": "n. 爱好", "sp": [[148, 153]]}]}, {"en": "Among those, the effect was greater: those with an artistic hobby in the beauty group scored over 25% higher on average for abstract thinking than those with an artistic hobby in the control group.", "zh": "在这些人当中，效果更明显：美感组中有艺术爱好的人，抽象思维平均得分比对照组中有艺术爱好的人高出25%以上。", "w": []}], [{"en": "Emotional states of participants were also measured by asking about their feelings while completing the gallery task.", "zh": "研究人员还通过询问参与者完成美术馆任务时的感受，测量了他们的情绪状态。", "w": [{"t": "core", "h": "emotional", "m": "adj. 情绪的；情感的", "sp": [[0, 9]]}, {"t": "core", "h": "state", "m": "n. 状态", "sp": [[10, 16]]}, {"t": "core", "h": "measure", "m": "v. 测量", "sp": [[43, 51]]}, {"t": "core", "h": "complete", "m": "v. 完成", "sp": [[89, 99]]}, {"t": "core", "h": "task", "m": "n. 任务", "sp": [[112, 116]]}]}, {"en": "Across all participants, those in the beauty group reported an average of 23% higher levels of “transformative and self-transcendent feelings” — such as feeling moved, enlightened and inspired — than the control group.", "zh": "从全体参与者来看，美感组报告的“转变性和自我超越的感受”——比如被感动、受启迪、受鼓舞——平均比对照组高出23%。", "w": [{"t": "core", "h": "report", "m": "v. 报告；说出", "sp": [[51, 59]]}, {"t": "core", "h": "average", "m": "n. 平均数", "sp": [[63, 70]]}, {"t": "ext", "h": "transformative", "m": "adj. 使发生转变的", "sp": [[96, 110]]}, {"t": "ext", "h": "self-transcendent", "m": "adj. 超越自我的", "sp": [[115, 132]]}, {"t": "core", "h": "move", "m": "v. 感动", "sp": [[161, 166]]}, {"t": "ext", "h": "enlighten", "m": "v. 启发；使领悟", "sp": [[168, 179]]}, {"t": "core", "h": "inspire", "m": "v. 鼓舞；激励", "sp": [[184, 192]]}]}, {"en": "Importantly, however, the beauty group did not report feeling any happier than the control group, suggesting that it was the engagement with beauty that influenced abstract thinking, rather than any overall positivity from the experience.", "zh": "但重要的是，美感组并没有表示自己比对照组更快乐，这说明影响抽象思维的是对美的投入，而不是这次体验带来的整体积极情绪。", "w": [{"t": "core", "h": "importantly", "m": "adv. 重要的是", "sp": [[0, 11]]}, {"t": "core", "h": "suggest", "m": "v. 表明；暗示", "sp": [[98, 108]]}, {"t": "core", "h": "engagement", "m": "n. 投入；参与", "sp": [[125, 135]]}, {"t": "core", "h": "influence", "m": "v. 影响", "sp": [[153, 163]]}, {"t": "phr", "h": "rather than", "m": "而不是", "sp": [[183, 194]]}, {"t": "core", "h": "overall", "m": "adj. 总体的；全面的", "sp": [[199, 206]]}, {"t": "ext", "h": "positivity", "m": "n. 积极情绪", "sp": [[207, 217]]}, {"t": "core", "h": "experience", "m": "n. 体验；经历", "sp": [[227, 237]]}]}], [{"en": "“We usually think in very concrete terms when doing something on a screen,” said Simone Schnall, senior author of the study.", "zh": "“我们在屏幕上做事时，通常是用非常具体的方式思考，”该研究的资深作者西蒙娜·施纳尔说。", "w": [{"t": "core", "h": "concrete", "m": "adj. 具体的", "sp": [[26, 34]]}, {"t": "phr", "h": "in…terms", "m": "从……角度；以……方式", "sp": [[18, 20], [35, 40]]}, {"t": "core", "h": "screen", "m": "n. 屏幕", "sp": [[67, 73]]}, {"t": "core", "h": "author", "m": "n. 作者", "sp": [[104, 110]]}]}, {"en": "“It’s becoming much rarer to zone out and just let the mind wander, but that’s when we think in ways that broaden our minds.", "zh": "“放空自己、任思绪漫游的时候越来越少了，但恰恰是在那种时候，我们的思考方式能开阔思维。", "w": [{"t": "core", "h": "rare", "m": "adj. 罕见的；少有的", "sp": [[20, 25]]}, {"t": "phr", "h": "zone out", "m": "走神；放空", "sp": [[29, 37]]}, {"t": "core", "h": "wander", "m": "v. 漫游；（思绪）游离", "sp": [[60, 66]]}, {"t": "core", "h": "broaden", "m": "v. 拓宽；开阔", "sp": [[106, 113]]}]}, {"en": "Admiring the beauty of art may be the ideal way to initiate the abstract cognitive processes.”", "zh": "欣赏艺术之美，可能是开启抽象认知过程的理想方式。”", "w": [{"t": "core", "h": "admire", "m": "v. 欣赏；钦佩", "sp": [[0, 8]]}, {"t": "core", "h": "ideal", "m": "adj. 理想的", "sp": [[38, 43]]}, {"t": "core", "h": "initiate", "m": "v. 开始；启动", "sp": [[51, 59]]}]}]], "nv": 61}, {"id": "p60", "year": 2026, "paper": "全国Ⅱ卷", "part": "C", "words": 311, "file": "f38", "name": "2026 全国Ⅱ卷 阅读C", "done": true, "title": "海拔的“零点”：海平面概念的历史", "genre": "说明文 · 书籍序言", "summary": "作者指出海拔是相对的，必须有参照点；而“海平面”这个参照点本身是由技术和文化假设决定、有自己历史的概念。他在山中徒步时因测高仪读数不一致而萌生写书的念头，书中考察了平均海平面历史上的三个关键阶段，并指出海平面上升问题日益紧迫。", "paras": [[{"en": "The peak of Mount Qomolangma, 8,849 meters above sea level.", "zh": "珠穆朗玛峰峰顶，海拔8849米。", "w": [{"t": "core", "h": "peak", "m": "n. 山峰；顶峰", "sp": [[4, 8]]}, {"t": "core", "h": "meter", "m": "n. 米", "sp": [[36, 42]]}, {"t": "phr", "h": "above sea level", "m": "海拔（高于海平面）", "sp": [[43, 58]]}]}, {"en": "Chimborazo, 6,263 m; Mont Blanc, 4,806 m; Pradidali hut, at the foot of the Pala group in the Dolomites, 2,278 m.", "zh": "钦博拉索山，6263米；勃朗峰，4806米；位于多洛米蒂山脉帕拉山群脚下的普拉迪达利小屋，2278米。", "w": [{"t": "core", "h": "hut", "m": "n. 小屋", "sp": [[52, 55]]}, {"t": "phr", "h": "at the foot of", "m": "在……脚下", "sp": [[57, 71]]}]}, {"en": "It is common practice to provide the elevation (高度) of a place.", "zh": "标出一个地方的海拔高度是一种常见做法。", "w": [{"t": "phr", "h": "common practice", "m": "常见做法", "sp": [[6, 21]]}, {"t": "core", "h": "provide", "m": "v. 提供", "sp": [[25, 32]]}, {"t": "ext", "h": "elevation", "m": "n. 海拔；高度", "sp": [[37, 46]]}]}, {"en": "Simple readings are now readily available on our phones and wearables.", "zh": "如今，在手机和可穿戴设备上就能轻松获取简单的读数。", "w": [{"t": "core", "h": "reading", "m": "n. 读数", "sp": [[7, 15]]}, {"t": "core", "h": "readily", "m": "adv. 容易地；随时", "sp": [[24, 31]]}, {"t": "core", "h": "available", "m": "adj. 可获得的", "sp": [[32, 41]]}, {"t": "ext", "h": "wearable", "m": "n. 可穿戴设备", "sp": [[60, 69]]}]}, {"en": "But elevation is necessarily relative: only the choice of a reference point allows us to express numerically the height of an object or a location.", "zh": "但海拔必然是相对的：只有选定一个参照点，我们才能用数字表示某个物体或地点的高度。", "w": [{"t": "core", "h": "necessarily", "m": "adv. 必然地", "sp": [[17, 28]]}, {"t": "core", "h": "relative", "m": "adj. 相对的", "sp": [[29, 37]]}, {"t": "phr", "h": "reference point", "m": "参照点", "sp": [[60, 75]]}, {"t": "phr", "h": "allow…to", "m": "允许；使能够", "sp": [[76, 82], [86, 88]]}, {"t": "core", "h": "express", "m": "v. 表达；表示", "sp": [[89, 96]]}, {"t": "ext", "h": "numerically", "m": "adv. 用数字地", "sp": [[97, 108]]}, {"t": "core", "h": "location", "m": "n. 地点；位置", "sp": [[138, 146]]}]}], [{"en": "The idea of sea level as a reference point for elevations has by now been around for so long as to go essentially unnoticed — we mention it without even considering what it means.", "zh": "把海平面作为海拔参照点的观念由来已久，以至于基本上没人注意到它——我们提到它时，甚至都不会去想它意味着什么。", "w": [{"t": "phr", "h": "be around", "m": "存在；出现", "sp": [[69, 80]]}, {"t": "phr", "h": "so…as to", "m": "如此……以至于", "sp": [[85, 87], [93, 98]]}, {"t": "core", "h": "essentially", "m": "adv. 基本上；本质上", "sp": [[102, 113]]}, {"t": "core", "h": "unnoticed", "m": "adj. 未被注意的", "sp": [[114, 123]]}, {"t": "core", "h": "mention", "m": "v. 提到", "sp": [[129, 136]]}, {"t": "core", "h": "consider", "m": "v. 考虑", "sp": [[153, 164]]}]}, {"en": "That the concept has a history is easily ignored.", "zh": "这个概念有它自己的历史，这一点很容易被忽视。", "w": [{"t": "core", "h": "concept", "m": "n. 概念", "sp": [[9, 16]]}, {"t": "core", "h": "ignore", "m": "v. 忽视", "sp": [[41, 48]]}]}, {"en": "We tend to forget that sea level is a product of technically and culturally determined assumptions.", "zh": "我们往往会忘记，海平面是由技术和文化所决定的种种假设的产物。", "w": [{"t": "phr", "h": "tend to", "m": "往往会；倾向于", "sp": [[3, 10]]}, {"t": "core", "h": "product", "m": "n. 产物", "sp": [[38, 45]]}, {"t": "core", "h": "technically", "m": "adv. 技术上", "sp": [[49, 60]]}, {"t": "core", "h": "culturally", "m": "adv. 文化上", "sp": [[65, 75]]}, {"t": "core", "h": "determine", "m": "v. 决定", "sp": [[76, 86]]}, {"t": "core", "h": "assumption", "m": "n. 假设", "sp": [[87, 98]]}]}, {"en": "In this book, I tell a story of these assumptions.", "zh": "在这本书中，我讲述的就是这些假设的故事。", "w": []}], [{"en": "Appropriately, the book took shape during a summer spent between sea and mountains.", "zh": "恰如其分的是，这本书是在一个往返于大海与群山之间的夏天里成形的。", "w": [{"t": "core", "h": "appropriately", "m": "adv. 恰当地", "sp": [[0, 13]]}, {"t": "phr", "h": "take shape", "m": "成形", "sp": [[24, 34]]}]}, {"en": "A month after visiting the French Riviera and enjoying the sandy beaches of Nice and Menton, I went hiking with friends in the Pala group.", "zh": "在游览法国里维埃拉、享受了尼斯和芒通的沙滩一个月后，我和朋友们去帕拉山群徒步。", "w": [{"t": "core", "h": "sandy", "m": "adj. 多沙的；沙质的", "sp": [[59, 64]]}, {"t": "phr", "h": "go hiking", "m": "去徒步旅行", "sp": [[95, 106]]}]}, {"en": "Resting on a pass near the Pradidali hut, we began discussing the readings offered by our altimeters (测高仪).", "zh": "在普拉迪达利小屋附近的一处山口休息时，我们开始讨论各自测高仪给出的读数。", "w": [{"t": "core", "h": "pass", "m": "n. 山口；关隘", "sp": [[13, 17]]}, {"t": "core", "h": "discuss", "m": "v. 讨论", "sp": [[51, 61]]}, {"t": "core", "h": "offer", "m": "v. 提供；给出", "sp": [[75, 82]]}, {"t": "ext", "h": "altimeter", "m": "n. 测高仪", "sp": [[90, 100]]}]}, {"en": "Why did they vary ever so slightly from one instrument to the next?", "zh": "为什么不同仪器之间的读数会有那么一丁点差异呢？", "w": [{"t": "core", "h": "vary", "m": "v. 不同；变化", "sp": [[13, 17]]}, {"t": "phr", "h": "ever so", "m": "非常；极其", "sp": [[18, 25]]}, {"t": "core", "h": "slightly", "m": "adv. 稍微", "sp": [[26, 34]]}, {"t": "core", "h": "instrument", "m": "n. 仪器", "sp": [[44, 54]]}]}, {"en": "This sense of uncertainty led me to think about the meaning of zero.", "zh": "这种不确定感促使我思考“零”的含义。", "w": [{"t": "core", "h": "uncertainty", "m": "n. 不确定性", "sp": [[14, 25]]}, {"t": "phr", "h": "lead…to", "m": "导致；促使", "sp": [[26, 29], [33, 35]]}]}, {"en": "This is how I began my search for the conceptual history of sea level.", "zh": "我就是这样开始探寻海平面这一概念的历史的。", "w": [{"t": "phr", "h": "search for", "m": "寻找；探寻", "sp": [[23, 33]]}, {"t": "ext", "h": "conceptual", "m": "adj. 概念的", "sp": [[38, 48]]}]}], [{"en": "In this book I examine three crucial stages in the history of mean sea level.", "zh": "在本书中，我考察了平均海平面历史上的三个关键阶段。", "w": [{"t": "core", "h": "examine", "m": "v. 考察；审视", "sp": [[15, 22]]}, {"t": "core", "h": "crucial", "m": "adj. 关键的", "sp": [[29, 36]]}, {"t": "core", "h": "stage", "m": "n. 阶段", "sp": [[37, 43]]}, {"t": "core", "h": "mean", "m": "adj. 平均的", "sp": [[62, 66]]}]}, {"en": "These stages mirror the development of human conceptions of the sea.", "zh": "这些阶段反映了人类对海洋认识的发展。", "w": [{"t": "core", "h": "mirror", "m": "v. 反映", "sp": [[13, 19]]}, {"t": "core", "h": "development", "m": "n. 发展", "sp": [[24, 35]]}, {"t": "core", "h": "conception", "m": "n. 观念；认识", "sp": [[45, 56]]}]}, {"en": "Since I began thinking about this project in August 2011, the issue of sea-level rise and the need to place it historically have only become more urgent: between then and the end of 2022 the global sea rose by almost 5 centimeters, about half of the overall rise recorded by satellites since 1993.", "zh": "自2011年8月我开始构思这个项目以来，海平面上升问题以及从历史角度看待它的必要性都变得愈发紧迫：从那时到2022年底，全球海平面上升了近5厘米，约为1993年以来卫星记录的总上升幅度的一半。", "w": [{"t": "core", "h": "project", "m": "n. 项目", "sp": [[34, 41]]}, {"t": "core", "h":   if(bq.sort==='az')L=[...L].sort((a,b)=>a.h.toLowerCase().localeCompare(b.h.toLowerCase()));
  $('#bqn').textContent=L.length+' 条';
  $('#rows').innerHTML=L.length?L.map(b=>{const key=b.h.toLowerCase();return `<div class="row ${known.has(key)?'known':''}"><input type="checkbox" data-k="${esc(key)}" ${known.has(key)?'checked':''} aria-label="已掌握"><div class="hw ${b.t}">${esc(b.h)}</div><div class="mm">${esc(b.m.join('；'))}</div><div class="fq">${b.freq.length} 篇</div><div class="src">${b.freq.slice(0,12).map(id=>`<button data-go="${id}" data-w="${esc(key)}" ${byId[id].done?'':'disabled'} title="${esc(byId[id].name)}">${esc(short(byId[id]))}</button>`).join('')}${b.freq.length>12?`<span class="fq">等 ${b.freq.length} 篇</span>`:''}</div></div>`}).join(''):'<div class="empty">没有匹配的词条</div>';
  document.querySelectorAll('.row input').forEach(c=>c.onchange=()=>{c.checked?known.add(c.dataset.k):known.delete(c.dataset.k);store.set('known',[...known]);c.closest('.row').classList.toggle('known',c.checked)});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openP(b.dataset.go,b.dataset.w));
}
function setView(v){view=v;$('#tabP').classList.toggle('on',v==='p');$('#tabB').classList.toggle('on',v==='b');v==='p'?renderPassage():renderBank()}
$('#tabP').onclick=()=>setView('p');$('#tabB').onclick=()=>setView('b');
// popover
const pop=$('#pop');
document.addEventListener('click',e=>{
  const m=e.target.closest('mark.w');
  if(m){const key=m.dataset.h.toLowerCase(),b=bankBy[key];
    pop.innerHTML=`<div class="tier" style="color:var(--${m.dataset.t})">${TIER[m.dataset.t]}</div><h4>${esc(m.dataset.h)}</h4><div class="m">${esc(m.dataset.m)}</div>${b?`<div class="f">在全部 ${P.length} 篇中出现 ${b.freq.length} 篇${b.m.length>1?'；其他释义：'+esc(b.m.filter(x=>x!==m.dataset.m).join('；')):''}</div>`:''}<button class="tg ${known.has(key)?'on':''}" id="pk">${known.has(key)?'✓ 已掌握':'标记为已掌握'}</button>`;
    pop.style.display='block';const r=m.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;pop.style.left=x+'px';pop.style.top=y+'px';
    $('#pk').onclick=ev=>{ev.stopPropagation();known.has(key)?known.delete(key):known.add(key);store.set('known',[...known]);pop.style.display='none'};
    e.stopPropagation();return}
  if(!e.target.closest('#pop'))pop.style.display='none';
});
// reader
let rdI=0,rdS=[],rdO=Object.assign({zh:true,ch:true},store.get('rdo',{}));
function openReader(i){const p=byId[cur];rdS=p.paras.flat();rdI=i;$('#rdT').textContent=p.name+' · '+p.title;$('#rd').classList.add('on');document.body.style.overflow='hidden';drawR()}
function drawR(){const s=rdS[rdI];
  $('#rdIn').innerHTML=`<div class="en">${sentHTML(s)}</div>${rdO.zh?`<div class="zh">${esc(s.zh)}</div>`:''}${rdO.ch&&s.w.length?`<div class="chips">${chipsHTML(s)}</div>`:''}`;
  $('#rdPg').textContent=(rdI+1)+' / '+rdS.length;$('#rdP').style.width=((rdI+1)/rdS.length*100)+'%';
  $('#rdZh').classList.toggle('on',rdO.zh);$('#rdCh').classList.toggle('on',rdO.ch)}
const closeR=()=>{$('#rd').classList.remove('on');document.body.style.overflow=''};
$('#rdPrev').onclick=()=>{if(rdI>0){rdI--;drawR()}};$('#rdNext').onclick=()=>{if(rdI<rdS.length-1){rdI++;drawR()}};
$('#rdX').onclick=closeR;
$('#rdZh').onclick=()=>{rdO.zh=!rdO.zh;store.set('rdo',rdO);drawR()};$('#rdCh').onclick=()=>{rdO.ch=!rdO.ch;store.set('rdo',rdO);drawR()};
document.addEventListener('keydown',e=>{if(!$('#rd').classList.contains('on'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();$('#rdNext').click()}else if(e.key==='ArrowLeft')$('#rdPrev').click();else if(e.key==='Escape')closeR()});
setView('p');
</script>
</body>
