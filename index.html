<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高考阅读词汇精读</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1b; --ink2:#5b5a55; --ink3:#8a8984; --line:#e4e2db;
  --accent:#2f5d8a; --accent-bg:#e8eff6;
  --core:#b45309; --core-bg:#fdf0dc;
  --ext:#7c3aed; --ext-bg:#efe7fd;
  --phr:#0f766e; --phr-bg:#dcf3ef;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink2:#b3b1aa; --ink3:#85837d; --line:#33322e;
    --accent:#8db8e6; --accent-bg:#22303d;
    --core:#f2a54a; --core-bg:#3a2a14;
    --ext:#b99bf7; --ext-bg:#2e2443;
    --phr:#4fd1c0; --phr-bg:#13332f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink2:#b3b1aa; --ink3:#85837d; --line:#33322e;
  --accent:#8db8e6; --accent-bg:#22303d;
  --core:#f2a54a; --core-bg:#3a2a14;
  --ext:#b99bf7; --ext-bg:#2e2443;
  --phr:#4fd1c0; --phr-bg:#13332f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3);letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
nav.cat{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;box-shadow:var(--shadow)}
.yr{padding:10px 14px 4px;font-weight:700;font-size:13px;color:var(--ink3);letter-spacing:.06em}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 14px;font-size:14px;line-height:1.35;color:var(--ink)}
.it:hover:not([disabled]){background:var(--accent-bg)}
.it.on{background:var(--accent-bg);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.it[disabled]{color:var(--ink3);cursor:default}
.it .n{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.it .todo{margin-left:auto;font-size:11px;color:var(--ink3)}
.catsel{display:none}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ph{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.ph .nm{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.03em}
.ph h1{font-size:24px;line-height:1.3;margin:4px 0 8px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.sum{margin:12px 0 0;font-size:14.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.tg.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tg.pri{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.core{background:var(--core)}.dot.ext{background:var(--ext)}.dot.phr{background:var(--phr)}
.body{padding:8px 22px 22px}
.para{padding:6px 0;border-bottom:1px dashed var(--line)}
.para:last-child{border-bottom:0}
.s{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:10px 0}
.s .k{font-size:12px;color:var(--ink3);padding-top:4px;font-variant-numeric:tabular-nums;text-align:right}
.en{font-size:17.5px;line-height:1.75;font-family:Georgia,"Times New Roman","Songti SC",serif}
.zh{font-size:15px;color:var(--ink2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;line-height:1.3;border-radius:7px;padding:3px 8px;border:1px solid transparent}
.chip b{font-weight:600;margin-right:4px}
.chip.core{background:var(--core-bg);color:var(--ink)}.chip.core b{color:var(--core)}
.chip.ext{background:var(--ext-bg);color:var(--ink)}.chip.ext b{color:var(--ext)}
.chip.phr{background:var(--phr-bg);color:var(--ink)}.chip.phr b{color:var(--phr)}
mark.w{background:none;color:inherit;border-radius:3px;padding:0 1px;cursor:pointer;border-bottom:2px solid}
mark.w.core{color:var(--core);border-color:var(--core);background:var(--core-bg)}
mark.w.ext{color:var(--ext);border-color:var(--ext);background:var(--ext-bg)}
mark.w.phr{color:var(--phr);border-color:var(--phr);background:var(--phr-bg)}
.nohl mark.w{color:inherit;background:none;border-color:transparent}
.nozh .zh{display:none}
.nochip .chips{display:none}
.pop{position:fixed;z-index:50;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px;display:none}
.pop h4{margin:0 0 2px;font-size:18px;font-family:Georgia,serif}
.pop .tier{font-size:11px;font-weight:600;letter-spacing:.04em}
.pop .m{margin:6px 0}
.pop .f{font-size:12px;color:var(--ink3)}
.pop button{margin-top:8px}
/* bank */
.bk-h{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.bk-h h1{font-size:22px;margin:0 0 4px}
.bk-h p{margin:0;color:var(--ink2);font-size:14px}
.bk-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.bk-c input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:14px}
.bk-c select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 8px;font-size:13px}
.rows{padding:4px 0}
.row{display:grid;grid-template-columns:28px minmax(120px,220px) minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:10px 22px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .hw{font-family:Georgia,serif;font-size:17px;font-weight:600}
.row .hw.core{color:var(--core)}.row .hw.ext{color:var(--ext)}.row .hw.phr{color:var(--phr)}
.row .mm{font-size:14px}
.row .src{grid-column:3/5;display:flex;flex-wrap:wrap;gap:4px}
.row .src button{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:1px 6px;color:var(--ink2)}
.row .src button[disabled]{opacity:.55;cursor:default}
.row .fq{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.known{opacity:.45}
.row input{margin-top:6px;width:16px;height:16px}
.empty{padding:30px 22px;color:var(--ink3);text-align:center}
/* reader mode */
.rd{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.rd.on{display:flex}
.rd-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rd-top .t{font-weight:600;font-size:14px;margin-right:auto}
.rd-main{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.rd-in{max-width:980px;width:100%}
.rd .en{font-size:clamp(22px,3.4vw,40px);line-height:1.6}
.rd .zh{font-size:clamp(17px,2.2vw,26px);margin-top:18px}
.rd .chips{margin-top:26px;gap:10px}
.rd .chip{font-size:clamp(14px,1.6vw,19px);padding:6px 12px}
.rd-bot{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.rd-bot .pg{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:70px;text-align:center}
.rd-bot button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 18px}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:12px}
  nav.cat{display:none}
  .catsel{display:block;width:100%;margin-bottom:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:15px}
  .ph,.bar,.body,.bk-h,.bk-c{padding-left:16px;padding-right:16px}
  .row{grid-template-columns:24px minmax(0,1fr) auto;padding:10px 16px}
  .row .mm{grid-column:2/4}
  .row .src{grid-column:2/4}
  .legend{margin-left:0;width:100%}
  .en{font-size:16.5px}
}

.it .todo{margin-left:auto;font-size:11px;color:var(--ink3)}
.it.todo-it{color:var(--ink2)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.player .lbl{font-size:13px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 12px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--panel);font-weight:600}
.play{border:0;background:var(--accent);color:var(--panel);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600}
.ptime{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:86px}
.pbar{flex:1 1 160px;height:6px;background:var(--line);border-radius:3px;cursor:pointer;position:relative;min-width:120px}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.s .k{cursor:pointer;border-radius:6px}
.s .k:hover{background:var(--accent-bg);color:var(--accent)}
.s .k::after{content:'▶';display:block;font-size:9px;opacity:.55;margin-top:2px}
.s.now{background:var(--accent-bg);border-radius:10px;box-shadow:-6px 0 0 var(--accent-bg),6px 0 0 var(--accent-bg)}
.s.now .k{color:var(--accent);font-weight:700}
.note{margin:0;padding:10px 22px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}
.rd-top .seg button{padding:3px 10px}
</style>
</head>

<script>
const DATA={"passages": [{"id": "p01", "year": 2022, "paper": "全国新高考Ⅰ卷", "part": "C", "words": 285, "file": "f8", "name": "2022 全国新高考Ⅰ卷 阅读C", "done": false, "paras": [[{"en": "The elderly residents (居民) in care homes in London are being given hens to look after to stop them feeling lonely.", "zh": "", "w": []}], [{"en": "The project was dreamed up by a local charity (慈善组织) to reduce loneliness and improve elderly people’s wellbeing.", "zh": "", "w": []}, {"en": "It is also being used to help patients suffering dementia, a serious illness of the mind.", "zh": "", "w": []}, {"en": "Staff in care homes have reported a reduction in the use of medicine where hens are in use.", "zh": "", "w": []}], [{"en": "Among those taking part in the project is 80-year-old Ruth Xavier.", "zh": "", "w": []}, {"en": "She said: “I used to keep hens when I was younger and had to prepare their breakfast each morning before I went to school. ”", "zh": "", "w": []}], [{"en": "“I like the project a lot.", "zh": "", "w": []}, {"en": "I am down there in my wheelchair in the morning letting the hens out and down there again at night to see they’ve gone to bed.”", "zh": "", "w": []}], [{"en": "“It’s good to have a different focus.", "zh": "", "w": []}, {"en": "People have been bringing their children in to see the hens and residents come and sit outside to watch them.", "zh": "", "w": []}, {"en": "I’m enjoying the creative activities, and it feels great to have done something useful.”", "zh": "", "w": []}], [{"en": "There are now 700 elderly people looking after hens in 20 care homes in the North East, and the charity has been given financial support to roll it out countrywide.", "zh": "", "w": []}], [{"en": "Wendy Wilson, extra care manager at 60 Penfold Street, one of the first to embark on the project, said: “Residents really welcome the idea of the project and the creative sessions.", "zh": "", "w": []}, {"en": "We are looking forward to the benefits and fun the project can bring to people here.”", "zh": "", "w": []}], [{"en": "Lynn Lewis, director of Notting Hill Pathways, said: “We are happy to be taking part in the project.", "zh": "", "w": []}, {"en": "It will really help connect our residents through a shared interest and creative activities.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p02", "year": 2022, "paper": "全国新高考Ⅰ卷", "part": "D", "words": 329, "file": "f8", "name": "2022 全国新高考Ⅰ卷 阅读D", "done": false, "paras": [[{"en": "Human speech contains more than 2,000 different sounds, from the common “m” and “a” to the rare clicks of some southern African languages.", "zh": "", "w": []}, {"en": "But why are certain sounds more common than others?", "zh": "", "w": []}, {"en": "A ground-breaking, five-year study shows that diet-related changes in human bite led to new speech sounds that are now found in half the world’s languages.", "zh": "", "w": []}], [{"en": "More than 30 years ago, the scholar Charles Hockett noted that speech sounds called labiodentals, such as “f” and “v”, were more common in the languages of societies that ate softer foods.", "zh": "", "w": []}, {"en": "Now a team of researchers led by Damián Blasi at the University of Zurich, Switzerland, has found how and why this trend arose.", "zh": "", "w": []}], [{"en": "They discovered that the upper and lower front teeth of ancient human adults were aligned (对齐), making it hard to produce labiodentals, which are formed by touching the lower lip to the upper teeth.", "zh": "", "w": []}, {"en": "Later, our jaws changed to an overbite structure (结构), making it easier to produce such sounds.", "zh": "", "w": []}], [{"en": "The team showed that this change in bite was connected with the development of agriculture in the Neolithic period.", "zh": "", "w": []}, {"en": "Food became easier to chew at this point.", "zh": "", "w": []}, {"en": "The jawbone didn’t have to do as much work and so didn’t grow to be so large.", "zh": "", "w": []}], [{"en": "Analyses of a language database also confirmed that there was a global change in the sound of world languages after the Neolithic age, with the use of “f” and “v” increasing remarkably during the last few thousand years.", "zh": "", "w": []}, {"en": "These sounds are still not found in the languages of many hunter-gatherer people today.", "zh": "", "w": []}], [{"en": "This research overturns the popular view that all human speech sounds were present when human beings evolved around 300,000 years ago.", "zh": "", "w": []}, {"en": "“The set of speech sounds we use has not necessarily remained stable since the appearance of human beings, but rather the huge variety of speech sounds that we find today is the product of a complex interplay of things like biological change and cultural evolution,” said Steven Moran, a member of the research team.", "zh": "", "w": []}]], "nv": 0}, {"id": "p03", "year": 2022, "paper": "全国新高考Ⅱ卷", "part": "C", "words": 282, "file": "f9", "name": "2022 全国新高考Ⅱ卷 阅读C", "done": false, "paras": [[{"en": "Over the last seven years, most states have banned texting by drivers, and public service campaigns have tried a wide range of methods to persuade people to put down their phones when they are behind the wheel.", "zh": "", "w": []}], [{"en": "Yet the problem, by just about any measure, appears to be getting worse.", "zh": "", "w": []}, {"en": "Americans are still texting while driving, as well as using social networks and taking photos.", "zh": "", "w": []}, {"en": "Road accidents, which had fallen for years, are now rising sharply.", "zh": "", "w": []}], [{"en": "That is partly because people are driving more, but Mark Rosekind, the chief of the National Highway Traffic Safety Administration, said distracted (分心) driving was \"only increasing, unfortunately.\"", "zh": "", "w": []}], [{"en": "\"Big change requires big ideas.\" he said in a speech last month, referring broadly to the need to improve road safety.", "zh": "", "w": []}, {"en": "So to try to change a distinctly modern behavior, lawmakers and public health experts are reaching back to an old approach: They want to treat distracted driving like drunk driving.", "zh": "", "w": []}], [{"en": "An idea from lawmakers in New York is to give police officers a new device called the Textalyzer.", "zh": "", "w": []}, {"en": "It would work like this: An officer arriving at the scene of a crash could ask for the phones of the drivers and use the Textalyzer to check in the operating system for recent activity.", "zh": "", "w": []}, {"en": "The technology could determine whether a driver had just texted, emailed or done anything else that is not allowed under New York's hands-free driving laws.", "zh": "", "w": []}], [{"en": "\"We need something on the books that can change people's behavior,” said Félix W. Ortiz, who pushed for the state's 2001 ban on hand-held devices by drivers.", "zh": "", "w": []}, {"en": "If the Textalyzer bill becomes law, he said, \"people are going to be more afraid to put their hands on the cell phone.\"", "zh": "", "w": []}]], "nv": 0}, {"id": "p04", "year": 2022, "paper": "全国新高考Ⅱ卷", "part": "D", "words": 343, "file": "f9", "name": "2022 全国新高考Ⅱ卷 阅读D", "done": false, "paras": [[{"en": "As we age, even if we’re healthy, the heart just isn’t as efficient in processing oxygen as it used to be.", "zh": "", "w": []}, {"en": "In most people the first signs show up in their 50s or early 60s.", "zh": "", "w": []}, {"en": "And among people who don’t exercise, the changes can start even sooner.", "zh": "", "w": []}], [{"en": "“Think of a rubber band.", "zh": "", "w": []}, {"en": "In the beginning, it is flexible, but put it in a drawer for 20 years and it will become dry and easily broken,” says Dr. Ben Levine, a heart specialist at the University of Texas.", "zh": "", "w": []}, {"en": "That’s what happens to the heart.", "zh": "", "w": []}, {"en": "Fortunately for those in midlife, Levine is finding that even if you haven’t been an enthusiastic exerciser, getting in shape now may help improve your aging heart.", "zh": "", "w": []}], [{"en": "Levine and his research team selected volunteers aged between 45 and 64 who did not exercise much but were otherwise healthy.", "zh": "", "w": []}, {"en": "Participants were randomly divided into two groups.", "zh": "", "w": []}, {"en": "The first group participated in a program of nonaerobic (无氧) exercise—balance training and weight training—three times a week.", "zh": "", "w": []}, {"en": "The second group did high-intensity aerobic exercise under the guidance of a trainer for four or more days a week.", "zh": "", "w": []}, {"en": "After two years, the second group saw remarkable improvements in heart health.", "zh": "", "w": []}], [{"en": "“We took these 50-year-old hearts and turned the clock back to 30-or 35-year-old hearts,” says Levine.", "zh": "", "w": []}, {"en": "“And the reason they got so much stronger and fitter was that their hearts could now fill a lot better and pump (泵送) a lot more blood during exercise.”", "zh": "", "w": []}, {"en": "But the hearts of those who participated in less intense exercise didn’t change, he says.", "zh": "", "w": []}], [{"en": "“The sweet spot in life to start exercising, if you haven’t already, is in late middle age when the heart still has flexibility,” Levine says.", "zh": "", "w": []}, {"en": "“We put healthy 70-year-olds through a yearlong exercise training program, and nothing happened to them at all.”", "zh": "", "w": []}], [{"en": "Dr. Nieca Goldberg, a spokeswoman for the American Heart Association, says Levine’s findings are a great start.", "zh": "", "w": []}, {"en": "But the study was small and needs to be repeated with far larger groups of people to determine exactly which aspects of an exercise routine make the biggest difference.", "zh": "", "w": []}]], "nv": 0}, {"id": "p05", "year": 2022, "paper": "全国甲卷", "part": "C", "words": 297, "file": "f4", "name": "2022 全国甲卷 阅读C", "done": false, "paras": [[{"en": "As Ginni Bazlinton reached Antarctica, she found herself greeted by a group of little Gentoo penguins (企鹅) longing to say hello.", "zh": "", "w": []}, {"en": "These gentle, lovely gatekeepers welcomed her and kick-started what was to be a trip Ginni would never forget.", "zh": "", "w": []}], [{"en": "Ever since her childhood, Ginni, now 71, has had a deep love for travel.", "zh": "", "w": []}, {"en": "Throughout her career (职业) as a professional dancer, she toured in the UK, but always longed to explore further.", "zh": "", "w": []}, {"en": "When she retired from dancing and her sons eventually flew the nest, she decided it was time to take the plunge.", "zh": "", "w": []}], [{"en": "After taking a degree at Chichester University in Related Arts, Ginni began to travel the world, eventually getting work teaching English in Japan and Chile.", "zh": "", "w": []}, {"en": "And it was in Chile she discovered she could get last-minute cheap deals on ships going to Antarctica from the islands off Tierra del Fuego, the southernmost tip of the South American mainland.", "zh": "", "w": []}, {"en": "“I just decided I wanted to go,” she says.", "zh": "", "w": []}, {"en": "“I had no idea about what I’d find there and I wasn’t nervous, I just wanted to do it.", "zh": "", "w": []}, {"en": "And I wanted to do it alone as I always prefer it that way.”", "zh": "", "w": []}], [{"en": "In March 2008, Ginni boarded a ship with 48 passengers she’d never met before, to begin the journey towards Antarctica.", "zh": "", "w": []}, {"en": "“From seeing the wildlife to witnessing sunrises, the whole experience was amazing.", "zh": "", "w": []}, {"en": "Antarctica left an impression on me that no other place has,” Ginni says.", "zh": "", "w": []}, {"en": "“I remember the first time I saw a humpback whale; it just rose out of the water like some prehistoric creature and I thought it was smiling at us.", "zh": "", "w": []}, {"en": "You could still hear the operatic sounds it was making underwater.”", "zh": "", "w": []}], [{"en": "The realization that this is a precious land, to be respected by humans, was one of the biggest things that hit home to Ginni.", "zh": "", "w": []}]], "nv": 0}, {"id": "p06", "year": 2022, "paper": "全国甲卷", "part": "D", "words": 330, "file": "f4", "name": "2022 全国甲卷 阅读D", "done": false, "paras": [[{"en": "Sometime in the early 1960s, a significant thing happened in Sydney, Australia.", "zh": "", "w": []}, {"en": "The city discovered its harbor.", "zh": "", "w": []}, {"en": "Then, one after another, Sydney discovered lots of things that were just sort of there — broad parks, superb beaches, and a culturally diverse population.", "zh": "", "w": []}, {"en": "But it is the harbor that makes the city.", "zh": "", "w": []}], [{"en": "Andrew Reynolds, a cheerful fellow in his early 30s, pilots Sydney ferryboats for a living.", "zh": "", "w": []}, {"en": "I spent the whole morning shuttling back and forth across the harbor.", "zh": "", "w": []}, {"en": "After our third run Andrew shut down the engine, and we went our separate ways — he for a lunch break, I to explore the city.", "zh": "", "w": []}], [{"en": "“I’ll miss these old boats,” he said as we parted.", "zh": "", "w": []}], [{"en": "“How do you mean?”", "zh": "", "w": []}, {"en": "I asked.", "zh": "", "w": []}], [{"en": "“Oh, they’re replacing them with catamarans.", "zh": "", "w": []}, {"en": "Catamarans are faster, but they’re not so elegant, and they’re not fun to pilot.", "zh": "", "w": []}, {"en": "But that’s progress, I guess.”", "zh": "", "w": []}], [{"en": "Everywhere in Sydney these days, change and progress are the watchwords (口号), and traditions are increasingly rare.", "zh": "", "w": []}, {"en": "Shirley Fitzgerald, the city’s official historian, told me that in its rush to modernity in the 1970s, Sydney swept aside much of its past, including many of its finest buildings.", "zh": "", "w": []}, {"en": "“Sydney is confused about itself,” she said.", "zh": "", "w": []}, {"en": "“We can’t seem to make up our minds whether we want a modern city or a traditional one.", "zh": "", "w": []}, {"en": "It’s a conflict that we aren’t getting any better at resolving (解决).”", "zh": "", "w": []}], [{"en": "On the other hand, being young and old at the same time has its attractions.", "zh": "", "w": []}, {"en": "I considered this when I met a thoughtful young businessman named Anthony.", "zh": "", "w": []}, {"en": "“Many people say that we lack culture in this country,” he told me.", "zh": "", "w": []}, {"en": "“What people forget is that the Italians, when they came to Australia, brought 2000 years of their culture, the Greeks some 3000 years, and the Chinese more still.", "zh": "", "w": []}, {"en": "We’ve got a foundation built on ancient cultures but with a drive and dynamism of a young country.", "zh": "", "w": []}, {"en": "It’s a pretty hard combination to beat.”", "zh": "", "w": []}], [{"en": "He is right, but I can’t help wishing they would keep those old ferries.", "zh": "", "w": []}]], "nv": 0}, {"id": "p07", "year": 2022, "paper": "全国乙卷", "part": "C", "words": 303, "file": "f3", "name": "2022 全国乙卷 阅读C", "done": false, "paras": [[{"en": "Can a small group of drones (无人机) guarantee the safety and reliability of railways and, at the same time, help railway operators save billions of euros each year?", "zh": "", "w": []}, {"en": "That is the very likely future of applying today’s “eyes in the sky” technology to making sure that the millions of kilometres of rail tracks and infrastructure (基础设施) worldwide are safe for trains on a 24/7 basis.", "zh": "", "w": []}], [{"en": "Drones are already being used to examine high-tension electrical lines.", "zh": "", "w": []}, {"en": "They could do precisely the same thing to inspect railway lines and other vital aspects of rail infrastructure such as the correct position of railway tracks and switching points.", "zh": "", "w": []}, {"en": "The more regularly they can be inspected, the more railway safety, reliability and on-time performance will be improved.", "zh": "", "w": []}, {"en": "Costs would be cut and operations would be more efficient (高效) across the board.", "zh": "", "w": []}], [{"en": "That includes huge savings in maintenance costs and better protection of railway personnel safety.", "zh": "", "w": []}, {"en": "It is calculated that European railways alone spend approximately 20 billion euros a year on maintenance, including sending maintenance staff, often at night, to inspect and repair the rail infrastructure.", "zh": "", "w": []}, {"en": "That can be dangerous work that could be avoided with drones assisting the crews’ efforts.", "zh": "", "w": []}], [{"en": "By using the latest technologies, drones could also start providing higher-value services for railways, detecting faults in the rail or switches, before they can cause any safety problems.", "zh": "", "w": []}, {"en": "To perform these tasks, drones for rail don’t need to be flying overhead.", "zh": "", "w": []}, {"en": "Engineers are now working on a new concept: the rail drones of the future.", "zh": "", "w": []}, {"en": "They will be moving on the track ahead of the train, and programmed to run autonomously.", "zh": "", "w": []}, {"en": "Very small drones with advanced sensors and AI and travelling ahead of the train could guide it like a co-pilot.", "zh": "", "w": []}, {"en": "With their ability to see ahead, they could signal any problem, so that fast-moving trains would be able to react in time.", "zh": "", "w": []}]], "nv": 0}, {"id": "p08", "year": 2022, "paper": "全国乙卷", "part": "D", "words": 308, "file": "f3", "name": "2022 全国乙卷 阅读D", "done": false, "paras": [[{"en": "The Government’s sugar tax on soft drinks has brought in half as much money as Ministers first predicted it would generate, the first official data on the policy has shown.", "zh": "", "w": []}], [{"en": "First announced in April, 2016, the tax which applies to soft drinks containing more than 5g of sugar per 100ml, was introduced to help reduce childhood obesity (肥胖).", "zh": "", "w": []}, {"en": "It is believed that today’s children and teenagers are consuming three times the recommended level of sugar, putting them at a higher risk of the disease.", "zh": "", "w": []}], [{"en": "Initially the sugar tax was expected to make £520m a year for the Treasury.", "zh": "", "w": []}, {"en": "However, data of the first six months showed it would make less than half this amount.", "zh": "", "w": []}, {"en": "At present it is expected to generate £240m for the year ending in April 2019, which will go to school sports.", "zh": "", "w": []}], [{"en": "It comes after more than half of soft drinks sold in shops have had their sugar levels cut by manufacturers (制造商) so they can avoid paying the tax.", "zh": "", "w": []}, {"en": "Drinks now contain 45 million fewer kilos of sugar as a result of manufacturers’ efforts to avoid the charge, according to Treasury figures.", "zh": "", "w": []}, {"en": "Since April drinks companies have been forced to pay between 18p and 24p for every litre of sugary drink they produce or import, depending on the sugar content.", "zh": "", "w": []}], [{"en": "However, some high sugar brands, like Classic Coca Cola, have accepted the sugar tax and are refusing to change for fear of upsetting consumers.", "zh": "", "w": []}, {"en": "Fruit juices, milk-based drinks and most alcoholic drinks are free of the tax, as are small companies manufacturing fewer than 1m litres per year.", "zh": "", "w": []}], [{"en": "Today’s figures, according to one government official, show the positive influence the sugar tax is having by raising millions of pounds for sports facilities (设施) and healthier eating in schools.", "zh": "", "w": []}, {"en": "Helping the next generation to have a healthy and active childhood is of great importance, and the industry is playing its part.", "zh": "", "w": []}]], "nv": 0}, {"id": "p09", "year": 2022, "paper": "北京卷", "part": "C", "words": 407, "file": "f5", "name": "2022 北京卷 阅读C", "done": false, "paras": [[{"en": "“What would the world be if there were no hunger?”", "zh": "", "w": []}, {"en": "It’s a question that Professor Crystal would ask her students.", "zh": "", "w": []}, {"en": "They found it hard to answer, she wrote later, because imagining something that isn’t part of real life—and learning how to make it real—is a rare skill.", "zh": "", "w": []}, {"en": "It is taught to artists and engineers, but much less often to scientists.", "zh": "", "w": []}, {"en": "Crystal set out to change that, and helped to create a global movement.", "zh": "", "w": []}, {"en": "The result—an approach known as systems thinking—is now seen as essential in meeting global challenges.", "zh": "", "w": []}], [{"en": "Systems thinking is crucial to achieving targets such as zero hunger and better nutrition because it requires considering the way in which food is produced, processed, delivered and consumed, and looking at how those things intersect (交叉) with human health, the environment, economics and society.", "zh": "", "w": []}, {"en": "According to systems thinking, changing the food system—or any other network—requires three things to happen.", "zh": "", "w": []}, {"en": "First, researchers need to identify all the players in that system; second, they must work out how they relate to each other; and third, they need to understand and quantify the impact of those relationships on each other and on those outside the system.", "zh": "", "w": []}], [{"en": "Take nutrition.", "zh": "", "w": []}, {"en": "In the latest UN report on global food security, the number of undernourished (营养不良) people in the world has been rising, despite great advances in nutrition science.", "zh": "", "w": []}, {"en": "Tracking of 150 biochemicals in food has been important in revealing the relationships between calories, sugar, fat and the occurrence of common diseases.", "zh": "", "w": []}, {"en": "But using machine learning and artificial intelligence, some scientists propose that human diets consist of at least 26,000 biochemicals—and that the vast majority are not known.", "zh": "", "w": []}, {"en": "This shows that we have some way to travel before achieving the first objective of systems thinking—which, in this example, is to identify more constituent parts of the nutrition system.", "zh": "", "w": []}], [{"en": "A systems approach to creating change is also built on the assumption that everyone in the system has equal power.", "zh": "", "w": []}, {"en": "But as some researchers find, the food system is not an equal one.", "zh": "", "w": []}, {"en": "A good way to redress (修正) such power imbalance is for more universities to do what Crystal did and teach students how to think using a systems approach.", "zh": "", "w": []}], [{"en": "More researchers, policymakers and representatives from the food industry must learn to look beyond their direct lines of responsibility and adopt a systems approach.", "zh": "", "w": []}, {"en": "Crystal knew that visions alone don’t produce results, but concluded that “we’ll never produce results that we can’t envision”.", "zh": "", "w": []}]], "nv": 0}, {"id": "p10", "year": 2022, "paper": "北京卷", "part": "D", "words": 387, "file": "f5", "name": "2022 北京卷 阅读D", "done": false, "paras": [[{"en": "Quantum (量子) computers have been on my mind a lot lately.", "zh": "", "w": []}, {"en": "A friend has been sending me articles on how quantum computers might help solve some of the biggest challenges we face as humans.", "zh": "", "w": []}, {"en": "I’ve also had exchanges with two quantum-computing experts.", "zh": "", "w": []}, {"en": "One is computer scientist Chris Johnson who I see as someone who helps keep the field honest.", "zh": "", "w": []}, {"en": "The other is physicist Philip Taylor.", "zh": "", "w": []}], [{"en": "For decades, quantum computing has been little more than a laboratory curiosity.", "zh": "", "w": []}, {"en": "Now, big tech companies have invested in quantum computing, as have many smaller ones.", "zh": "", "w": []}, {"en": "According to Business Weekly, quantum machines could help us “cure cancer, and even take steps to turn climate change in the opposite direction.”", "zh": "", "w": []}, {"en": "This is the sort of hype (炒作) that annoys Johnson.", "zh": "", "w": []}, {"en": "He worries that researchers are making promises they can’t keep.", "zh": "", "w": []}, {"en": "“What’s new,” Johnson wrote, “is that millions of dollars are now potentially available to quantum computing researchers.”", "zh": "", "w": []}], [{"en": "As quantum computing attracts more attention and funding, researchers may mislead investors, journalists, the public and, worst of all, themselves about their work’s potential.", "zh": "", "w": []}, {"en": "If researchers can’t keep their promises, excitement might give way to doubt, disappointment and anger, Johnson warns.", "zh": "", "w": []}, {"en": "Lots of other technologies have gone through stages of excitement.", "zh": "", "w": []}, {"en": "But something about quantum computing makes it especially prone to hype, Johnson suggests, perhaps because “‘quantum’ stands for something cool you shouldn’t be able to understand.”", "zh": "", "w": []}, {"en": "And that brings me back to Taylor, who suggested that I read his book Q for Quantum.", "zh": "", "w": []}], [{"en": "After I read the book, Taylor patiently answered my questions about it.", "zh": "", "w": []}, {"en": "He also answered my questions about PyQuantum, the firm he co-founded in 2016.", "zh": "", "w": []}, {"en": "Taylor shares Johnson’s concerns about hype, but he says those concerns do not apply to PyQuantum.", "zh": "", "w": []}], [{"en": "The company, he says, is closer than any other firm “by a very large margin (幅度)” to building a “useful” quantum computer, one that “solves an impactful problem that we would not have been able to solve otherwise.”", "zh": "", "w": []}, {"en": "He adds, “People will naturally discount my opinions, but I have spent a lot of time quantitatively comparing what we are doing with others.”", "zh": "", "w": []}], [{"en": "Could PyQuantum really be leading all the competition “by a wide margin”, as Taylor claims?", "zh": "", "w": []}, {"en": "I don’t know.", "zh": "", "w": []}, {"en": "I’m certainly not going to advise my friend or anyone else to invest in quantum computers.", "zh": "", "w": []}, {"en": "But I trust Taylor, just as I trust Johnson.", "zh": "", "w": []}]], "nv": 0}, {"id": "p11", "year": 2022, "paper": "天津卷（第一次·3月）", "part": "C", "words": 368, "file": "f6", "name": "2022 天津卷（第一次·3月） 阅读C", "done": false, "paras": [[{"en": "The question,“What do elephants and fish have in common?\" may sound strange but researchers have found that they both have a feature not observed in any other creature.", "zh": "", "w": []}], [{"en": "A team at Georgia Institute of Technology has discovered that elephants use a special form of air suction (吸力) in their trunks to pick up food and handle delicate objects.", "zh": "", "w": []}, {"en": "Animals using suction to handle objects are typically found in water.", "zh": "", "w": []}, {"en": "Many fish perform suction feeding that requires specialised body parts to quickly generate air pressure that can draw nearby food into their mouths.", "zh": "", "w": []}], [{"en": "The researchers have found that an elephant could do the same thanks to its huge nostrils (鼻孔) and lung capacity.", "zh": "", "w": []}, {"en": "The radius (半径) of an elephant’s nostrils can increase by up to 30%, and the volume of air that it can push through its trunk increases by 64%.", "zh": "", "w": []}, {"en": "This allows it to take in air at 30 times the speed of a human sneeze, enabling it to drink 3L of water a second.", "zh": "", "w": []}], [{"en": "In an experiment at Atlanta zoo, the researchers looked at how an elephant would pick up a small crispy (酥脆的) pancake, which was only 0.5mm thick.", "zh": "", "w": []}, {"en": "The force required to break the pancake was less than 1% of the trunk’s weight (about 100kg).", "zh": "", "w": []}, {"en": "The elephant was found to either use suction at a fixed distance from the pancake to “raise” the object in the air and hold it, or gently press the tip of its trunk against the pancake and apply suction to pick it up.", "zh": "", "w": []}, {"en": "At no time during the experiment did the elephant break the pancake.", "zh": "", "w": []}], [{"en": "The researchers believe that the findings could help technology companies develop better machines that use air to do their jobs, as suction has long been used in robotics to grab objects.", "zh": "", "w": []}, {"en": "The fascinating part of the study for robotics is that elephants can use air suction both on ground and in water.", "zh": "", "w": []}, {"en": "The researchers are so impressed that they suggest the elephant’s suction technique could help improve robotics technology.", "zh": "", "w": []}], [{"en": "Nature never ceases to surprise.", "zh": "", "w": []}, {"en": "Indeed, it is thought that over four-fifths of living species on earth remain undiscovered.", "zh": "", "w": []}, {"en": "That is a reminder of how little we know of our planet, and that we are not the only creatures with hidden complexities.", "zh": "", "w": []}]], "nv": 0}, {"id": "p12", "year": 2022, "paper": "天津卷（第一次·3月）", "part": "D", "words": 362, "file": "f6", "name": "2022 天津卷（第一次·3月） 阅读D", "done": false, "paras": [[{"en": "Some scientists insist that once we discover the truth about the world, we are done.", "zh": "", "w": []}, {"en": "Anyone who denies such truths, they suggest, is stupid or ignorant (无知的).", "zh": "", "w": []}, {"en": "Well, no.", "zh": "", "w": []}, {"en": "In science, what we do is both hard and, often, hard to explain.", "zh": "", "w": []}, {"en": "The history of science offers many examples of matters that scientists thought they had resolved, only to discover that these matters needed to be reconsidered.", "zh": "", "w": []}, {"en": "Familiar examples include Earth as the center of the universe and the stability of continents.", "zh": "", "w": []}], [{"en": "Science is a process of learning and discovery, and sometimes we learn that what we thought was right is wrong.", "zh": "", "w": []}, {"en": "To say that science is “true” or “permanent” is like saying that “beauty is absolute.”", "zh": "", "w": []}, {"en": "At best, it’s a bit off-key (不恰当的).", "zh": "", "w": []}, {"en": "The concept of beauty today is very different from what it was in ancient Greece or the Middle Ages, and so are most of our “laws” of nature.", "zh": "", "w": []}], [{"en": "Other scientists may say scientific findings are true because they use “the scientific method.”", "zh": "", "w": []}, {"en": "But we can never actually agree on what that method is.", "zh": "", "w": []}, {"en": "Some will say it is observation and description of the world.", "zh": "", "w": []}, {"en": "Others will say it is the use of experience and experiment.", "zh": "", "w": []}, {"en": "Recently a leading scientist said the scientific method was to avoid fooling oneself into thinking something is true that is not.", "zh": "", "w": []}], [{"en": "Each of these views has its value, but if the claim is that any one of these is the scientific method, then they all fail.", "zh": "", "w": []}, {"en": "History and philosophy have shown that the idea of a singular (唯一的) scientific method is unscientific.", "zh": "", "w": []}, {"en": "In fact, the methods of science have varied between disciplines and across time.", "zh": "", "w": []}, {"en": "Scientists have bitterly argued about which methods are the best, and, as we all know, bitter arguments rarely get resolved.", "zh": "", "w": []}], [{"en": "In my view, science is not simple, and neither is the natural world.", "zh": "", "w": []}, {"en": "Our efforts to understand and explain the natural world are just that: efforts.", "zh": "", "w": []}], [{"en": "Because we’re human, we often fall flat.", "zh": "", "w": []}, {"en": "The good news is that when that happens, we pick ourselves up, brush ourselves off, and get back to work.", "zh": "", "w": []}, {"en": "Understanding the world we live in, and using that knowledge to do useful things, is its own reward.", "zh": "", "w": []}]], "nv": 0}, {"id": "p13", "year": 2022, "paper": "天津卷（第二次·6月）", "part": "C", "words": 395, "file": "f7", "name": "2022 天津卷（第二次·6月） 阅读C", "done": false, "paras": [[{"en": "Is it true that our brain alone is responsible for human cognition(认知)?", "zh": "", "w": []}, {"en": "What about our body?", "zh": "", "w": []}, {"en": "Is it possible for thought and behavior to originate from somewhere other than our brain?", "zh": "", "w": []}, {"en": "Psychologists who study Embodied Cognition(EC) ask similar questions.", "zh": "", "w": []}, {"en": "The EC theory suggests our body is also responsible for thinking or problem-solving.", "zh": "", "w": []}, {"en": "More precisely, the mind shapes the body and the body shapes the mind in equal measure.", "zh": "", "w": []}], [{"en": "If you think about it for a moment, it makes total sense.", "zh": "", "w": []}, {"en": "When you smell something good or hear amusing sounds, certain emotions are awakened.", "zh": "", "w": []}, {"en": "Think about how newborns use their senses to understand the world around them.", "zh": "", "w": []}, {"en": "They don’t have emotions so much as needs—they don’t feel sad, they’re just hungry and need food.", "zh": "", "w": []}, {"en": "Even unborn babies can feel their mothers’ heartbeats and this has a calming effect.", "zh": "", "w": []}, {"en": "In the real world, they cry when they’re cold and then get hugged.", "zh": "", "w": []}, {"en": "That way, they start to associate being warm with being loved.", "zh": "", "w": []}], [{"en": "Understandably, theorists have been arguing for years and still disagree on whether the brain is the nerve centre that operates the rest of the body.", "zh": "", "w": []}, {"en": "Older Western philosophers and mainstream language researchers believe this is fact, while EC theorises that the brain and body are working together as an organic supercomputer, processing everything and forming your reactions.", "zh": "", "w": []}], [{"en": "Further studies have backed up the mind-body interaction.", "zh": "", "w": []}, {"en": "In one experiment, test subjects(实验对象) were asked to judge people after being handed a hot or a cold drink.", "zh": "", "w": []}, {"en": "They all made warm evaluations when their fingertips perceived warmth rather than coolness.", "zh": "", "w": []}, {"en": "And it works the other way too; in another study, subjects’ fingertip temperatures were measured after being“included” in or “rejected” from a group task.", "zh": "", "w": []}, {"en": "Those who were included felt physically warmer.", "zh": "", "w": []}], [{"en": "For further proof, we can look at the metaphors(比喻说法) that we use without even thinking.", "zh": "", "w": []}, {"en": "A kind and sympathetic person is frequently referred to as one with a soft heart and someone who is very strong and calm in difficult situations is often described as solid as a rock.", "zh": "", "w": []}, {"en": "And this kind of metaphorical use is common across languages.", "zh": "", "w": []}], [{"en": "Now that you have the knowledge of mind-body interaction, why not use it?", "zh": "", "w": []}, {"en": "If you’re having a bad day,a warm cup of tea will give you a flash of pleasure.", "zh": "", "w": []}, {"en": "If you know you’re physically cold, warm up before making any interpersonal decisions.", "zh": "", "w": []}]], "nv": 0}, {"id": "p14", "year": 2022, "paper": "天津卷（第二次·6月）", "part": "D", "words": 398, "file": "f7", "name": "2022 天津卷（第二次·6月） 阅读D", "done": false, "paras": [[{"en": "Ralph Emerson once said that the purpose of life is not to be happy, but to be useful, to be loving, to make some difference in the world.", "zh": "", "w": []}, {"en": "While we appreciate such words of wisdom, we rarely try to follow them in our lives.", "zh": "", "w": []}], [{"en": "Most people prefer to live a good life themselves, ignoring their responsibilities for the world.", "zh": "", "w": []}, {"en": "This narrow perception of a good life may provide short-term benefits, but is sure to lead to long-term harm and suffering.", "zh": "", "w": []}, {"en": "A good life based on comfort and luxury may eventually lead to more pain because we spoil our health and even our character, principles, ideals, and relationships.", "zh": "", "w": []}], [{"en": "What then, is the secret of a good life?", "zh": "", "w": []}, {"en": "A good life is a process, not a state of being: a direction, not a destination.", "zh": "", "w": []}, {"en": "We have to earn a good life by first serving others without any expectation in return because their happiness is the very source of our own happiness.", "zh": "", "w": []}, {"en": "More importantly, we must know ourselves inside out.", "zh": "", "w": []}, {"en": "Only when we examine ourselves deeply can we discover our abilities and recognize our limitations, and then work accordingly to create a better world.", "zh": "", "w": []}], [{"en": "The first requirement for a good life is having a loving heart.", "zh": "", "w": []}, {"en": "When we do certain right things merely as a duty, we find our job so tiresome that we’ll soon burn out.", "zh": "", "w": []}, {"en": "However, when we do that same job out of love, we not only enjoy what we do, but also do it with an effortless feeling.", "zh": "", "w": []}], [{"en": "However, love alone is insufficient to lead a good life.", "zh": "", "w": []}, {"en": "Love sometimes blinds us to the reality.", "zh": "", "w": []}, {"en": "Consequently, our good intentions may not lead to good results.", "zh": "", "w": []}, {"en": "To achieve desired outcome, those who want to do good to others also need to equip themselves with accurate world knowledge.", "zh": "", "w": []}, {"en": "False knowledge is more dangerous than ignorance.", "zh": "", "w": []}, {"en": "If love is the engine of a car, knowledge is the steering wheel(方向盘).", "zh": "", "w": []}, {"en": "If the engine lacks power, the car can’t move; if the driver loses control of the steering, a road accident probably occurs.", "zh": "", "w": []}, {"en": "Only with love in heart and the right knowledge in mind can we lead a good life.", "zh": "", "w": []}], [{"en": "With love and knowledge, we go all out to create a better world by doing good to others.", "zh": "", "w": []}, {"en": "When we see the impact of our good work on the world we give meaning to our life and earn lasting joy and happiness.", "zh": "", "w": []}]], "nv": 0}, {"id": "p15", "year": 2022, "paper": "上海卷（春考）", "part": "C", "words": 445, "file": "f1", "name": "2022 上海卷（春考） 阅读C", "done": false, "paras": [[{"en": "Conservationists go to war over whether humans are the measure of nature's value.", "zh": "", "w": []}, {"en": "New Conservationists argue such trade-offs are necessary in this human-dominated epoch.", "zh": "", "w": []}, {"en": "And they support “re-wilding”, a concept originally proposed by Soule where people curtail economic growth and withdraw from landscapes, which then return to nature.", "zh": "", "w": []}], [{"en": "New Conservationists believe the withdrawal could happen together with economic growth.", "zh": "", "w": []}, {"en": "The California-based Breakthrough Institute believes in a future where most people live in cities and rely less on natural resources for economic growth.", "zh": "", "w": []}], [{"en": "They would get food from industrial agriculture, including genetically modified foods, desalination, intensified meat production and aquaculture, all of which have a smaller land footprint.", "zh": "", "w": []}, {"en": "And they would get their energy from renewables and natural gas.", "zh": "", "w": []}], [{"en": "Driving these profound shifts would be greater efficiency of production, where more products could be manufactured from fewer inputs.", "zh": "", "w": []}, {"en": "And some unsustainable commodities would be replaced in the market by other, greener ones—natural gas for coal, for instance, explained Michael Shellenberger, president of the Breakthrough Institute.", "zh": "", "w": []}, {"en": "Nature would, in essence, be decoupled from the economy.", "zh": "", "w": []}], [{"en": "And then he added a caveat: “We are not suggesting decoupling as the paradigm to save the world, or that it solves all the problems or eliminates all the trade-offs.”", "zh": "", "w": []}], [{"en": "Cynics (悲观者) may say all this sounds too utopian, but Breakthrough maintains the world is already on this path toward decoupling.", "zh": "", "w": []}, {"en": "Nowhere is this more evident than in the United States, according to Iddo Wernick, a research scholar at the Rockefeller University, who has examined the nation's use of 100 main commodities.", "zh": "", "w": []}], [{"en": "Wernick and his colleagues looked at data carefully from the U.S. Geological Survey National Minerals Information Center, which keeps a record of commodities used from 1900 through the present day.", "zh": "", "w": []}, {"en": "They found that the use of 36 commodities (sand, iron ore, cotton, etc.) in the U.S. economy had peaked.", "zh": "", "w": []}], [{"en": "Another 53 commodities (nitrogen, timber, beef, etc.) are being used more efficiently per dollar value of gross domestic product than in the pre-1970s era.", "zh": "", "w": []}, {"en": "Their use would peak soon, Wernick said.", "zh": "", "w": []}], [{"en": "Only 11 commodities (industrial diamond, indium, chicken, etc.) are increasing in use (Greenwire, Nov. 6), and most of these are employed by industries in small quantities to improve systems processes.", "zh": "", "w": []}, {"en": "Chicken use is rising because people are eating less beef, a desirable development since poultry cultivation has a smaller environmental footprint.", "zh": "", "w": []}], [{"en": "The numbers show the United States has not intensified resource consumption since the 1970s even while increasing its GDP and population, said Jesse Ausubel of the Rockefeller University.", "zh": "", "w": []}], [{"en": "“It seems like the 20th-century expectation we had, we were always assuming the future entailed greater consumption of resources,” Ausubel said.", "zh": "", "w": []}, {"en": "“But what we are seeing in the developed countries is, of course, peaks.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p16", "year": 2022, "paper": "上海卷（秋考）", "part": "C", "words": 494, "file": "f2", "name": "2022 上海卷（秋考） 阅读C", "done": false, "paras": [[{"en": "Business innovation is an organization's process for introducing new ideas, workflows, methodologies, services or products.", "zh": "", "w": []}, {"en": "Like IT innovation, which calls for using technology in new ways to create a more efficient and agile organization, business innovation should enable the achievement of goals across the entire organization, with sights set on accomplishing core business aims and initiatives.", "zh": "", "w": []}, {"en": "Innovation often begins with idea generation, wherein ideas are narrowed down during brainstorming sessions, after which leaders consider the business viability, feasibility and desirability of each idea.", "zh": "", "w": []}, {"en": "Business innovation should improve on existing products, services or processes; or it should solve a problem; or it should reach new customers.", "zh": "", "w": []}, {"en": "Recent examples of business innovation include the introduction of the Dyson vacuum cleaner, whose creator and namesake James Dyson declared in advertisements that he set out to build a better product by applying industrial cyclone technologies to the household appliance.", "zh": "", "w": []}], [{"en": "The purpose of the business innovation process is to create value for the organization.", "zh": "", "w": []}, {"en": "That value can come from creating new revenue opportunities or driving more revenue through existing channels; from creating efficiencies that save time, money or both; or from improvements to productivity or performance.", "zh": "", "w": []}, {"en": "In short, innovation should lead to higher profits.", "zh": "", "w": []}, {"en": "Additionally, the results of an organization's innovation process should yield a competitive advantage; it should help the organization to grow and reach—or, better still, exceed—strategic objectives.", "zh": "", "w": []}], [{"en": "Innovation and invention are closely linked, but the two terms are not interchangeable.", "zh": "", "w": []}, {"en": "An invention is an entirely new creation.", "zh": "", "w": []}, {"en": "The process of business innovation can produce an invention, but the term is broader in scope and includes the application of an existing concept or practice in a new way, or applying new technology to an existing product or process to improve upon it.", "zh": "", "w": []}, {"en": "To better understand the difference, consider this: The telephone is an invention, but the smartphone is an innovation.", "zh": "", "w": []}], [{"en": "Business innovation can also be classified as either revolutionary or evolutionary.", "zh": "", "w": []}, {"en": "Revolutionary business innovation yields a drastic change in a product, service, process, etc., which often destroys or supplants an existing business model.", "zh": "", "w": []}, {"en": "This is also known as radical innovation.", "zh": "", "w": []}, {"en": "Evolutionary or incremental innovation involves smaller, more continuous improvements that, while important, are not drastic enough to shift a company or market into a new paradigm.", "zh": "", "w": []}, {"en": "Disruptive innovation is a category that emphasizes the destructive aspect of revolutionary innovation; this term applies to business innovation that leads to the creation of a new market that displaces an existing one or, similarly, a significant upheaval in a category of products or services.", "zh": "", "w": []}], [{"en": "Business innovation, like most business initiatives, has both benefits and risks.", "zh": "", "w": []}, {"en": "Organizations should recognize on the negative side that the business innovation process can be a costly undertaking that does not always produce a return on investment (ROI); that ideas considered likely to succeed could still fail; and that stakeholders could fight the changes required to be successful.", "zh": "", "w": []}, {"en": "On the other hand, organizations need to weigh those risks against the benefits of business innovation.", "zh": "", "w": []}]], "nv": 0}, {"id": "p17", "year": 2022, "paper": "浙江卷（1月）", "part": "C", "words": 314, "file": "f10", "name": "2022 浙江卷（1月） 阅读C", "done": false, "paras": [[{"en": "The benefits of regular exercise are well documented but there’s a new bonus to add to the ever-growing list.", "zh": "", "w": []}, {"en": "New researchers found that middle-aged women who were physically fit could be nearly 90 percent less likely to develop dementia in later life, and as they did, it came on a decade later than less sporty women.", "zh": "", "w": []}], [{"en": "Lead researcher Dr. Helena Horder, of the University of Gothenburg in Sweden, said: \"These findings are exciting because it’s possible that improving people's cardiovascular (心血管的) fitness in middle age could delay or even prevent them from developing dementia. \"", "zh": "", "w": []}], [{"en": "For the study, 191 women with an average age of 50 took a bicycle exercise test until they were exhausted to measure their peak (最大值的) cardiovascular capacity.", "zh": "", "w": []}, {"en": "The average peak workload was measured at 103 watts.", "zh": "", "w": []}], [{"en": "A total of 40 women met the criteria for a high fitness level, or 120 watts or higher.", "zh": "", "w": []}, {"en": "A total of 92 women were in the medium fitness category; and 59 women were in the low fitness category, defined as a peak workload of 80 watts or less, or having their exercise tests stopped because of high blood pressure, chest pain or other cardiovascular problems.", "zh": "", "w": []}], [{"en": "These women were then tested for dementia six times over the following four decades.", "zh": "", "w": []}, {"en": "During that time, 44 of the women developed dementia.", "zh": "", "w": []}, {"en": "Five percent of the highly fit women developed dementia, compared to 25 percent of the women with medium fitness and 32 percent of the women with low fitness.", "zh": "", "w": []}], [{"en": "\"However, this study does not show cause and effect between cardiovascular fitness and dementia, it only shows an association.", "zh": "", "w": []}, {"en": "More research is needed to see if improved fitness could have a positive effect on the risk of dementia and also to look at when during a lifetime a high fitness level is most important. \" She also admitted that a relatively small number of women were studied, all of whom were from Sweden, so the results might not be applicable to other groups.", "zh": "", "w": []}]], "nv": 0}, {"id": "p18", "year": 2022, "paper": "浙江卷（6月）", "part": "C", "words": 296, "file": "f11", "name": "2022 浙江卷（6月） 阅读C", "done": false, "paras": [[{"en": "Many people believe that working to the maximum is the secret to success, but research has found that moderation (适度) also gets results on the job.", "zh": "", "w": []}], [{"en": "In a study led by Ellen Langer of Harvard University, researchers asked people to translate sentences into a new made-up language.", "zh": "", "w": []}, {"en": "Subjects who practiced the language moderately beforehand made fewer errors than those who practiced extensively or not at all.", "zh": "", "w": []}, {"en": "High levels of knowledge can make people too attached to traditional ways of viewing problems across fields: the arts, sciences, and politics.", "zh": "", "w": []}, {"en": "High conscientiousness is related to lower job performance, especially in simple jobs where it doesn’t pay to be a perfectionist.", "zh": "", "w": []}], [{"en": "How long we stay on the clock and how we spend that time are under careful examination in many workplaces.", "zh": "", "w": []}, {"en": "The young banker who eats lunch at his desk is probably seen as a go-getter, while his colleagues who chat over a relaxed conference-room meal get dirty looks from the corner office.", "zh": "", "w": []}, {"en": "“People from cultures that value relationships more than ours does are shocked by the thought of eating alone in front of a computer,” says Art Markman, a professor of psychology at the University of Texas, Austin.", "zh": "", "w": []}, {"en": "Social interaction has been shown to lift mood (情绪) and get people thinking in new directions and in ways that could help improve any post-lunch effort.", "zh": "", "w": []}], [{"en": "Markman also promotes off-task time.", "zh": "", "w": []}, {"en": "“Part of being a good thinker is experiencing things that are seemingly unrelated to what you are working on at the moment but give you fresh ideas about your work,” he says.", "zh": "", "w": []}, {"en": "“Also, there is a lot of research showing that a positive mood leads to higher levels of productivity and creativity.", "zh": "", "w": []}, {"en": "So, when people do things to increase their life satisfaction, they also make themselves more effective at work.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p19", "year": 2023, "paper": "全国新课标Ⅰ卷", "part": "C", "words": 312, "file": "f19", "name": "2023 全国新课标Ⅰ卷 阅读C", "done": false, "paras": [[{"en": "The goal of this book is to make the case for digital minimalism, including a detailed exploration of what it asks and why it works, and then to teach you how to adopt this philosophy if you decide it’s right for you.", "zh": "", "w": []}], [{"en": "To do so, I divided the book into two parts.", "zh": "", "w": []}, {"en": "In part one, I describe the philosophical foundations of digital minimalism, starting with an examination of the forces that are making so many people’s digital lives increasingly intolerable, before moving on to a detailed discussion of the digital minimalism philosophy.", "zh": "", "w": []}], [{"en": "Part one concludes by introducing my suggested method for adopting this philosophy: the digital declutter.", "zh": "", "w": []}, {"en": "This process requires you to step away from optional online activities for thirty days.", "zh": "", "w": []}, {"en": "At the end of the thirty days, you will then add back a small number of carefully chosen online activities that you believe will provide massive benefits to the things you value.", "zh": "", "w": []}], [{"en": "In the final chapter of part one, I’ll guide you through carrying out your own digital declutter.", "zh": "", "w": []}, {"en": "In doing so, I’ll draw on an experiment I ran in 2018 in which over 1,600 people agreed to perform a digital declutter.", "zh": "", "w": []}, {"en": "You’ll hear these participants’ stories and learn what strategies worked well for them, and what traps they encountered that you should avoid.", "zh": "", "w": []}], [{"en": "The second part of this book takes a closer look at some ideas that will help you cultivate (培养) a sustainable digital minimalism lifestyle.", "zh": "", "w": []}, {"en": "In these chapters, I examine issues such as the importance of solitude (独处) and the necessity of cultivating high-quality leisure to replace the time most now spend on mindless device use.", "zh": "", "w": []}, {"en": "Each chapter concludes with a collection of practices, which are designed to help you act on the big ideas of the chapter.", "zh": "", "w": []}, {"en": "You can view these practices as a toolbox meant to aid your efforts to build a minimalist lifestyle that works for your particular circumstances.", "zh": "", "w": []}]], "nv": 0}, {"id": "p20", "year": 2023, "paper": "全国新课标Ⅰ卷", "part": "D", "words": 331, "file": "f19", "name": "2023 全国新课标Ⅰ卷 阅读D", "done": false, "paras": [[{"en": "On March 7, 1907, the English statistician Francis Galton published a paper which illustrated what has come to be known as the “wisdom of crowds” effect.", "zh": "", "w": []}, {"en": "The experiment of estimation he conducted showed that in some cases, the average of a large number of independent estimates could be quite accurate.", "zh": "", "w": []}], [{"en": "This effect capitalizes on the fact that when people make errors, those errors aren’t always the same.", "zh": "", "w": []}, {"en": "Some people will tend to overestimate, and some to underestimate.", "zh": "", "w": []}, {"en": "When enough of these errors are averaged together, they cancel each other out, resulting in a more accurate estimate.", "zh": "", "w": []}, {"en": "If people are similar and tend to make the same errors, then their errors won’t cancel each other out.", "zh": "", "w": []}, {"en": "In more technical terms, the wisdom of crowds requires that people’s estimates be independent.", "zh": "", "w": []}, {"en": "If for whatever reasons, people’s errors become correlated or dependent, the accuracy of the estimate will go down.", "zh": "", "w": []}], [{"en": "But a new study led by Joaquin Navajas offered an interesting twist (转折) on this classic phenomenon.", "zh": "", "w": []}, {"en": "The key finding of the study was that when crowds were further divided into smaller groups that were allowed to have a discussion, the averages from these groups were more accurate than those from an equal number of independent individuals.", "zh": "", "w": []}, {"en": "For instance, the average obtained from the estimates of four discussion groups of five was significantly more accurate than the average obtained from 20 independent individuals.", "zh": "", "w": []}], [{"en": "In a follow-up study with 100 university students, the researchers tried to get a better sense of what the group members actually did in their discussion.", "zh": "", "w": []}, {"en": "Did they tend to go with those most confident about their estimates?", "zh": "", "w": []}, {"en": "Did they follow those least willing to change their minds?", "zh": "", "w": []}, {"en": "This happened some of the time, but it wasn’t the dominant response.", "zh": "", "w": []}, {"en": "Most frequently, the groups reported that they “shared arguments and reasoned together”.", "zh": "", "w": []}, {"en": "Somehow, these arguments and reasoning resulted in a global reduction in error.", "zh": "", "w": []}, {"en": "Although the studies led by Navajas have limitations and many questions remain, the potential implications for group discussion and decision-making are enormous.", "zh": "", "w": []}]], "nv": 0}, {"id": "p21", "year": 2023, "paper": "全国新课标Ⅱ卷", "part": "C", "words": 320, "file": "f20", "name": "2023 全国新课标Ⅱ卷 阅读C", "done": false, "paras": [[{"en": "Reading Art: Art for Book Lovers is a celebration of an everyday object — the book, represented here in almost three hundred artworks from museums around the world.", "zh": "", "w": []}, {"en": "The image of the reader appears throughout history, in art made long before books as we now know them came into being.", "zh": "", "w": []}, {"en": "In artists’ representations of books and reading, we see moments of shared humanity that go beyond culture and time.", "zh": "", "w": []}], [{"en": "In this “book of books,” artworks are selected and arranged in a way that emphasizes these connections between different eras and cultures.", "zh": "", "w": []}, {"en": "We see scenes of children learning to read at home or at school, with the book as a focus for relations between the generations.", "zh": "", "w": []}, {"en": "Adults are portrayed (描绘) alone in many settings and poses —absorbed in a volume, deep in thought or lost in a moment of leisure.", "zh": "", "w": []}, {"en": "These scenes may have been painted hundreds of years ago, but they record moments we can all relate to.", "zh": "", "w": []}], [{"en": "Books themselves may be used symbolically in paintings to demonstrate the intellect (才智), wealth or faith of the subject.", "zh": "", "w": []}, {"en": "Before the wide use of the printing press, books were treasured objects and could be works of art in their own right.", "zh": "", "w": []}, {"en": "More recently, as books have become inexpensive or even throwaway, artists have used them as the raw material for artworks — transforming covers, pages or even complete volumes into paintings and sculptures.", "zh": "", "w": []}], [{"en": "Continued developments in communication technologies were once believed to make the printed page outdated.", "zh": "", "w": []}, {"en": "From a 21st-century point of view, the printed book is certainly ancient, but it remains as interactive as any battery-powered e-reader.", "zh": "", "w": []}, {"en": "To serve its function, a book must be activated by a user: the cover opened, the pages parted, the contents reviewed, perhaps notes written down or words underlined.", "zh": "", "w": []}, {"en": "And in contrast to our increasingly networked lives where the information we consume is monitored and tracked, a printed book still offers the chance of a wholly private, “off-line” activity.", "zh": "", "w": []}]], "nv": 0}, {"id": "p22", "year": 2023, "paper": "全国新课标Ⅱ卷", "part": "D", "words": 315, "file": "f20", "name": "2023 全国新课标Ⅱ卷 阅读D", "done": false, "paras": [[{"en": "As cities balloon with growth, access to nature for people living in urban areas is becoming harder to find.", "zh": "", "w": []}, {"en": "If you’re lucky, there might be a pocket park near where you live, but it’s unusual to find places in a city that are relatively wild.", "zh": "", "w": []}], [{"en": "Past research has found health and wellness benefits of nature for humans, but a new study shows that wildness in urban areas is extremely important for human well-being.", "zh": "", "w": []}], [{"en": "The research team focused on a large urban park.", "zh": "", "w": []}, {"en": "They surveyed several hundred park-goers, asking them to submit a written summary online of a meaningful interaction they had with nature in the park.", "zh": "", "w": []}, {"en": "The researchers then examined these submissions, coding (编码) experiences into different categories.", "zh": "", "w": []}, {"en": "For example, one participant’s experience of “We sat and listened to the waves at the beach for a while” was assigned the categories “sitting at beach” and “listening to waves.”", "zh": "", "w": []}], [{"en": "Across the 320 submissions, a pattern of categories the researchers call a “nature language” began to emerge.", "zh": "", "w": []}, {"en": "After the coding of all submissions, half a dozen categories were noted most often as important to visitors.", "zh": "", "w": []}, {"en": "These include encountering wildlife, walking along the edge of water, and following an established trail.", "zh": "", "w": []}], [{"en": "Naming each nature experience creates a usable language, which helps people recognize and take part in the activities that are most satisfying and meaningful to them.", "zh": "", "w": []}, {"en": "For example, the experience of walking along the edge of water might be satisfying for a young professional on a weekend hike in the park.", "zh": "", "w": []}, {"en": "Back downtown during a workday, they can enjoy a more domestic form of this interaction by walking along a fountain on their lunch break.", "zh": "", "w": []}], [{"en": "“We’re trying to generate a language that helps bring the human-nature interactions back into our daily lives.", "zh": "", "w": []}, {"en": "And for that to happen, we also need to protect nature so that we can interact with it,” said Peter Kahn, a senior author of the study.", "zh": "", "w": []}]], "nv": 0}, {"id": "p23", "year": 2023, "paper": "全国甲卷", "part": "C", "words": 319, "file": "f15", "name": "2023 全国甲卷 阅读C", "done": false, "paras": [[{"en": "I was about 13 when an uncle gave me a copy of Jostein Gaarder’s Sophie’s World.", "zh": "", "w": []}, {"en": "It was full of ideas that were new to me, so I spent the summer with my head in and out of that book.", "zh": "", "w": []}, {"en": "It spoke to me and brought me into a world of philosophy (哲学).", "zh": "", "w": []}], [{"en": "That love for philosophy lasted until I got to college.", "zh": "", "w": []}, {"en": "Nothing kills the love for philosophy faster than people who think they understand Foucault, Baudrillard, or Confucius better than you — and then try to explain them.", "zh": "", "w": []}], [{"en": "Eric Weiner’s The Socrates Express: In Search of Life Lessons from Dead Philosophers reawakened my love for philosophy.", "zh": "", "w": []}, {"en": "It is not an explanation but an invitation to think and experience philosophy.", "zh": "", "w": []}], [{"en": "Weiner starts each chapter with a scene on a train ride between cities and then frames each philosopher’s work in the context (背景) of one thing they can help us do better.", "zh": "", "w": []}, {"en": "The end result is a read in which we learn to wonder like Socrates, see like Thoreau, listen like Schopenhauer, and have no regrets like Nietzsche.", "zh": "", "w": []}, {"en": "This, more than a book about understanding philosophy, is a book about learning to use philosophy to improve a life.", "zh": "", "w": []}], [{"en": "He makes philosophical thought an appealing exercise that improves the quality of our experiences, and he does so with plenty of humor.", "zh": "", "w": []}, {"en": "Weiner enters into conversation with some of the most important philosophers in history, and he becomes part of that crowd in the process by decoding (解读) their messages and adding his own interpretation.", "zh": "", "w": []}], [{"en": "The Socrates Express is a fun, sharp book that draws readers in with its apparent simplicity and gradually pulls them in deeper thoughts on desire, loneliness, and aging.", "zh": "", "w": []}, {"en": "The invitation is clear: Weiner wants you to pick up a coffee or tea and sit down with this book.", "zh": "", "w": []}, {"en": "I encourage you to take his offer.", "zh": "", "w": []}, {"en": "It’s worth your time, even if time is something we don’t have a lot of.", "zh": "", "w": []}]], "nv": 0}, {"id": "p24", "year": 2023, "paper": "全国甲卷", "part": "D", "words": 306, "file": "f15", "name": "2023 全国甲卷 阅读D", "done": false, "paras": [[{"en": "Grizzly bears, which may grow to about 2.5 m long and weigh over 400 kg, occupy a conflicted corner of the American psyche — we revere (敬畏) them even as they give us frightening dreams.", "zh": "", "w": []}, {"en": "Ask the tourists from around the world that flood into Yellowstone National Park what they most hope to see, and their answer is often the same: a grizzly bear.", "zh": "", "w": []}], [{"en": "“Grizzly bears are re-occupying large areas of their former range,” says bear biologist Chris Servheen.", "zh": "", "w": []}, {"en": "As grizzly bears expand their range into places where they haven’t been seen in a century or more, they’re increasingly being sighted by humans.", "zh": "", "w": []}], [{"en": "The western half of the U.S. was full of grizzlies when Europeans came, with a rough number of 50,000 or more living alongside Native Americans.", "zh": "", "w": []}, {"en": "By the early 1970s, after centuries of cruel and continuous hunting by settlers, 600 to 800 grizzlies remained on a mere 2 percent of their former range in the Northern Rockies.", "zh": "", "w": []}, {"en": "In 1975, grizzlies were listed under the Endangered Species Act.", "zh": "", "w": []}], [{"en": "Today, there are about 2,000 or more grizzly bears in the U.S.", "zh": "", "w": []}, {"en": "Their recovery has been so successful that the U.S. Fish and Wildlife Service has twice attempted to delist grizzlies, which would loosen legal protections and allow them to be hunted.", "zh": "", "w": []}, {"en": "Both efforts were overturned due to lawsuits from conservation groups.", "zh": "", "w": []}, {"en": "For now, grizzlies remain listed.", "zh": "", "w": []}], [{"en": "Obviously, if precautions (预防) aren’t taken, grizzlies can become troublesome, sometimes killing farm animals or walking through yards in search of food.", "zh": "", "w": []}, {"en": "If people remove food and attractants from their yards and campsites, grizzlies will typically pass by without trouble.", "zh": "", "w": []}, {"en": "Putting electric fencing around chicken houses and other farm animal quarters is also highly effective at getting grizzlies away.", "zh": "", "w": []}, {"en": "“Our hope is to have a clean, attractant-free place where bears can pass through without learning bad habits,” says James Jonkel, longtime biologist who manages bears in and around Missoula.", "zh": "", "w": []}]], "nv": 0}, {"id": "p25", "year": 2023, "paper": "全国乙卷", "part": "C", "words": 283, "file": "f14", "name": "2023 全国乙卷 阅读C", "done": false, "paras": [[{"en": "What comes into your mind when you think of British food?", "zh": "", "w": []}, {"en": "Probably fish and chips, or a Sunday dinner of meat and two vegetables.", "zh": "", "w": []}, {"en": "But is British food really so uninteresting?", "zh": "", "w": []}, {"en": "Even though Britain has a reputation for less-than-impressive cuisine, it is producing more top class chefs who appear frequently on our television screens and whose recipe books frequently top the best seller lists.", "zh": "", "w": []}], [{"en": "It’s thanks to these TV chefs rather than any advertising campaign that Britons are turning away from meat-and-two-veg and ready-made meals and becoming more adventurous in their cooking habits.", "zh": "", "w": []}, {"en": "It is recently reported that the number of those sticking to a traditional diet is slowly declining and around half of Britain’s consumers would like to change or improve their cooking in some way.", "zh": "", "w": []}, {"en": "There has been a rise in the number of students applying for food courses at UK universities and colleges.", "zh": "", "w": []}, {"en": "It seems that TV programmes have helped change what people think about cooking.", "zh": "", "w": []}], [{
