"en": "According to a new study from market analysts, 1 in 5 Britons say that watching cookery programmes on TV has encouraged them to try different food.", "zh": "", "w": []}, {"en": "Almost one third say they now use a wider variety of ingredients (配料) than they used to, and just under 1 in 4 say they now buy better quality ingredients than before.", "zh": "", "w": []}, {"en": "One in four adults say that TV chefs have made them much more confident about expanding their cookery knowledge and skills, and young people are also getting more interested in cooking.", "zh": "", "w": []}, {"en": "The UK’s obsession (痴迷) with food is reflected through television scheduling.", "zh": "", "w": []}, {"en": "Cookery shows and documentaries about food are broadcast more often than before.", "zh": "", "w": []}, {"en": "With an increasing number of male chefs on TV, it’s no longer “uncool” for boys to like cooking.", "zh": "", "w": []}]], "nv": 0}, {"id": "p26", "year": 2023, "paper": "全国乙卷", "part": "D", "words": 330, "file": "f14", "name": "2023 全国乙卷 阅读D", "done": false, "paras": [[{"en": "If you want to tell the history of the whole world, a history that does not privilege one part of humanity, you cannot do it through texts alone, because only some of the world has ever had texts, while most of the world, for most of the time, has not.", "zh": "", "w": []}, {"en": "Writing is one of humanity’s later achievements, and until fairly recently even many literate (有文字的) societies recorded their concerns not only in writing but in things.", "zh": "", "w": []}], [{"en": "Ideally a history would bring together texts and objects, and some chapters of this book are able to do just that, but in many cases we simply can’t.", "zh": "", "w": []}, {"en": "The clearest example of this between literate and non-literate history is perhaps the first conflict, at Botany Bay, between Captain Cook’s voyage and the Australian Aboriginals.", "zh": "", "w": []}, {"en": "From the English side, we have scientific reports and the captain’s record of that terrible day.", "zh": "", "w": []}, {"en": "From the Australian side, we have only a wooden shield (盾) dropped by a man in flight after his first experience of gunshot.", "zh": "", "w": []}, {"en": "If we want to reconstruct what was actually going on that day, the shield must be questioned and interpreted as deeply and strictly as the written reports.", "zh": "", "w": []}], [{"en": "In addition to the problem of miscomprehension from both sides, there are victories accidentally or deliberately twisted, especially when only the victors know how to write.", "zh": "", "w": []}, {"en": "Those who are on the losing side often have only their things to tell their stories.", "zh": "", "w": []}, {"en": "The Caribbean Taino, the Australian Aboriginals, the African people of Benin and the Incas, all of whom appear in this book, can speak to us now of their past achievements most powerfully through the objects they made: a history told through things gives them back a voice.", "zh": "", "w": []}, {"en": "When we consider contact (联系) between literate and non-literate societies such as these, all our first-hand accounts are necessarily twisted, only one half of a dialogue.", "zh": "", "w": []}, {"en": "If we are to find the other half of that conversation, we have to read not just the texts, but the objects.", "zh": "", "w": []}]], "nv": 0}, {"id": "p27", "year": 2023, "paper": "北京卷", "part": "C", "words": 354, "file": "f16", "name": "2023 北京卷 阅读C", "done": false, "paras": [[{"en": "In recent years, researchers from diverse fields have agreed that short-termism is now a significant problem in industrialised societies.", "zh": "", "w": []}, {"en": "The inability to engage with longer-term causes and consequences leads to some of the world’s most serious problems: climate change, biodiversity collapse, and more.", "zh": "", "w": []}, {"en": "The historian Francis Cole argues that the West has entered a period where “only the present exists, a present characterised at once by the cruelty of the instant and by the boredom of an unending now”.", "zh": "", "w": []}], [{"en": "It has been proved that people have a bias (偏向) towards the present, focusing on loud attractions in the moment at the expense of the health, well-being and financial stability of their future selves or community.", "zh": "", "w": []}, {"en": "In business, this bias surfaces as short-sighted decisions.", "zh": "", "w": []}, {"en": "And on slow-burning problems like climate change, it translates into the unwillingness to make small sacrifices (牺牲) today that could make a major difference tomorrow.", "zh": "", "w": []}, {"en": "Instead, all that matters is next quarter’s profit, or satisfying some other near-term desires.", "zh": "", "w": []}], [{"en": "These biased perspectives cannot be blamed on one single cause.", "zh": "", "w": []}, {"en": "It is fair to say, though, that our psychological biases play a major role.", "zh": "", "w": []}, {"en": "People’s hesitancy to delay satisfaction is the most obvious example, but there are others.", "zh": "", "w": []}, {"en": "One of them is about how the most accessible information in the present affects decisions about the future.", "zh": "", "w": []}, {"en": "For instance, you might hear someone say: “It’s cold this winter, so I needn’t worry about global warming.”", "zh": "", "w": []}, {"en": "Another is that loud and urgent matters are given too much importance, making people ignore longer-term trends that arguably matter more.", "zh": "", "w": []}, {"en": "This is when a pop star draws far more attention than, say, gradual biodiversity decline.", "zh": "", "w": []}], [{"en": "As a psychologist once joked, if aliens (外星人) wanted to weaken humanity, they wouldn’t send ships; they would invent climate change.", "zh": "", "w": []}, {"en": "Indeed, when it comes to environmental transformations, we can develop a form of collective “poor memory”, and each new generation can believe the state of affairs they encounter is nothing out of the ordinary.", "zh": "", "w": []}, {"en": "Older people today, for example, can remember a time with insect-covered car windscreens after long drives.", "zh": "", "w": []}, {"en": "Children, on the other hand, have no idea that insect population has dropped dramatically.", "zh": "", "w": []}]], "nv": 0}, {"id": "p28", "year": 2023, "paper": "北京卷", "part": "D", "words": 411, "file": "f16", "name": "2023 北京卷 阅读D", "done": false, "paras": [[{"en": "What is life?", "zh": "", "w": []}, {"en": "Like most great questions, this one is easy to ask but difficult to answer.", "zh": "", "w": []}, {"en": "The reason is simple: we know of just one type of life and it’s challenging to do science with a sample size of one.", "zh": "", "w": []}, {"en": "The field of artificial life — called ALife for short — is the systematic attempt to spell out life’s fundamental principles.", "zh": "", "w": []}, {"en": "Many of these practitioners, so-called ALifers, think that somehow making life is the surest way to really understand what life is.", "zh": "", "w": []}], [{"en": "So far no one has convincingly made artificial life.", "zh": "", "w": []}, {"en": "This track record makes ALife a ripe target for criticism, such as declarations of the field’s doubtful scientific value.", "zh": "", "w": []}, {"en": "Alan Smith, a complexity scientist, is tired of such complaints.", "zh": "", "w": []}, {"en": "Asking about “the point” of ALife might be, well, missing the point entirely, he says.", "zh": "", "w": []}, {"en": "“The existence of a living system is not about the use of anything.”", "zh": "", "w": []}, {"en": "Alan says.", "zh": "", "w": []}, {"en": "“Some people ask me, ‘So what’s the worth of artificial life?’", "zh": "", "w": []}, {"en": "Do you ever think, ‘What is the worth of your grandmother?’”", "zh": "", "w": []}], [{"en": "As much as many ALifers hate emphasizing their research’s applications, the attempts to create artificial life could have practical payoffs.", "zh": "", "w": []}, {"en": "Artificial intelligence may be considered ALife’s cousin in that researchers in both fields are enamored by a concept called open-ended evolution (演化).", "zh": "", "w": []}, {"en": "This is the capacity for a system to create essentially endless complexity, to be a sort of “novelty generator”.", "zh": "", "w": []}, {"en": "The only system known to exhibit this is Earth’s biosphere.", "zh": "", "w": []}, {"en": "If the field of ALife manages to reproduce life’s endless “creativity” in some virtual model, those same principles could give rise to truly inventive machines.", "zh": "", "w": []}], [{"en": "Compared with the developments of AI, advances in ALife are harder to recognize.", "zh": "", "w": []}, {"en": "One reason is that ALife is a field in which the central concept — life itself — is undefined.", "zh": "", "w": []}, {"en": "The lack of agreement among ALifers doesn’t help either.", "zh": "", "w": []}, {"en": "The result is a diverse line of projects that each advance along their unique paths.", "zh": "", "w": []}, {"en": "For better or worse, ALife mirrors the very subject it studies.", "zh": "", "w": []}, {"en": "Its muddled (混乱的) progression is a striking parallel (平行线) to the evolutionary struggles that have shaped Earth’s biosphere.", "zh": "", "w": []}], [{"en": "Undefined and uncontrolled, ALife drives its followers to repurpose old ideas and generated novelty.", "zh": "", "w": []}, {"en": "It may be, of course, that these characteristics aren’t in any way surprising or singular.", "zh": "", "w": []}, {"en": "They may apply universally to all acts of evolution.", "zh": "", "w": []}, {"en": "Ultimately ALife may be nothing special.", "zh": "", "w": []}, {"en": "But even this dismissal suggests something: perhaps, just like life itself throughout the universe, the rise of ALife will prove unavoidable.", "zh": "", "w": []}]], "nv": 0}, {"id": "p29", "year": 2023, "paper": "天津卷（第一次·3月）", "part": "C", "words": 410, "file": "f17", "name": "2023 天津卷（第一次·3月） 阅读C", "done": false, "paras": [[{"en": "I love making art and looking at artworks.", "zh": "", "w": []}, {"en": "I’ve found myself wondering how we gain pleasure from art.", "zh": "", "w": []}, {"en": "And now neuroaesthetics, a combination of neuroscience (神经科学) and aesthetics (美学), may provide an answer.", "zh": "", "w": []}], [{"en": "Neuroaesthetics is a relatively young field of research on what happens in the brain when we make aesthetic assessments.", "zh": "", "w": []}, {"en": "Researchers use brain imaging technique to see which brain areas light up when we view paintings that we consider beautiful.", "zh": "", "w": []}, {"en": "Similar research has been done to understand the “neuronal fireworks” that occur when we look at inspiring sculptures, attractive faces, impressive dance, etc.", "zh": "", "w": []}], [{"en": "But why do we find some art beautiful and other art ugly?", "zh": "", "w": []}, {"en": "According to research, it all comes down to the “aesthetic triad (三元组合)”.", "zh": "", "w": []}], [{"en": "The first part of the triad is sensory-motor.", "zh": "", "w": []}, {"en": "This involves perceiving things like colours, shapes and movements.", "zh": "", "w": []}, {"en": "Movement in art has an interesting role.", "zh": "", "w": []}, {"en": "If you see a painting of a movement, like of a man pulling his arm away after being bitten by a dog, you feel like going through a similar experience.", "zh": "", "w": []}, {"en": "The part of your brain that controls your own movements lights up in response.", "zh": "", "w": []}], [{"en": "Second is emotion-valuation.", "zh": "", "w": []}, {"en": "This is how a piece of art makes you feel, and whether or not you appreciate or enjoy that feeling.", "zh": "", "w": []}, {"en": "The part of the brain related to pleasure is activated in response to something we find beautiful.", "zh": "", "w": []}, {"en": "This system can be affected in fascinating ways, as found by research using transcranial magnetic stimulation (TMS) (经颅磁刺激).", "zh": "", "w": []}, {"en": "If TMS is applied to a specific part of your brain behind your forehead that is particularly important for decision-making, you suddenly like different kinds of art.", "zh": "", "w": []}, {"en": "Such stimulation produces significant changes in aesthetic appreciation of faces, bodies and artworks.", "zh": "", "w": []}], [{"en": "The third part is meaning-knowledge.", "zh": "", "w": []}, {"en": "This is to do with how we can connect with a piece of art and what meaning we can create in it.", "zh": "", "w": []}, {"en": "Art is deeply personal, because when two people see the same artwork, our perception can create vastly different experiences of meaning.", "zh": "", "w": []}, {"en": "If we find meaning, then we often find pleasure.", "zh": "", "w": []}, {"en": "We also get enjoyment from the knowledge of how something was made.", "zh": "", "w": []}, {"en": "For the images that an artist creates, viewers will probably get far more enjoyment once they know the process used to create them.", "zh": "", "w": []}], [{"en": "Informed by neuroaesthetics, the next time I create my art I will value the process even more, enjoying the activation of the aesthetic triad in my brain as I admire the vivid images that I have created.", "zh": "", "w": []}]], "nv": 0}, {"id": "p30", "year": 2023, "paper": "天津卷（第一次·3月）", "part": "D", "words": 410, "file": "f17", "name": "2023 天津卷（第一次·3月） 阅读D", "done": false, "paras": [[{"en": "Most people with good sense would accept that we can and should learn from accidental failures.", "zh": "", "w": []}, {"en": "It would be impossible to progress in anything, after all, without taking the occasional misstep.", "zh": "", "w": []}, {"en": "And by understanding how we slipped, we can avoid falling in the future.", "zh": "", "w": []}], [{"en": "Few would advocate making intentional mistakes, however.", "zh": "", "w": []}, {"en": "Yet consciously erring (犯错) can promote deeper understanding and better recall.", "zh": "", "w": []}, {"en": "The phenomenon is known as the derring effect—coming from “deliberate (故意的) erring”—and when applied properly, it may bring benefits in many unexpected areas of life.", "zh": "", "w": []}], [{"en": "In one experiment carried out at the National University of Singapore, participants were given the task of learning concepts on a difficult subject.", "zh": "", "w": []}, {"en": "For some terms, they simply copied out the correct definition; for others, they were asked to first add an error in their description of the term before correcting the mistake.", "zh": "", "w": []}], [{"en": "Naturally, you would expect the addition of the errors to have increased unwanted confusion.", "zh": "", "w": []}, {"en": "Yet the exact opposite was true: the participants who made deliberate errors learned about twice as much as the people who simply copied out the correct definitions.", "zh": "", "w": []}], [{"en": "The derring effect could be applied in other situations.", "zh": "", "w": []}, {"en": "So a music teacher may find the addition of deliberate errors could help a student remember the right musical notes.", "zh": "", "w": []}, {"en": "Such a playful approach could fuel their creativity for composition, if the student looks for ways to develop those wrong notes into something more attractive.", "zh": "", "w": []}, {"en": "It is encouraging to discover that by readily accepting our errors and wisely placing ourselves in the way of being wrong, we can in fact overcome weaknesses and rise stronger.", "zh": "", "w": []}], [{"en": "The derring effect could be useful for many other challenges too.", "zh": "", "w": []}, {"en": "If you enjoy cooking, for example, you may faithfully follow a recipe without questioning the instructions.", "zh": "", "w": []}, {"en": "But why not try to break away from those habits and deliberately do the “wrong” thing for a change, and see where your derring takes you?", "zh": "", "w": []}, {"en": "If you are painting, meanwhile, you could relax one of the constraints (限制) that you usually put on your work and see what you produce.", "zh": "", "w": []}], [{"en": "At worst, you will have refreshed and deepened your knowledge of the rules you normally apply, so that you can be even more effective next time.", "zh": "", "w": []}, {"en": "At best, you may just find that you have discovered something completely new and unexpected, through a flash of inspiration that you would have missed with perfectionism.", "zh": "", "w": []}, {"en": "Either way, your apparent missteps will have moved you a little closer to true mastery.", "zh": "", "w": []}]], "nv": 0}, {"id": "p31", "year": 2023, "paper": "天津卷（第二次·6月）", "part": "C", "words": 396, "file": "f18", "name": "2023 天津卷（第二次·6月） 阅读C", "done": false, "paras": [[{"en": "Getting the “side-eye” look from your dog can make it seem like they are making a judgement about you, and some new studies suggest they really could be.", "zh": "", "w": []}], [{"en": "The ability to judge others’ intentions is an indicator of possessing “theory of mind” which was once thought to be unique to humans.", "zh": "", "w": []}, {"en": "However, new studies have shown that dogs can read human behaviour and have a preference to people who are more friendly or generous with food.", "zh": "", "w": []}], [{"en": "One such study published in 2023 aimed to see if dogs can tell the difference between humans who are “unwilling” or “unable” to give them a treat.", "zh": "", "w": []}, {"en": "96 dogs were involved in both “unwilling” and “unable” scenarios (情境) designed for the study.", "zh": "", "w": []}, {"en": "Both scenarios involved a dog being placed on one side of a glass screen with small holes in it at nose-height, and an experimenter standing on the other.", "zh": "", "w": []}, {"en": "In the “unwilling” scenario, the experimenter would hang a piece of sausage in front of the screen in a “teasing” (戏耍的) manner, and approach one of the holes.", "zh": "", "w": []}, {"en": "But instead of passing it through the hole to the dog, they would then pull it out of its reach.", "zh": "", "w": []}, {"en": "For the “unable” scenario, the experimenter would again move the treat towards the hole while the dog watched, but “accidentally” drop it before they could pass it through.", "zh": "", "w": []}], [{"en": "The researchers observed that the dogs were much more patient, making more eye contact and staying closer to the screen after the “unable” scenario played out.", "zh": "", "w": []}, {"en": "In the “unwilling” scenario, however, the dogs looked at the experimenter less often, sat, lay down and wandered around more frequently.", "zh": "", "w": []}], [{"en": "Another study from 2021 tested for “theory of mind” in dogs in a similar way, but the dogs were able to walk round the screen to obtain the treat after witnessing the experimenter’s “unwilling” or “unable” behaviour.", "zh": "", "w": []}, {"en": "The main finding was that the dogs approached the experimenter significantly sooner in the unable scenario than in the unwilling scenario.", "zh": "", "w": []}], [{"en": "However, the researchers of the 2023 study challenged that the food dropped on the floor in the clumsy (笨拙的) manner might have motivated the dogs to approach the experimenter considering that they probably often obtain food dropped on the floor in their daily lives.", "zh": "", "w": []}], [{"en": "Now, more evidence has been provided that dogs distinguish between similar actions associated with different intentions.", "zh": "", "w": []}, {"en": "But how exactly they acquire such intention-reading abilities will be an exciting topic for future research.", "zh": "", "w": []}]], "nv": 0}, {"id": "p32", "year": 2023, "paper": "天津卷（第二次·6月）", "part": "D", "words": 353, "file": "f18", "name": "2023 天津卷（第二次·6月） 阅读D", "done": false, "paras": [[{"en": "Storytelling is an ancient art form that has been used to hand down legends, tales and factual stories.", "zh": "", "w": []}, {"en": "Perhaps the first thing that springs to mind when you think of storytelling is the fantasy land that took shape in your mind while Mom or Dad told you stories about princes, castles and monsters, with a unique voice for each character.", "zh": "", "w": []}], [{"en": "Storytelling does not just take place at bedtime or round a campfire, however.", "zh": "", "w": []}, {"en": "It can take some other forms, either via the books we read or the films we watch.", "zh": "", "w": []}, {"en": "But they usually have some elements in common: rather than a list of dry facts, stories have plots and they introduce characters.", "zh": "", "w": []}, {"en": "We respond to stories, particularly when there is emotional detail.", "zh": "", "w": []}], [{"en": "And unlike what we suppose, storytelling is not just a form of entertainment, but a form of learning as well.", "zh": "", "w": []}, {"en": "Long before reading and writing became widely spread and available, oral storytelling had already been a form that the wisdom and knowledge of the people were passed down from elders to children.", "zh": "", "w": []}, {"en": "A good story engages our curiosity, emotions and imagination.", "zh": "", "w": []}], [{"en": "Storytelling helps with learning also because stories are easy to remember.", "zh": "", "w": []}, {"en": "Research has found that learning obtained from a well-told story is remembered more accurately, and for far longer, than from facts and figures.", "zh": "", "w": []}, {"en": "And above all, stories have a transformative power to allow us to see the world in a different way than we do if we just encounter it on our own.", "zh": "", "w": []}, {"en": "Stories are an entry point to understanding a different experience of the world.", "zh": "", "w": []}], [{"en": "This aspect of storytelling—presenting a different perspective of the world—is important when it comes to connecting with each other.", "zh": "", "w": []}, {"en": "It gives us an opportunity to learn from another person’s experience and it can shape, strengthen or challenge our opinions and values.", "zh": "", "w": []}, {"en": "So, when someone tells us their own personal story, we catch a glimpse (瞥见) of a view of the world that may be slightly or significantly different from our own.", "zh": "", "w": []}, {"en": "When we see the world as they see it, or walk in their shoes, the experience can inspire empathy (共情；同理心) with them.", "zh": "", "w": []}]], "nv": 0}, {"id": "p33", "year": 2023, "paper": "上海卷（春考）", "part": "C", "words": 416, "file": "f12", "name": "2023 上海卷（春考） 阅读C", "done": false, "paras": [[{"en": "To tell the age of most layered rocks, scientists study the fossils these rocks contain.", "zh": "", "w": []}, {"en": "Fossils provide important evidence to help determine what happened in Earth history and when it happened.", "zh": "", "w": []}], [{"en": "The word “ fossil” makes many people think of dinosaurs.", "zh": "", "w": []}, {"en": "Dinosaurs are now featured in books, movies, and television programs, and the bones of some large dinosaurs are on display in many museums.", "zh": "", "w": []}, {"en": "These reptiles were dominant animals on Earth for well over 100 million years from the Late Triassic through the Late Cretaceous.", "zh": "", "w": []}, {"en": "Many dinosaurs were quite small, but by the middle of the Mesozoic Period, some species weighed as much as 80 tons.", "zh": "", "w": []}, {"en": "By around 65 million years ago all dinosaurs were extinct.", "zh": "", "w": []}], [{"en": "In spite of all of the interest in dinosaurs, they form only a small fraction of the millions of species that live and have lived on Earth.", "zh": "", "w": []}, {"en": "The great bulk of the fossil record is dominated by fossils of animals with shells and microscopic remains of plants and animals, and these remains are widespread in sedimentary rocks.", "zh": "", "w": []}, {"en": "It is these fossils that are studied by most paleontologists.", "zh": "", "w": []}], [{"en": "In the late eighteenth and early nineteenth centuries, the English geologist and engineer William Smith and the French paleontologists Georges Cuvier and Alexandre Brongniart discovered that rocks of the same age may contain the same fossils even when the rocks are separated by long distances.", "zh": "", "w": []}, {"en": "They published the first geologic maps of large areas on which rocks containing similar fossils were shown.", "zh": "", "w": []}, {"en": "By careful observation of the rocks and their fossils, these men and other geologists were able to recognize rocks of the same age on opposite sides of the English Channel.", "zh": "", "w": []}], [{"en": "William Smith was able to apply his knowledge of fossils in a very practical way.", "zh": "", "w": []}, {"en": "He was an engineer building canals in England, which has lots of vegetation and few surface exposures of rock.", "zh": "", "w": []}, {"en": "He needed to know what rocks he could expect to find on the hills through which he had to build a canal.", "zh": "", "w": []}, {"en": "Often he could tell what kind of rock was likely to be below the surface by examining the fossils that had eroded from the rocks of the hillside or by digging a small hole to find fossils.", "zh": "", "w": []}, {"en": "Knowing what rocks to expect allowed Smith to estimate costs and determine what tools were needed for the job.", "zh": "", "w": []}], [{"en": "Smith and others knew that the succession of life forms preserved as fossils is useful for understanding how and when the rocks formed.", "zh": "", "w": []}, {"en": "Only later did scientists develop a theory to explain that succession.", "zh": "", "w": []}]], "nv": 0}, {"id": "p34", "year": 2023, "paper": "上海卷（秋考）", "part": "C", "words": 418, "file": "f13", "name": "2023 上海卷（秋考） 阅读C", "done": false, "paras": [[{"en": "The universe expands with every passing second, stretching the space between galaxies like dough rising in an oven.", "zh": "", "w": []}, {"en": "But just how fast is this expansion happening?", "zh": "", "w": []}, {"en": "As telescopes like Hubble strive to answer this fundamental question, they encounter a perplexing gap between theoretical predictions and observed data.", "zh": "", "w": []}], [{"en": "Hubble's measurements indicate a faster rate of expansion in the modern universe compared to what was expected based on observations of the universe more than 13 billion years ago by the European Space Agency's Planck satellite.", "zh": "", "w": []}, {"en": "This inconsistency has been a subject of scientific inquiry for several years.", "zh": "", "w": []}, {"en": "However, it remains uncertain whether differences in measurement techniques or chance variations are responsible for this disparity.", "zh": "", "w": []}], [{"en": "Recent data from the Hubble telescope have significantly reduced the possibility that this discrepancy is merely a statistical fluke, with the chances now estimated at only 1 in 100,000.", "zh": "", "w": []}, {"en": "This marks a substantial improvement from previous estimates, which placed the odds at 1 in 3,000 less than a year ago.", "zh": "", "w": []}, {"en": "These precise measurements from Hubble lend weight to the hypothesis that new physics may be necessary to reconcile the observed mismatch.", "zh": "", "w": []}], [{"en": "Lead researcher Adam Riess, a Nobel laureate from the Space Telescope Science Institute and Johns Hopkins University, describes the tension between the early and late universe as one of the most exciting developments in cosmology in decades.", "zh": "", "w": []}, {"en": "He emphasizes that the growing disparity cannot be dismissed as a random occurrence and suggests that it may signal the need for a deeper understanding of the cosmos.", "zh": "", "w": []}], [{"en": "To determine distances in the universe, scientists rely on a \"cosmic distance ladder\" method.", "zh": "", "w": []}, {"en": "This involves accurately measuring distances to nearby galaxies and then using progressively distant galaxies as reference points.", "zh": "", "w": []}, {"en": "By observing stars like Cepheid variables, astronomers can calibrate this distance ladder.", "zh": "", "w": []}, {"en": "Riess and his team have been refining these measurements since 2005, aiming to improve our understanding of cosmic distances.", "zh": "", "w": []}], [{"en": "In their latest study, astronomers used Hubble to observe 70 Cepheid variables in the Large Magellanic Cloud.", "zh": "", "w": []}, {"en": "By comparing these stars with their more distant counterparts in galaxies hosting supernovae, they refined their measurement of the Hubble constant, reducing its uncertainty from 2.2% to 1.9%.", "zh": "", "w": []}, {"en": "Despite this increased precision, their calculated Hubble constant remains at odds with the value predicted by observations of the early universe conducted by Planck.", "zh": "", "w": []}], [{"en": "The Planck satellite, which maps the cosmic microwave background – a remnant of the universe's early stages – provides crucial data for understanding the universe's expansion.", "zh": "", "w": []}, {"en": "However, the discrepancy between these measurements and those from Hubble underscores the need for further investigation and the potential for new discoveries in cosmology.", "zh": "", "w": []}]], "nv": 0}, {"id": "p35", "year": 2023, "paper": "浙江卷（1月）", "part": "C", "words": 314, "file": "f21", "name": "2023 浙江卷（1月） 阅读C", "done": false, "paras": [[{"en": "A machine can now not only beat you at chess, it can also outperform you in debate.", "zh": "", "w": []}, {"en": "Last week, in a public debate in San Francisco, a software program called Project Debater beat its human opponents, including Noa Ovadia, Israel’s former national debating champion.", "zh": "", "w": []}], [{"en": "Brilliant though it is, Project Debater has some weaknesses.", "zh": "", "w": []}, {"en": "It takes sentences from its library of documents and prebuilt arguments and strings them together.", "zh": "", "w": []}, {"en": "This can lead to the kinds of errors no human would make.", "zh": "", "w": []}, {"en": "Such wrinkles will no doubt be ironed out, yet they also point to a fundamental problem.", "zh": "", "w": []}, {"en": "As Kristian Hammond, professor of electrical engineering and computer science at Northwestern University, put it: “There’s never a stage at which the system knows what it’s talking about.”", "zh": "", "w": []}], [{"en": "What Hammond is referring to is the question of meaning, and meaning is central to what distinguishes the least intelligent of humans from the most intelligent of machines.", "zh": "", "w": []}, {"en": "A computer works with symbols.", "zh": "", "w": []}, {"en": "Its program specifies a set of rules to transform one string of symbols into another.", "zh": "", "w": []}, {"en": "But it does not specify what those symbols mean.", "zh": "", "w": []}, {"en": "Indeed, to a computer, meaning is irrelevant.", "zh": "", "w": []}, {"en": "Humans, in thinking, talking, reading and writing, also work with symbols.", "zh": "", "w": []}, {"en": "But for humans, meaning is everything.", "zh": "", "w": []}, {"en": "When we communicate, we communicate meaning.", "zh": "", "w": []}, {"en": "What matters is not just the outside of a string of symbols, but the inside too, not just how they are arranged but what they mean.", "zh": "", "w": []}], [{"en": "Meaning emerges through a process of social interaction, not of computation, interaction that shapes the content of the symbols in our heads.", "zh": "", "w": []}, {"en": "The rules that assign meaning lie not just inside our heads, but also outside, in society, in social memory, social conventions and social relations.", "zh": "", "w": []}, {"en": "It is this that distinguishes humans from machines.", "zh": "", "w": []}, {"en": "And that’s why, however astonishing Project Debater may seem, the tradition that began with Socrates and Confucius will not end with artificial intelligence.", "zh": "", "w": []}]], "nv": 0}, {"id": "p36", "year": 2023, "paper": "浙江卷（1月）", "part": "D", "words": 313, "file": "f21", "name": "2023 浙江卷（1月） 阅读D", "done": false, "paras": [[{"en": "According to the Solar Energy Industry Association, the number of solar panels installed (安装) has grown rapidly in the past decade, and it has to grow even faster to meet climate goals.", "zh": "", "w": []}, {"en": "But all of that growth will take up a lot of space, and though more and more people accept the concept of solar energy, few like large solar panels to be installed near them.", "zh": "", "w": []}], [{"en": "Solar developers want to put up panels as quickly and cheaply as possible, so they haven’t given much thought to what they put under them.", "zh": "", "w": []}, {"en": "Often, they’ll end up filling the area with small stones and using chemicals to control weeds.", "zh": "", "w": []}, {"en": "The result is that many communities, especially in farming regions, see solar farms as destroyers of the soil.", "zh": "", "w": []}], [{"en": "“Solar projects need to be good neighbors,” says Jordan Macknick, the head of the Innovative Site Preparation and Impact Reductions on the Environment (InSPIRE) project.", "zh": "", "w": []}, {"en": "“They need to be protectors of the land and contribute to the agricultural economy.”", "zh": "", "w": []}, {"en": "InSPIRE is investigating practical approaches to “low-impact” solar development, which focuses on establishing and operating solar farms in a way that is kinder to the land.", "zh": "", "w": []}, {"en": "One of the easiest low-impact solar strategies is providing habitat for pollinators (传粉昆虫).", "zh": "", "w": []}], [{"en": "Habitat loss, pesticide use, and climate change have caused dramatic declines in pollinator populations over the past couple of decades, which has damaged the U.S. agricultural economy.", "zh": "", "w": []}, {"en": "Over 28 states have passed laws related to pollinator habitat protection and pesticide use.", "zh": "", "w": []}, {"en": "Conservation organizations put out pollinator-friendliness guidelines for home gardens, businesses, schools, cities—and now there are guidelines for solar farms.", "zh": "", "w": []}], [{"en": "Over the past few years, many solar farm developers have transformed the space under their solar panels into a shelter for various kinds of pollinators, resulting in soil improvement and carbon reduction.", "zh": "", "w": []}, {"en": "“These pollinator-friendly solar farms can have a valuable impact on everything that’s going on in the landscape,” says Macknick.", "zh": "", "w": []}]], "nv": 0}, {"id": "p37", "year": 2024, "paper": "全国新课标Ⅰ卷", "part": "C", "words": 333, "file": "f24", "name": "2024 全国新课标Ⅰ卷 阅读C", "done": false, "paras": [[{"en": "Is comprehension the same whether a person reads a text onscreen or on paper?", "zh": "", "w": []}, {"en": "And are listening to and viewing content as effective as reading the written word when covering the same material?", "zh": "", "w": []}, {"en": "The answers to both questions are often “no”.", "zh": "", "w": []}, {"en": "The reasons relate to a variety of factors, including reduced concentration, an entertainment mindset (心态) and a tendency to multitask while consuming digital content.", "zh": "", "w": []}], [{"en": "When reading texts of several hundred words or more, learning is generally more successful when it’s on paper than onscreen.", "zh": "", "w": []}, {"en": "A large amount of research confirms this finding.", "zh": "", "w": []}, {"en": "The benefits of print reading particularly shine through when experimenters move from posing simple tasks — like identifying the main idea in a reading passage — to ones that require mental abstraction — such as drawing inferences from a text.", "zh": "", "w": []}], [{"en": "The differences between print and digital reading results are partly related to paper’s physical properties.", "zh": "", "w": []}, {"en": "With paper, there is a literal laying on of hands, along with the visual geography of distinct pages.", "zh": "", "w": []}, {"en": "People often link their memory of what they’ve read to how far into the book it was or where it was on the page.", "zh": "", "w": []}], [{"en": "But equally important is the mental aspect.", "zh": "", "w": []}, {"en": "Reading researchers have proposed a theory called “shallowing hypothesis (假说)”.", "zh": "", "w": []}, {"en": "According to this theory, people approach digital texts with a mindset suited to social media, which are often not so serious, and devote less mental effort than when they are reading print.", "zh": "", "w": []}], [{"en": "Audio (音频) and video can feel more engaging than text, and so university teachers increasingly turn to these technologies — say, assigning an online talk instead of an article by the same person.", "zh": "", "w": []}, {"en": "However, psychologists have demonstrated that when adults read news stories, they remember more of the content than if they listen to or view identical pieces.", "zh": "", "w": []}], [{"en": "Digital texts, audio and video all have educational roles, especially when providing resources not available in print.", "zh": "", "w": []}, {"en": "However, for maximizing learning where mental focus and reflection are called for, educators shouldn’t assume all media are the same, even when they contain identical words.", "zh": "", "w": []}]], "nv": 0}, {"id": "p38", "year": 2024, "paper": "全国新课标Ⅰ卷", "part": "D", "words": 353, "file": "f24", "name": "2024 全国新课标Ⅰ卷 阅读D", "done": false, "paras": [[{"en": "In the race to document the species on Earth before they go extinct, researchers and citizen scientists have collected billions of records.", "zh": "", "w": []}, {"en": "Today, most records of biodiversity are often in the form of photos, videos, and other digital records.", "zh": "", "w": []}, {"en": "Though they are useful for detecting shifts in the number and variety of species in an area, a new Stanford study has found that this type of record is not perfect.", "zh": "", "w": []}], [{"en": "“With the rise of technology it is easy for people to make observations of different species with the aid of a mobile application,” said Barnabas Daru, who is lead author of the study and assistant professor of biology in the Stanford School of Humanities and Sciences.", "zh": "", "w": []}, {"en": "“These observations now outnumber the primary data that comes from physical specimens (标本), and since we are increasingly using observational data to investigate how species are responding to global change, I wanted to know: Are they usable?”", "zh": "", "w": []}], [{"en": "Using a global dataset of 1.9 billion records of plants, insects, birds, and animals, Daru and his team tested how well these data represent actual global biodiversity patterns.", "zh": "", "w": []}], [{"en": "“We were particularly interested in exploring the aspects of sampling that tend to bias (使有偏差) data, like the greater likelihood of a citizen scientist to take a picture of a flowering plant instead of the grass right next to it,” said Daru.", "zh": "", "w": []}], [{"en": "Their study revealed that the large number of observation-only records did not lead to better global coverage.", "zh": "", "w": []}, {"en": "Moreover, these data are biased and favor certain regions, time periods, and species.", "zh": "", "w": []}, {"en": "This makes sense because the people who get observational biodiversity data on mobile devices are often citizen scientists recording their encounters with species in areas nearby.", "zh": "", "w": []}, {"en": "These data are also biased toward certain species with attractive or eye-catching features.", "zh": "", "w": []}], [{"en": "What can we do with the imperfect datasets of biodiversity?", "zh": "", "w": []}], [{"en": "“Quite a lot,” Daru explained.", "zh": "", "w": []}, {"en": "“Biodiversity apps can use our study results to inform users of oversampled areas and lead them to places — and even species — that are not well-sampled.", "zh": "", "w": []}, {"en": "To improve the quality of observational data, biodiversity apps can also encourage users to have an expert confirm the identification of their uploaded image.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p39", "year": 2024, "paper": "全国新课标Ⅱ卷", "part": "C", "words": 264, "file": "f25", "name": "2024 全国新课标Ⅱ卷 阅读C", "done": false, "paras": [[{"en": "We all know fresh is best when it comes to food.", "zh": "", "w": []}, {"en": "However, most produce at the store went through weeks of travel and covered hundreds of miles before reaching the table.", "zh": "", "w": []}, {"en": "While farmer’s markets are a solid choice to reduce the journey, Babylon Micro-Farm (BMF) shortens it even more.", "zh": "", "w": []}], [{"en": "BMF is an indoor garden system.", "zh": "", "w": []}, {"en": "It can be set up for a family.", "zh": "", "w": []}, {"en": "Additionally, it could serve a larger audience such as a hospital, restaurant or school.", "zh": "", "w": []}, {"en": "The innovative design requires little effort to achieve a reliable weekly supply of fresh greens.", "zh": "", "w": []}], [{"en": "Specifically, it’s a farm that relies on new technology.", "zh": "", "w": []}, {"en": "By connecting through the Cloud, BMF is remotely monitored.", "zh": "", "w": []}, {"en": "Also, there is a convenient app that provides growing data in real time.", "zh": "", "w": []}, {"en": "Because the system is automated, it significantly reduces the amount of water needed to grow plants.", "zh": "", "w": []}, {"en": "Rather than watering rows of soil, the system provides just the right amount to each plant.", "zh": "", "w": []}, {"en": "After harvest, users simply replace the plants with a new pre-seeded pod (容器) to get the next growth cycle started.", "zh": "", "w": []}], [{"en": "Moreover, having a system in the same building where it’s eaten means zero emissions (排放) from transporting plants from soil to salad.", "zh": "", "w": []}, {"en": "In addition, there’s no need for pesticides and other chemicals that pollute traditional farms and the surrounding environment.", "zh": "", "w": []}], [{"en": "BMF employees live out sustainability in their everyday lives.", "zh": "", "w": []}, {"en": "About half of them walk or bike to work.", "zh": "", "w": []}, {"en": "Inside the office, they encourage recycling and waste reduction by limiting garbage cans and avoiding single-use plastic.", "zh": "", "w": []}, {"en": "“We are passionate about reducing waste, carbon and chemicals in our environment,” said a BMF employee.", "zh": "", "w": []}]], "nv": 0}, {"id": "p40", "year": 2024, "paper": "全国新课标Ⅱ卷", "part": "D", "words": 315, "file": "f25", "name": "2024 全国新课标Ⅱ卷 阅读D", "done": false, "paras": [[{"en": "Given the astonishing potential of AI to transform our lives we all need to take action to deal with our AI-powered future, and this is where AI by Design: A Plan for Living with Artificial Intelligence comes in.", "zh": "", "w": []}, {"en": "This absorbing new book by Catriona Campbell is a practical roadmap addressing the challenges posed by the forthcoming AI revolution (变革).", "zh": "", "w": []}], [{"en": "In the wrong hands, such a book could prove as complicated to process as the computer code (代码) that powers AI but, thankfully, Campbell has more than two decades’ professional experience translating the heady into the understandable.", "zh": "", "w": []}, {"en": "She writes from the practical angle of a business person rather than as an academic, making for a guide which is highly accessible and informative and which, by the close, will make you feel almost as smart as AI.", "zh": "", "w": []}], [{"en": "As we soon come to learn from AI by Design, AI is already super-smart and will become more capable, moving from the current generation of “narrow-AI” to Artificial General Intelligence.", "zh": "", "w": []}, {"en": "From there, Campbell says, will come Artificial Dominant Intelligence.", "zh": "", "w": []}, {"en": "This is why Campbell has set out to raise awareness of AI and its future now — several decades before these developments are expected to take place.", "zh": "", "w": []}, {"en": "She says it is essential that we keep control of artificial intelligence, or risk being sidelined and perhaps even worse.", "zh": "", "w": []}], [{"en": "Campbell’s point is to wake up those responsible for AI — the technology companies and world leaders-so they are on the same page as all the experts currently developing it.", "zh": "", "w": []}, {"en": "She explains we are at a “tipping point” in history and must act now to prevent an extinction-level event for humanity.", "zh": "", "w": []}, {"en": "We need to consider how we want our future with AI to pan out.", "zh": "", "w": []}, {"en": "Such structured thinking, followed by global regulation, will enable us to achieve greatness rather than our downfall.", "zh": "", "w": []}], [{"en": "AI will affect us all, and if you only read one book on the subject, this is it.", "zh": "", "w": []}]], "nv": 0}, {"id": "p41", "year": 2024, "paper": "全国甲卷", "part": "C", "words": 273, "file": "f22", "name": "2024 全国甲卷 阅读C", "done": false, "paras": [[{"en": "The Saint Lukas train doesn’t accept passengers — it accepts only the sick.", "zh": "", "w": []}, {"en": "The Saint Lukas is one of five government-sponsored medical trains that travel to remote towns in central and eastern Russia.", "zh": "", "w": []}, {"en": "Each stop lasts an average of two days, and during that time the doctors and nurses on board provide rural (乡村) populations with basic medical care, X-ray scans and prescriptions.", "zh": "", "w": []}], [{"en": "“People started queuing to make an appointment early in the morning,” says Emile Ducke, a German photographer who traveled with the staff of the Saint Lukas for a two-week trip in November through the vast regions (区域) of Krasnoyarsk and Khakassia.", "zh": "", "w": []}], [{"en": "Russia’s public health care service has been in serious need of modernization.", "zh": "", "w": []}, {"en": "The government has struggled to come up with measures to address the problem, particularly in the poorer, rural areas east of the Volga River, including arranging doctor’s appointments by video chat and expanding financial aid programs to motivate doctors to practice medicine in remote parts of the country like Krasnoyarsk.", "zh": "", "w": []}], [{"en": "The annual arrival of the Saint Lukas is another attempt to improve the situation.", "zh": "", "w": []}, {"en": "For 10 months every year, the train stops at about eight stations over two weeks, before returning to the regional capital to refuel and restock (补给).", "zh": "", "w": []}, {"en": "Then it starts all over again the next month.", "zh": "", "w": []}, {"en": "Most stations wait about a year between visits.", "zh": "", "w": []}], [{"en": "Doctors see up to 150 patients every day.", "zh": "", "w": []}, {"en": "The train’s equipment allows for basic checkups.", "zh": "", "w": []}, {"en": "“I was very impressed by the doctors and their assistants working and living in such little space but still staying focused and very concerned,” says Ducke.", "zh": "", "w": []}, {"en": "“They were the best chance for many rural people to get the treatment they want. ”", "zh": "", "w": []}]], "nv": 0}, {"id": "p42", "year": 2024, "paper": "全国甲卷", "part": "D", "words": 345, "file": "f22", "name": "2024 全国甲卷 阅读D", "done": false, "paras": [[{"en": "“I didn’t like the ending,” I said to my favorite college professor.", "zh": "", "w": []}, {"en": "It was my junior year of undergraduate, and I was doing an independent study on Victorian literature.", "zh": "", "w": []}, {"en": "I had just finished reading The Mill on the Floss by George Eliot, and I was heartbroken with the ending.", "zh": "", "w": []}, {"en": "Prof. Gracie, with all his patience, asked me to think about it beyond whether I liked it or not.", "zh": "", "w": []}, {"en": "He suggested I think about the difference between endings that I wanted for the characters and endings that were right for the characters, endings that satisfied the story even if they didn’t have a traditionally positive outcome.", "zh": "", "w": []}, {"en": "Of course, I would have preferred a different ending for Tom and Maggie Tulliver, but the ending they got did make the most sense for them.", "zh": "", "w": []}], [{"en": "This was an aha moment for me, and I never thought about endings the same way again.", "zh": "", "w": []}, {"en": "From then on, if I wanted to read an ending guaranteed to be happy, I’d pick up a love romance.", "zh": "", "w": []}, {"en": "If I wanted an ending I couldn’t guess, I’d pick up a mystery (悬疑小说).", "zh": "", "w": []}, {"en": "One where I kind of knew what was going to happen, historical fiction.", "zh": "", "w": []}, {"en": "Choosing what to read became easier.", "zh": "", "w": []}], [{"en": "But writing the end — that’s hard.", "zh": "", "w": []}, {"en": "It’s hard for writers because endings carry so much weight with readers.", "zh": "", "w": []}, {"en": "You have to balance creating an ending that's unpredictable, but doesn’t seem to come from nowhere, one that fits what’s right for the characters.", "zh": "", "w": []}], [{"en": "That’s why this issue (期) of Writer’s Digest aims to help you figure out how to write the best ending for whatever kind of writing you’re doing.", "zh": "", "w": []}, {"en": "If it’s short stories, Peter Mountford breaks down six techniques you can try to see which one helps you stick the landing.", "zh": "", "w": []}, {"en": "Elizabeth Sims analyzes the final chapters of five great novels to see what key points they include and how you can adapt them for your work.", "zh": "", "w": []}], [{"en": "This issue won’t tell you what your ending should be — that’s up to you and the story you’re telling — but it might provide what you need to get there.", "zh": "", "w": []}]], "nv": 0}, {"id": "p43", "year": 2024, "paper": "北京卷", "part": "C", "words": 382, "file": "f23", "name": "2024 北京卷 阅读C", "done": false, "paras": [[{"en": "The notion that we live in someone else’s video game is irresistible to many.", "zh": "", "w": []}, {"en": "Searching the term “simulation hypothesis” (模拟假说) returns numerous results that debate whether the universe is a computer simulation — a concept that some scientists actually take seriously.", "zh": "", "w": []}, {"en": "Unfortunately, this is not a scientific question.", "zh": "", "w": []}, {"en": "We will probably never know whether it’s true.", "zh": "", "w": []}, {"en": "We can, instead, use this idea to advance scientific knowledge.", "zh": "", "w": []}], [{"en": "The 18th-century philosopher Kant argued that the universe ultimately consists of things-in-themselves that are unknowable.", "zh": "", "w": []}, {"en": "While he held the notion that objective reality exists, he said our mind plays a necessary role in structuring and shaping our perceptions.", "zh": "", "w": []}, {"en": "Modern sciences have revealed that our perceptual experience of the world is the result of many stages of processing by sensory systems and cognitive (认知的) functions in the brain.", "zh": "", "w": []}, {"en": "No one knows exactly what happens within this black box.", "zh": "", "w": []}, {"en": "If empirical (实证的) experience fails to reveal reality, reasoning won’t reveal reality either since it relies on concepts and words that are contingent on our social, cultural and psychological histories.", "zh": "", "w": []}, {"en": "Again, a black box.", "zh": "", "w": []}], [{"en": "So, if we accept that the universe is unknowable, we also accept we will never know if we live in a computer simulation.", "zh": "", "w": []}, {"en": "And then, we can shift our inquiry from “Is the universe a computer simulation?” to “Can we model the universe as a computer simulation? ” Modelling reality is what we do.", "zh": "", "w": []}, {"en": "To facilitate our comprehension of the world, we build models based on conceptual metaphors (隐喻) that are familiar to us.", "zh": "", "w": []}, {"en": "In Newton’s era, we imagined the universe as a clock.", "zh": "", "w": []}, {"en": "In Einstein’s, we uncovered the standard model of particle (粒子) physics.", "zh": "", "w": []}], [{"en": "Now that we are in the information age, we have new concepts such as the computer, information processing, virtual reality, and simulation.", "zh": "", "w": []}, {"en": "Unsurprisingly, these new concepts inspire us to build new models of the universe.", "zh": "", "w": []}, {"en": "Models are not the reality, however.", "zh": "", "w": []}, {"en": "There is no point in arguing if the universe is a clock, a set of particles or an output of computation.", "zh": "", "w": []}, {"en": "All these models are tools to deal with the unknown and to make discoveries.", "zh": "", "w": []}, {"en": "And the more tools we have, the more effective and insightful we can become.", "zh": "", "w": []}], [{"en": "It can be imagined that comparable to the process of building previous scientific models, developing the “computer simulation” metaphor-based model will also be a hugely rewarding exercise.", "zh": "", "w": []}]], "nv": 0}, {"id": "p44", "year": 2024, "paper": "北京卷", "part": "D", "words": 370, "file": "f23", "name": "2024 北京卷 阅读D", "done": false, "paras": [[{"en": "Franz Boas’s description of Inuit (因纽特人) life in the 19th century illustrates the probable moral code of early humans.", "zh": "", "w": []}, {"en": "Here, norms (规范) were unwritten and rarely expressed clearly, but were well understood and taken to heart.", "zh": "", "w": []}, {"en": "Dishonest and violent behaviours were disapproved of; leadership, marriage and interactions with other groups were loosely governed by traditions.", "zh": "", "w": []}, {"en": "Conflict was often resolved in musical battles.", "zh": "", "w": []}, {"en": "Because arguing angrily leads to chaos, it was strongly discouraged.", "zh": "", "w": []}, {"en": "With life in the unforgiving Northern Canada being so demanding, the Inuit’s practical approach to morality made good sense.", "zh": "", "w": []}], [{"en": "The similarity of moral virtues across cultures is striking, even though the relative ranking of the virtues may vary with a social group’s history and environment.", "zh": "", "w": []}, {"en": "Typically, cruelty and cheating are discouraged, while cooperation, humbleness and courage are praised.", "zh": "", "w": []}, {"en": "These universal norms far pre-date the concept of any moralising religion or written law.", "zh": "", "w": []}, {"en": "Instead, they are rooted in the similarity of basic human needs and our shared mechanisms for learning and problem solving.", "zh": "", "w": []}, {"en": "Our social instincts (本能) include the intense desire to belong.", "zh": "", "w": []}, {"en": "The approval of others is rewarding, while their disapproval is strongly disliked.", "zh": "", "w": []}, {"en": "These social emotions prepare our brains to shape our behaviour according to the norms and values of our family and our community.", "zh": "", "w": []}, {"en": "More generally, social instincts motivate us to learn how to behave in a socially complex world.", "zh": "", "w": []}], [{"en": "The mechanism involves a repurposed reward system originally used to develop habits important for self-care.", "zh": "", "w": []}, {"en": "Our brains use the system to acquire behavioural patterns regarding safe routes home, efficient food gathering and dangers to avoid.", "zh": "", "w": []}, {"en": "Good habits save time, energy and sometimes your life.", "zh": "", "w": []}, {"en": "Good social habits do something similar in a social context.", "zh": "", "w": []}, {"en": "We learn to tell the truth, even when lying is self-serving; we help a grandparent even when it is inconvenient.", "zh": "", "w": []}, {"en": "We acquire what we call a sense of right and wrong.", "zh": "", "w": []}], [{"en": "Social benefits are accompanied by social demands: we must get along, but not put up with too much.", "zh": "", "w": []}, {"en": "Hence self-discipline is advantageous.", "zh": "", "w": []}, {"en": "In humans, a greatly enlarged brain boosts self-control, just as it boosts problem-solving skills in the social as well as the physical world.", "zh": "", "w": []}, {"en": "These abilities are strengthened by our capacity for language, which allows social practices to develop in extremely unobvious ways.", "zh": "", "w": []}]], "nv": 0}, {"id": "p45", "year": 2024, "paper": "天津卷（第一次·3月）", "part": "C", "words": 418, "file": "f27", "name": "2024 天津卷（第一次·3月） 阅读C", "done": false, "paras": [[{"en": "Our teacher, Miss Chevalier was a small woman, with a moon face, fatty fingers and curls that sprang straight up from her head, hence the funny name “Poodle (卷毛狗)”.", "zh": "", "w": []}, {"en": "She taught in our reading club.", "zh": "", "w": []}, {"en": "Sometimes she would look in and ask what we were reading — not to check but to know.", "zh": "", "w": []}], [{"en": "That’s what happened the day my club was reading aloud a poem by Henry Longfellow.", "zh": "", "w": []}, {"en": "I guess I was better than the others, for Miss Chevalier asked a while later, “Addie, I was wondering if you would recite the whole poem to the Saturday evening’s club.”", "zh": "", "w": []}, {"en": "She said a famous professor was going to give a lecture about the poet, and a presentation of that poem would be a fresh way to start.", "zh": "", "w": []}], [{"en": "She asked me to memorize it.", "zh": "", "w": []}, {"en": "“But that shouldn’t be a problem for a child of your ability,” she added.", "zh": "", "w": []}, {"en": "I’m telling you, my happy feet barely touched the ground all the way home.", "zh": "", "w": []}, {"en": "To me, that was the biggest thing ever and I soon learned the whole poem by heart, well prepared for our first rehearsal.", "zh": "", "w": []}], [{"en": "I was desperately nervous when I went to her office the next day.", "zh": "", "w": []}, {"en": "But the good thing was she always had the smile that would make you feel like you just did something right.", "zh": "", "w": []}], [{"en": "Halfway through the poem, Miss Chevalier stopped me and asked if I knew what “impetuous” meant.", "zh": "", "w": []}, {"en": "Despite her encouraging smile, I wanted to sink through the floor because I was unsure about its pronunciation as well as its meaning.", "zh": "", "w": []}, {"en": "Miss Chevalier pretended not to have noticed my red face and handed me a dictionary, asking me to read its definition aloud.", "zh": "", "w": []}, {"en": "“Impetuous has two definitions: rushing with great force or violence; acting suddenly, with little thought. ”", "zh": "", "w": []}], [{"en": "She asked me which one fitted the poem.", "zh": "", "w": []}, {"en": "I read both definitions over again, trying to figure it out, but Miss Chevalier must have read my mind.", "zh": "", "w": []}, {"en": "“There is no wrong answer,” she said, “I want to know your opinion, Addie.”", "zh": "", "w": []}, {"en": "Hesitantly, I said, “Maybe… both.”", "zh": "", "w": []}], [{"en": "She liked that.", "zh": "", "w": []}, {"en": "“One has to be impetuous both ways or they wouldn’t dare to face up to any challenge.", "zh": "", "w": []}, {"en": "Would you call yourself impetuous?”", "zh": "", "w": []}], [{"en": "I knew she was asking for an opinion.", "zh": "", "w": []}, {"en": "“My mother thinks being impetuous for girls is improper, anyway.”", "zh": "", "w": []}], [{"en": "She said my mom was somewhat right about that.", "zh": "", "w": []}, {"en": "“But girls should also be wise to take up challenges when needed.", "zh": "", "w": []}, {"en": "I believe you are such a girl.”", "zh": "", "w": []}], [{"en": "After that, I would never call Miss Chevalier “Poodle” again.", "zh": "", "w": []}]], "nv": 0}, {"id": "p46", "year": 2024, "paper": "天津卷（第一次·3月）", "part": "D", "words": 347, "file": "f27", "name": "2024 天津卷（第一次·3月） 阅读D", "done": false, "paras": [[{"en": "Research sometimes proves, with data, what we more or less already know(e.g. exercise is good for you, and polluted air isn’t).", "zh": "", "w": []}, {"en": "Still, sometimes our assumptions are incorrect, and scientific findings surprise researchers, along with the rest of us.", "zh": "", "w": []}, {"en": "A recent example is the phenomenon of disappearing lakes in parts of the frozen treeless Arctic (北极的) region.", "zh": "", "w": []}], [{"en": "You might think these lakes would be expanding, not disappearing.", "zh": "", "w": []}, {"en": "As climate change warms the region — melting (融化) surface snow and ice as well as the permafrost (永冻层)— there should be more surface water, forming larger lakes and even new ones.", "zh": "", "w": []}, {"en": "Recently, however, scientists have observed not just shrinking (缩小的) lakes but lakes that have completely gone away.", "zh": "", "w": []}], [{"en": "Many scientists shared the commonsense expectation that as permafrost melted, lakes would at first expand with meltwater flowing into them.", "zh": "", "w": []}, {"en": "Eventually, researchers made a prediction that progressive warming during the 21st and 22nd centuries would dry out the Arctic, and lakes would begin to shrink.", "zh": "", "w": []}, {"en": "But now it looks as if Arctic lakes are disappearing a century sooner than predicted.", "zh": "", "w": []}, {"en": "A case in point is that some large, age-old lakes shrank dramatically in what appears to have been a matter of months.", "zh": "", "w": []}, {"en": "Scientists have labeled this phenomenon “disastrous lake loss”.", "zh": "", "w": []}], [{"en": "What caused this?", "zh": "", "w": []}, {"en": "The frozen solid ground actually contains bits of rock, mineral and organic matter, leaving spaces in between.", "zh": "", "w": []}, {"en": "And because these spaces are filled with solid ice, liquid water cannot readily get inside, but it can when the permafrost melts, allowing more water to get through.", "zh": "", "w": []}, {"en": "Soon after that, around 192 lakes in northwestern Alaska are gone from sight.", "zh": "", "w": []}], [{"en": "Why did scientists miss this?", "zh": "", "w": []}, {"en": "One probable reason is that most climate models assume that the melting of permafrost is driven only by warming air.", "zh": "", "w": []}], [{"en": "New evidence suggests, however, that rainfall — particularly increasing autumn rain — is now contributing significantly to permafrost loss.", "zh": "", "w": []}, {"en": "The rainfall carries heat into the ground.", "zh": "", "w": []}, {"en": "Yet none of the existing models includes such processes.", "zh": "", "w": []}], [{"en": "That is a good example of why — no matter how complex our models are or may one day be — we need direct observation of the natural world.", "zh": "", "w": []}]], "nv": 0}, {"id": "p47", "year": 2024, "paper": "浙江卷（1月）", "part": "C", "words": 303, "file": "f26", "name": "2024 浙江卷（1月） 阅读C", "done": false, "paras": [[{"en": "On September 7, 1991, the costliest hailstorm (雹暴) in Canadian history hit Calgary’s southern suburbs.", "zh": "", "w": []}, {"en": "As a result, since 1996 a group of insurance companies have spent about $2 million per year on the Alberta Hail Suppression Project.", "zh": "", "w": []}, {"en": "Airplanes seed threatening storm cells with a chemical to make small ice crystals fall as rain before they can grow into dangerous hailstones.", "zh": "", "w": []}, {"en": "But farmers in east-central Alberta — downwind of the hail project flights — worry that precious moisture (水分) is being stolen from their thirsty land by the cloud seeding.", "zh": "", "w": []}], [{"en": "Norman Stienwand, who farms in that area, has been addressing public meetings on this issue for years.", "zh": "", "w": []}, {"en": "“Basically, the provincial government is letting the insurance companies protect the Calgary-Edmonton urban area from hail,” Mr. Stienwand says, “but they’re increasing drought risk as far east as Saskatchewan.”", "zh": "", "w": []}], [{"en": "The Alberta hail project is managed by Terry Krauss, a cloud physicist who works for Weather Modification Inc. of Fargo, North Dakota.", "zh": "", "w": []}, {"en": "“We affect only a very small percentage of the total moisture in the air, so we cannot be causing drought.”", "zh": "", "w": []}, {"en": "Dr. Krauss says.", "zh": "", "w": []}, {"en": "“In fact, we may be helping increase the moisture downwind by creating wetter ground.”", "zh": "", "w": []}], [{"en": "One doubter about the safety of cloud seeding is Chuck Doswell, a research scientist who just retired from the University of Oklahoma.", "zh": "", "w": []}, {"en": "“In 1999, I personally saw significant tornadoes (龙卷风) form from a seeded storm cell in Kansas,” Dr. Doswell says.", "zh": "", "w": []}, {"en": "“Does cloud seeding create killer storms or reduce moisture downwind?", "zh": "", "w": []}, {"en": "No one really knows, of course, but the seeding goes on.”", "zh": "", "w": []}], [{"en": "Given the degree of doubt, Mr. Stienwand suggests, “it would be wise to stop cloud seeding.”", "zh": "", "w": []}, {"en": "In practice, doubt has had the opposite effect.", "zh": "", "w": []}, {"en": "Due to the lack of scientific proof concerning their impacts, no one has succeeded in winning a lawsuit against cloud-seeding companies.", "zh": "", "w": []}, {"en": "Hence, private climate engineering can proceed in relative legal safety.", "zh": "", "w": []}]], "nv": 0}, {"id": "p48", "year": 2024, "paper": "浙江卷（1月）", "part": "D", "words": 324, "file": "f26", "name": "2024 浙江卷（1月） 阅读D", "done": false, "paras": [[{"en": "The Stanford marshmallow (棉花糖) test was originally conducted by psychologist Walter Mischel in the late 1960s.", "zh": "", "w": []}, {"en": "Children aged four to six at a nursery school were placed in a room.", "zh": "", "w": []}, {"en": "A single sugary treat, selected by the child, was placed on a table.", nclude all types of plastics.", "zh": "", "w": []}, {"en": "The team focused only on three common types — polystyrene, polyethylene and polypropylene — and they didn’t study other chemicals previously found in water such as vinyl chloride.", "zh": "", "w": []}], [{"en": "Still, the findings show a potential path forward for reducing microplastic exposure — a task that’s becoming increasingly difficult.", "zh": "", "w": []}, {"en": "Even bottled water, scientists found earlier this year, contains 10 to 1,000 times more microplastics than originally thought.", "zh": "", "w": []}], [{"en": "Scientists are still trying to determine how harmful microplastics are — but what they do know has raised concerns.", "zh": "", "w": []}, {"en": "The new study suggests boiling tap water could be a tool to limit intake.", "zh": "", "w": []}, {"en": "“The way they demonstrated how microplastics were trapped through the boiling process was nice,” Caroline Gauchotte-Lindsay, an environmental engineer of the University of Glasgow in Scotland who was not involved in the research, tells New Scientist.", "zh": "", "w": []}, {"en": "“We should be looking into upgrading drinking water treatment plants so they remove microplastics.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p51", "year": 2025, "paper": "全国二卷", "part": "C", "words": 257, "file": "f30", "name": "2025 全国二卷 阅读C", "done": false, "paras": [[{"en": "When Sonja Detrinidad opened her online shop selling houseplants, she didn’t have high hopes for it.", "zh": "", "w": []}, {"en": "But the opposite happened: She was flooded, shipping out 1,200 orders in June of 2020 alone.", "zh": "", "w": []}, {"en": "In the past year, Detrinidad sent out more than 70,000 plants.", "zh": "", "w": []}, {"en": "Her success is just one example of increased time at home leading to an explosion in the houseplant industry.", "zh": "", "w": []}], [{"en": "“Plants are in fashion right now,” says Dr. Melinda Knuth, a researcher from the University of Florida.", n amazing meal out of almost anything.", "zh": "", "w": []}]], "nv": 0}, {"id": "p53", "year": 2025, "paper": "北京卷", "part": "C", "words": 387, "file": "f32", "name": "2025 北京卷 阅读C", "done": false, "paras": [[{"en": "Not too long ago, on a cold winter night, there was a teenager who wanted more screen time and a parent who said no.", "zh": "", "w": []}, {"en": "The teenager was advocating for her right to scroll (翻屏) for an extra 30 minutes.", "zh": "", "w": []}, {"en": "The parent argued that none of her friends’ parents let them have screens after 9 o’clock.", "zh": "", "w": []}, {"en": "“I thought, in this family, we don’t compare ourselves with other people, Dad?” the teenager replied.", "zh": "", "w": []}, {"en": "The parent — who was me, by the way — just got served.", "zh": "", "w": []}, {"en": "Since they were young, I have told my kids not to compare themselves with other people.", "zh": "", "w": []}, {"en": "I have argued countless times that comparisons are the “thief of joy”.", "zh": "", "w": []}], [{"en": "Although my daughter didn’t win, she did help expose one of the worst pieces of advice I have ever given.", "zh": "", "w": []}, {"en": "In my defence, I did what we’ve all done before, which is repeat received wisdom without exploring the nuances.", "zh": "", "w": []}, {"en": "But now is the time to set the record straight, which starts with questioning the idea that all social comparison is unhealthy.", "zh": "", "w": []}], [{"en": "Social comparisons do, of course, often get us into emotional trouble.", "zh": "", "w": []}, {"en": "But they can be harnessed (利用) for our betterment if we understand how they work.", "zh": "", "w": []}, {"en": "The social comparisons we make — ones that lead us to feel good or bad about ourselves — are vital to our ability to thrive (成长).", "zh": "", "w": []}, {"en": "Science provides a guide we can use to harness the way we perform these comparisons to reduce their negative emotional impacts.", "zh": "", "w": []}], [{"
