life changes, and begin to see ourselves as both the central character and, to a varying extent, the story’s author.", "zh": "", "w": []}, {"en": "People with more consistent stories tend to have a stronger sense of identity, and they feel their life has more meaning, direction and sense of purpose.", "zh": "", "w": []}, {"en": "Such people show greater overall life satisfaction, too.", "zh": "", "w": []}], [{"en": "Johnson has also investigated the link between well-being and certain story themes.", "zh": "", "w": []}, {"en": "He discovered that whether someone describes having had some control over events in their past is an important predictor of a person’s mental health.", "zh": "", "w": []}, {"en": "Another key theme involves finding some kind of positive meaning after stressful events.", "zh": "", "w": []}, {"en": "“People could talk about gaining knowledge or personal growth,” says Johnson.", "zh": "", "w": []}, {"en": "His research shows that this is often missing for people with mental health conditions.", "zh": "", "w": []}, {"en": "The good news is that there is evidence we can learn to change our own story.", "zh": "", "w": []}], [{"en": "Lisa Green, another researcher, sounds a few notes of caution (谨慎).", "zh": "", "w": []}, {"en": "For instance, hearing about the power of redemptive (拯救性的) stories, many people may feel forced to find a positive angle on horrible events.", "zh": "", "w": []}, {"en": "She says that Western culture already pushes people to look for the silver lining behind every cloud.", "zh": "", "w": []}], [{"en": "If you want to turn over a new leaf, though, one top tip is that it helps to choose a significant date that signals the start of a new “chapter”.", "zh": "", "w": []}, {"en": "Contrary to popular doubt, resolutions made on 1 January are more effective for this reason.", "zh": "", "w": []}, {"en": "So, whether your goal is saving money or getting fit, there is no better time to become the author of our own destiny (命运).", "zh": "", "w": []}]], "nv": 0}, {"id": "p55", "year": 2025, "paper": "天津卷（第二次·6月）", "part": "C", "words": 400, "file": "f31", "name": "2025 天津卷（第二次·6月） 阅读C", "done": false, "paras": [[{"en": "All animals take in oxygen from the air they breathe in, and release CO₂ from their blood when breathing out.", "zh": "", "w": []}, {"en": "Most mammals (哺乳动物) can’t directly detect oxygen levels in the blood supplied to their tissues.", "zh": "", "w": []}, {"en": "Instead, they rely on the rising level of CO₂ in their blood to signal that they might need to take a breath.", "zh": "", "w": []}, {"en": "But a recent study published in Science suggests seals (海豹) can sense the amount of oxygen in the blood, and change their diving behavior in response.", "zh": "", "w": []}], [{"en": "To find out if oxygen levels affected seal behavior Professor McKnight at the University of St. Andrews and his colleagues created a special section in a pool where young seals were held.", "zh": "", "w": []}, {"en": "In one corner, there was a breathing chamber (呼吸室), where they were sheltered from the rain and the wind.", "zh": "", "w": []}], [{"en": "The breathing chamber was surrounded by panels that prevented surface swimming, yet swimming below the surface for about 200 feet would give the seals access to a feeder where they could eat as much fish as they liked.", "zh": "", "w": []}, {"en": "Once the seals got familiar with the setup, the researchers started to gradually change the composition of the air in the breathing chamber, increasing or reducing the levels of oxygen and CO₂ to see an effect on their behavior.", "zh": "", "w": []}, {"en": "Sure enough: the higher the level of oxygen, the longer the seals stayed at the feeder.", "zh": "", "w": []}], [{"en": "The finding suggests that seals don’t just physically respond to oxygen levels by changing their heart rate or breathing, but that they are sufficiently aware of them to change their behavior.", "zh": "", "w": []}, {"en": "This ability would put seals in a class beyond any land mammals that have been tested.", "zh": "", "w": []}, {"en": "Since oxygen levels on land remain stable, humans don’t seem to have evolved (演化) to notice low blood oxygen levels, sometimes not even when they’re about to pass out in free-diving.", "zh": "", "w": []}], [{"en": "Therefore, in free-diving without oxygen tanks, accidents are quite common.", "zh": "", "w": []}, {"en": "Our reliance on sensing CO₂ levels in our blood instead of oxygen may be to blame.", "zh": "", "w": []}, {"en": "Actually, this is a perfectly reasonable strategy on land, where growing CO₂ tends to signal breathing issues.", "zh": "", "w": []}, {"en": "But when holding our breath during diving, relying on CO₂ levels is risky, especially on repeated dives.", "zh": "", "w": []}, {"en": "Because every time we surface and breathe in, our sensitivity to CO₂ is decreased, even if its levels are already high, and this increases the chance that a person will, without awareness, pass out before they get to the surface.", "zh": "", "w": []}]], "nv": 0}, {"id": "p56", "year": 2025, "paper": "天津卷（第二次·6月）", "part": "D", "words": 367, "file": "f31", "name": "2025 天津卷（第二次·6月） 阅读D", "done": false, "paras": [[{"en": "Science serves as a powerful tool for unlocking the mysteries of the universe but understanding its limitations is essential for its effective application.", "zh": "", "w": []}, {"en": "There are occasions where I have used the handle of a knife as a hammer (锤子), but the result would have been better if I’d had a more suitable tool at hand.", "zh": "", "w": []}, {"en": "As far as science goes, it is really good at testing things that are testable, but not so for those that are not.", "zh": "", "w": []}], [{"en": "We can do, and have done, an impressive amount with our brains.", "zh": "", "w": []}, {"en": "But there are limits.", "zh": "", "w": []}, {"en": "Sometimes these limits go away if we keep at it for long enough — we just need better facilities and experiments to get the answer.", "zh": "", "w": []}, {"en": "Breaking new ground in modern science this way can be costly.", "zh": "", "w": []}, {"en": "Next-generation supercomputers or incredibly large telescopes are expensive, yet these may be required to find answers to some of the unsolved mysteries of the universe.", "zh": "", "w": []}], [{"en": "Sometimes the limits we encounter in trying to unlock the nature of the universe are cognitive (认知的).", "zh": "", "w": []}, {"en": "Think about this: human DNA is only about 1.2 percent different from that of chimps (黑猩猩).", "zh": "", "w": []}, {"en": "Chimps are smart, no question.", "zh": "", "w": []}, {"en": "But could you teach them advanced mathematics?", "zh": "", "w": []}, {"en": "What if our DNA were another 1.2 percent further evolved than it is?", "zh": "", "w": []}, {"en": "What might our brains be capable of then?", "zh": "", "w": []}, {"en": "The level of abstract thinking might be unimaginable.", "zh": "", "w": []}], [{"en": "Sometimes the limits we hit are fundamental.", "zh": "", "w": []}, {"en": "There are laws of nature we may never be able to understand, however advanced our brains might become.", "zh": "", "w": []}, {"en": "There are experiments we might never be able to perform.", "zh": "", "w": []}, {"en": "We may never be able to test what caused the universe to be created, and what caused the cause of the universe being created.", "zh": "", "w": []}, {"en": "This is where science may never break through.", "zh": "", "w": []}], [{"en": "For something to be considered scientific, it must, by definition, be testable.", "zh": "", "w": []}, {"en": "There is a problem here: it may not need to be testable right now, but it must be testable at some point in the future by experiment.", "zh": "", "w": []}, {"en": "If an idea is untestable, that doesn’t mean it is wrong.", "zh": "", "w": []}, {"en": "It means it is untestable for now.", "zh": "", "w": []}, {"en": "These untestable ideas also happen to be some of the most interesting ones, probably because they’ve puzzled humanity for centuries.", "zh": "", "w": []}]], "nv": 0}, {"id": "p57", "year": 2025, "paper": "上海卷（秋考）", "part": "C", "words": 358, "file": "f28", "name": "2025 上海卷（秋考） 阅读C", "done": false, "paras": [[{"en": "The pet food industry has received unkind remarks as to the true origin of its ingredients (原料) for decades.", "zh": "", "w": []}, {"en": "Now the industry faces another source of criticism as a new book starts a debate about the environmental impact of owning a well-fed pet.", "zh": "", "w": []}], [{"en": "The New Scientist magazine, in a recent editorial, largely agreed with the book’s findings that some pets, due to the food they eat, have a surprisingly high “ecological footprint”, which is a way of quantifying human demand on the planet’s ecosystems using a measure called “global hectares”.", "zh": "", "w": []}], [{"en": "According to the authors of the book, “A shocking comparison is that in 2004, the average citizen of some poor countries had an eco-footprint of 0.76 hectares.", "zh": "", "w": []}, {"en": "The eco-footprint of a cat is about 0.15 hectares, almost the same as what is needed to run a small car.", "zh": "", "w": []}, {"en": "In a world where resources are already limited, can people really justify keeping pets that require more than some people?”", "zh": "", "w": []}], [{"en": "The authors of the book say that they were “genuinely surprised” when calculating the environmental impact of pets.", "zh": "", "w": []}, {"en": "And some of the ideas they put forward to attenuate this are likely to shock some pet owners.", "zh": "", "w": []}, {"en": "For example, the book suggests catching pests such as field mice and processing them into a “natural” cat food, or raising pets like chickens that provide both company and fresh eggs.", "zh": "", "w": []}, {"en": "When feeding a pet, however, the advice is to favour pet foods made from chicken meat, which is less damaging to the environment than red meat and fish.", "zh": "", "w": []}], [{"en": "As you might expect, the Pet Food Manufacturers Association (PFMA) puts up a spirited defence, arguing that the vast majority of meat and fish used in pet foods is of sufficient quality for human consumption but more than humans need.", "zh": "", "w": []}, {"en": "“If we didn’t recycle animal by-products to sell, they might instead be abandoned and buried under the earth, which is not very green,” says the director.", "zh": "", "w": []}, {"en": "In addition, he points out that pets should not be viewed just on their carbon footprint.", "zh": "", "w": []}, {"en": "“Our environment is greatly enriched by the part they play in our lives.", "zh": "", "w": []}, {"en": "Pets in the home inspire responsibility, encourage social awareness and have positive health benefits.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p58", "year": 2026, "paper": "全国Ⅰ卷", "part": "C", "words": 307, "file": "f37", "name": "2026 全国Ⅰ卷 阅读C", "done": true, "title": "纽约大规模种树的“隐患”", "genre": "说明文 · 环境科学", "summary": "纽约每年种下数万棵树，但新研究发现，占多数的橡树和枫香树会释放异戊二烯，它与汽车、工业排放的氮氧化物反应生成近地面臭氧，可能使空气质量变差。公园部门认为不应把树当成敌人，更该反思以汽车为中心的生活方式。", "paras": [[{"en": "In line with longstanding initiatives to expand its green spaces, New York City is planting tens of thousands of trees each year.", "zh": "为了配合扩大绿地的长期计划，纽约市每年都种植数以万计的树木。", "w": [{"t": "phr", "h": "in line with", "m": "与……一致；按照", "sp": [[0, 12]]}, {"t": "ext", "h": "longstanding", "m": "adj. 长期存在的", "sp": [[13, 25]]}, {"t": "core", "h": "initiative", "m": "n. 倡议；（新）计划", "sp": [[26, 37]]}, {"t": "core", "h": "expand", "m": "v. 扩大", "sp": [[41, 47]]}, {"t": "phr", "h": "tens of thousands of", "m": "数以万计的", "sp": [[92, 112]]}, {"t": "core", "h": "plant", "m": "v. 种植", "sp": [[83, 91]]}]}, {"en": "They provide shade, lower surface temperatures, absorb a surprising amount of airborne carbon, remove tiny pollutants, and provide wildlife habitat along with just plain beauty.", "zh": "它们提供树荫，降低地表温度，吸收数量惊人的空气中的碳，清 ng new ones, said Auyeung.", "zh": "“我们不会去砍掉任何高大的老橡树，”欧阳说，管理局也不会完全停止种植新的橡树。", "w": [{"t": "phr", "h": "cut down", "m": "砍倒", "sp": [[23, 35]]}, {"t": "core", "h": "completely", "m": "adv. 完全地", "sp": [[87, 97]]}]}, {"en": "“You have to think about what you would lose if you do that.”", "zh": "“你得想想，如果那样做，你会失去什么。”", "w": []}, {"en": "Oaks are keystone species, she pointed out, providing food and habitat for native insects, birds and other animals.", "zh": "她指出，橡树是关键物种，为本地的昆虫、鸟类和其他动物提供食物和栖息地。", "w": [{"t": "ext", "h": "keystone species", "m": "关键物种", "sp": [[9, 25]]}, {"t": "phr", "h": "point out", "m": "指出", "sp": [[31, 42]]}, {"t": "core", "h": "native", "m": "adj. 本地的；土生的", "sp": [[75, 81]]}, {"t": "core", "h": "insect", "m": "n. 昆虫", "sp": [[82, 89]]}]}]], "nv": 70, "audio": {"female": {"file": "audio/female/p58_2026_全国Ⅰ卷_阅读C.mp3", "dur": 126.934, "s": [[1, 1.5, 9.19], [2, 9.878, 20.838], [3, 21.838, 25.038], [4, 25.678, 33.618], [5, 34.306, 47.116], [6, 48.116, 67.486], [7, 68.486, 70.206], [8, 70.83, 74.64], [9, 75.284, 78.414], [10, 79.414, 82.154], [11, 82.79, 89.51], [12, 90.186, 95.526], [13, 96.19, 98.83], [14, 99.47, 105.0], [15, 106.0, 113.33], [16, 114.022, 116.652], [17, 117.304, 124.934]]}, "male": {"file": "audio/male/p58_2026_全国Ⅰ卷_阅读C.mp3", "dur": 128.844, "s": [[1, 1.5, 9.5], [2, 10.188, 21.148], [3, 22.148, 25.088], [4, 25.728, 33.818], [5, 34.506, 47.266], [6, 48.266, 68.486], [7, 69.486, 71.246], [8, 71.87, 75.7], [9, 76.344, 79.504], [10, 80.504, 83.354], [11, 83.99, 90.94], [12, 91.616, 96.926], [13, 97.59, 100.23], [14, 100.87, 106.64], [15, 107.64, 115.13], [16, 115.822, 118.702], [17, 119.354, 126.844]]}}}, {"id": "p59", "year": 2026, "paper": "全国Ⅰ卷", "part": "D", "words": 323, "file": "f37", "name": "2026 全国Ⅰ卷 阅读D", "done": true, "title": "欣赏艺术之美能激发抽象思维", "genre": "说明文 · 心理学研究", "summary": "剑桥心理学家在美术馆做实验：主动评判作品美感的一组，抽象思维得分比对照组平均高约14%，有艺术爱好的人高出25%以上，而且更多产生被感动、受启发的“自我超越”感受；但他们并没有更快乐，说明起作用的是对美的投入。研究者认为欣赏美可能是开启抽象思维的理想方式。", "paras": [[{"en": "A team of Cambridge psychologists conducted an experiment to compare the cognitive (认知的) effects of merely seeing art with actively judging how beautiful it is.", "zh": "剑桥大学的一个心理学家团队开展了一项实验，比较仅仅观看艺术与主动评判艺术之美对认知产生的不同影响。", "w": [{"t": "core", "h": "psychologist", "m": "n. 心理学家", "sp": [[20, 33]]}, {"t": "core", "h": "conduct", "m": "v. 实施；开展", "sp": [[34, 43]]}, {"t": "core", "h": "experiment", "m": "n. 实验", "sp": [[47, 57]]}, {"t": "phr", "h": "compare…with", "m": "把……与……比较", "sp": [[61, 68], [118, 122]]}, {"t": "core", "h": "cognitive", "m": "adj. 认知的", "sp": [[73, 82]]}, {"t": "core", "h": "effect", "m": "n. 影响；效果", "sp": [[89, 96]]}, {"t": "core", "h": "merely", "m": "adv. 仅仅", "sp": [[100, 106]]}, {"t": "core", "h": "actively", "m": "adv. 主动地", "sp": [[123, 131]]}, {"t": "core", "h": "judge", "m": "v. 判断；评判", "sp": [[132, 139]]}]}], [{"en": "In the study, 187 people were invited to visit Kettle’s Yard gallery during an exhibition of handmade clay objects.", "zh": "在研究中，187人受邀在一场手工陶土作品展期间参观了凯特尔庭院美术馆。", "w": [{"t": "core", "h": "invite", "m": "v. 邀请", "sp": [[30, 37]]}, {"t": "core", "h": "gallery", "m": "n. 美术馆；画廊", "sp": [[61, 68]]}, {"t": "core", "h": "exhibition", "m": "n. 展览", "sp": [[79, 89]]}, {"t": "core", "h": "handmade", "m": "adj. 手工制作的", "sp": [[93, 101]]}, {"t": "ext", "h": "clay", "m": "n. 黏土；陶土", "sp": [[102, 106]]}, {"t": "core", "h": "object", "m": "n. 物体；物品", "sp": [[107, 114]]}]}, {"en": "Participants were randomly divided into two groups: the “beauty” group was asked to actively consider and then rate the beauty of each object they viewed, while the control group just matched a line drawing of the object with the artwork itself.", "zh": "参与者被随机分成两组：“美感组”被要求主动思考，并给所看到的每件作品的美打分；而对照组只需把作品的线描图和作品本身配对。", "w": [{"t": "core", "h": "participant", "m": "n. 参与者", "sp": [[0, 12]]}, {"t": "core", "h": "randomly", "m": "adv. 随机地", "sp": [[18, 26]]}, {"t": "phr", "h": "divide…into", "m": "把……分成", "sp": [[27, 34], [35, 39]]}, {"t": "core", "h": "rate", "m": "v. 评分；评价", "sp": [[111, 115]]}, {"t": "core", "h": "view", "m": "v. 观看", "sp": [[147, 153]]}, {"t": "phr", "h": "control group", "m": "对照组", "sp": [[165, 178]]}, {"t": "phr", "h": "match…with", "m": "把……与……匹配", "sp": [[184, 191], [221, 225]]}, {"t": "core", "h": "artwork", "m": "n. 艺术品", "sp": [[230, 237]]}]}, {"en": "All participants were then tested on how they process information, and whether it’s in a more practical or abstract way.", "zh": "随后，所有参与者都接受了测试，看他们如何处理信息，是更偏向实际的方式，还是更抽象的方式。", "w": [{"t": "core", "h": "process", "m": "v. 处理", "sp": [[46, 53]]}, {"t": "core", "h": "practical", "m": "adj. 实际的；务实的", "sp": [[94, 103]]}, {"t": "core", "h": "abstract", "m": "adj. 抽象的", "sp": [[107, 115]]}]}], [{"en": "Across all participants, those in the beauty group scored almost 14% higher on average than the control group in abstract thinking.", "zh": "从全体参与者来看，美感组在抽象思维上的得分平均比对照组高出近14%。", "w": [{"t": "core", "h": "score", "m": "v. 得分", "sp": [[51, 57]]}, {"t": "phr", "h": "on average", "m": "平均", "sp": [[76, 86]]}]}, {"en": "While they were told the study was about cognitive processes, participants were asked about interests, with around half saying they had an artistic hobby.", "zh": "虽然参与者被告知这项研究是关于认知过程的，但他们也被问及兴趣爱好，约一半人说自己有艺术方面的爱好。", "w": [{"t": "core", "h": "artistic", "m": "adj. 艺术的", "sp": [[139, 147]]}, {"t": "core", "h": "hobby", "m": "n. 爱好", "sp": [[148, 153]]}]}, {"en": "Among those, the effect was greater: those with an artistic hobby in the beauty group scored over 25% higher on average for abstract thinking than those with an artistic hobby in the control group.", "zh": "在这些人当中，效果更明显：美感组中有艺术爱好的人，抽象思维平均得分比对照组中有艺术爱好的人高出25%以上。", "w": []}], [{"en": "Emotional states of participants were also measured by asking about their feelings while completing the gallery task.", "zh": "研究人员还通过询问参与者完成美术馆任务时的感受，测量了他们的情绪状态。", "w": [{"t": "core", "h": "emotional", "m": "adj. 情绪的；情感的", "sp": [[0, 9]]}, {"t": "core", "h": "state", "m": "n. 状态", "sp": [[10, 16]]}, {"t": "core", "h": "measure", "m": "v. 测量", "sp": [[43, 51]]}, {"t": "core", "h": "complete", "m": "v. 完成", "sp": [[89, 99]]}, {"t": "core", "h": "task", "m": "n. 任务", "sp": [[112, 116]]}]}, {"en": "Across all participants, those in the beauty group reported an average of 23% higher levels of “transformative and self-transcendent feelings” — such as feeling moved, enlightened and inspired — than the control group.", "zh": "从全体参与者来看，美感组报告的“转变性和自我超越的感受”——比如被感动、受启迪、受鼓舞——平均比对照组高出23%。", "w": [{"t": "core", "h": "report", "m": "v. 报告；说出", "sp": [[51, 59]]}, {"t": "core", "h": "average", "m": "n. 平均数", "sp": [[63, 70]]}, {"t": "ext", "h": "transformative", "m": "adj. 使发生转变的", "sp": [[96, 110]]}, {"t": "ext", "h": "self-transcendent", "m": "adj. 超越自我的", "sp": [[115, 132]]}, {"t": "core", "h": "move", "m": "v. 感动", "sp": [[161, 166]]}, {"t": "ext", "h": "enlighten", "m": "v. 启发；使领悟", "sp": [[168, 179]]}, {"t": "core", "h": "inspire", "m": "v. 鼓舞；激励", "sp": [[184, 192]]}]}, {"en": "Importantly, however, the beauty group did not report feeling any happier than the control group, suggesting that it was the engagement with beauty that influenced abstract thinking, rather than any overall positivity from the experience.", "zh": "但重要的是，美感组并没有表示自己比对照组更快乐，这说明影响抽象思维的是对美的投入，而不是这次体验带来的整体积极情绪。", "w": [{"t": "core", "h": "importantly", "m": "adv. 重要的是", "sp": [[0, 11]]}, {"t": "core", "h": "suggest", "m": "v. 表明；暗示", "sp": [[98, 108]]}, {"t": "core", "h": "engagement", "m": "n. 投入；参与", "sp": [[125, 135]]}, {"t": "core", "h": "influence", "m": "v. 影响", "sp": [[153, 163]]}, {"t": "phr", "h": "rather than", "m": "而不是", "sp": [[183, 194]]}, {"t": "core", "h": "overall", "m": "adj. 总体的；全面的", "sp": [[199, 206]]}, {"t": "ext", "h": "positivity", "m": "n. 积极情绪", "sp": [[207, 217]]}, {"t": "core", "h": "experience", "m": "n. 体验；经历", "sp": [[227, 237]]}]}], [{"en": "“We usually think in very concrete terms when doing something on a screen,” said Simone Schnall, senior author of the study.", "zh": "“我们在屏幕上做事时，通常是用非常具体的方式思考，”该研究的资深作者西蒙娜·施纳尔说。", "w": [{"t": "core", "h": "concrete", "m": "adj. 具体的", "sp": [[26, 34]]}, {"t": "phr", "h": "in…terms", "m": "从……角度；以……方式", "sp": [[18, 20], [35, 40]]}, {"t": "core", "h": "screen", "m": "n. 屏幕", "sp": [[67, 73]]}, {"t": "core", "h": "author", "m": "n. 作者", "sp": [[104, 110]]}]}, {"en": "“It’s becoming much rarer to zone out and just let the mind wander, but that’s when we think in ways that broaden our minds.", "zh": "“放空自己、任思绪漫游的时候越来越少了，但恰恰是在那种时候，我们的思考方式能开阔思维。", "w": [{"t": "core", "h": "rare", "m": "adj. 罕见的；少有的", "sp": [[20, 25]]}, {"t": "phr", "h": "zone out", "m": "走神；放空", "sp": [[29, 37]]}, {"t": "core", "h": "wander", "m": "v. 漫游；（思绪）游离", "sp": [[60, 66]]}, {"t": "core", "h": "broaden", "m": "v. 拓宽；开阔", "sp": [[106, 113]]}]}, {"en": "Admiring the beauty of art may be the ideal way to initiate the abstract cognitive processes.”", "zh": "欣赏艺术之美，可能是开启抽象认知过程的理想方式。”", "w": [{"t": "core", "h": "admire", "m": "v. 欣赏；钦佩", "sp": [[0, 8]]}, {"t": "core", "h": "ideal", "m": "adj. 理想的", "sp": [[38, 43]]}, {"t": "core", "h": "initiate", "m": "v. 开始；启动", "sp": [[51, 59]]}]}]], "nv": 61, "audio": {"female": {"file": "audio/female/p59_2026_全国Ⅰ卷_阅读D.mp3", "dur": 134.139, "s": [[1, 1.5, 10.76], [2, 11.76, 19.98], [3, 20.656, 34.298], [4, 35.048, 42.048], [5, 43.048, 51.158], [6, 51.842, 60.352], [7, 61.048, 73.42], [8, 74.42, 81.15], [9, 81.818, 95.538], [10, 96.27, 109.919], [11, 110.919, 118.179], [12, 118.863, 125.563], [13, 126.259, 132.139]]}}}, {"id": "p60", "year": 2026, "paper": "全国Ⅱ卷", "part": "C", "words": 311, "file": "f38", "name": "2026 全国Ⅱ卷 阅读C", "done": true, "title": "海拔的“零点”：海平面概念的历史", "genre": "说明文 · 书籍序言", "summary": "作者指出海拔是相对的，必须有参照点；而“海平面”这个参照点本身是由技术和文化假设决定、有自己历史的概念。他在山中徒步时因测高仪读数不一致而萌生写书的念头，书中考察了平均海平面历史上的三个关键阶段，并指出海平面上升问题日益紧迫。", "paras": [[{"en": "The peak of Mount Qomolangma, 8,849 meters above sea level.", "zh": "珠穆朗玛峰峰顶，海拔8849米。", "w": [{"t": "core", "h": "peak", "m": "n. 山峰；顶峰", "sp": [[4, 8]]}, {"t": "core", "h": "meter", "m": "n. 米", "sp": [[36, 42]]}, {"t": "phr", "h": "above sea level", "m": "海拔（高于海平面）", "sp": [[43, 58]]}]}, {"en": "Chimborazo, 6,263 m; Mont Blanc, 4,806 m; Pradidali hut, at the foot of the Pala group in the Dolomites, 2,278 m.", "zh": "钦博拉索山，6263米；勃朗峰，4806米；位于多洛米蒂山脉帕拉山群脚下的普拉迪达利小屋，2278米。", "w": [{"t": "core", "h": "hut", "m": "n. 小屋", "sp": [[52, 55]]}, {"t": "phr", "h": "at the foot of", "m": "在……脚下", "sp": [[57, 71]]}]}, {"en": "It is common practice to provide the elevation (高度) of a place.", "zh": "标出一个地方的海拔高度是一种常见做法。", "w": [{"t": "phr", "h": "common practice", "m": "常见做法", "sp": [[6, 21]]}, {"t": "core", "h": "provide", "m": "v. 提供", "sp": [[25, 32]]}, {"t": "ext", "h": "elevation", "m": "n. 海拔；高度", "sp": [[37, 46]]}]}, {"en": "Simple readings are now readily available on our phones and wearables.", "zh": "如今，在手机和可穿戴设备上就能轻松获取简单的读数。", "w": [{"t": "core", "h": "reading", "m": "n. 读数", "sp": [[7, 15]]}, {"t": "core", "h": "readily", "m": "adv. 容易地；随时", "sp": [[24, 31]]}, {"t": "core", "h": "available", "m": "adj. 可获得的", "sp": [[32, 41]]}, {"t": "ext", "h": "wearable", "m": "n. 可穿戴设备", "sp": [[60, 69]]}]}, {"en": "But elevation is necessarily relative: only the choice of a reference point allows us to express numerically the height of an object or a location.", "zh": "但海拔必然是相对的：只有选定一个参照点，我们才能用数字表示某个物体或地点的高度。", "w": [{"t": "core", "h": "necessarily", "m": "adv. 必然地", "sp": [[17, 28]]}, {"t": "core", "h": "relative", "m": "adj. 相对的", "sp": [[29, 37]]}, {"t": "phr", "h": "reference point", "m": "参照点", "sp": [[60, 75]]}, {"t": "phr", "h": "allow…to", "m": "允许；使能够", "sp": [[76, 82], [86, 88]]}, {"t": "core", "h": "express", "m": "v. 表达；表示", "sp": [[89, 96]]}, {"t": "ext", "h": "numerically", "m": "adv. 用数字地", "sp": [[97, 108]]}, {"t": "core", "h": "location", "m": "n. 地点；位置", "sp": [[138, 146]]}]}], [{"en": "The idea of sea level as a reference point for elevations has by now been around for so long as to go essentially unnoticed — we mention it without even considering what it means.", "zh": "把海平面作为海拔参照点的观念由来已久，以至于基本上没人注意到它——我们提到它时，甚至都不会去想它意味着什么。", "w": [{"t": "phr", "h": "be around", "m": "存在；出现", "sp": [[69, 80]]}, {"t": "phr", "h": "so…as to", "m": "如此……以至于", "sp": [[85, 87], [93, 98]]}, {"t": "core", "h": "essentially", "m": "adv. 基本上；本质上", "sp": [[102, 113]]}, {"t": "core", "h": "unnoticed", "m": "adj. 未被注意的", "sp": [[114, 123]]}, {"t": "core", "h": "mention", "m": "v. 提到", "sp": [[129, 136]]}, {"t": "core", "h": "consider", "m": "v. 考虑", "sp": [[153, 164]]}]}, {"en": "That the concept has a history is easily ignored.", "zh": "这个概念有它自己的历史，这一点很容易被忽视。", "w": [{"t": "core", "h": "concept", "m": "n. 概念", "sp": [[9, 16]]}, {"t": "core", "h": "ignore", "m": "v. 忽视", "sp": [[41, 48]]}]}, {"en": "We tend to forget that sea level is a product of technically and culturally determined assumptions.", "zh": "我们往往会忘记，海平面是由技术和文化所决定的种种假设的产物。", "w": [{"t": "phr", "h": "tend to", "m": "往往会；倾向于", "sp": [[3, 10]]}, {"t": "core", "h": "product", "m": "n. 产物", "sp": [[38, 45]]}, {"t": "core", "h": "technically", "m": "adv. 技术上", "sp": [[49, 60]]}, {"t": "core", "h": "culturally", "m": "adv. 文化上", "sp": [[65, 75]]}, {"t": "core", "h": "determine", "m": "v. 决定", "sp": [[76, 86]]}, {"t": "core", "h": "assumption", "m": "n. 假设", "sp": [[87, 98]]}]}, {"en": "In this book, I tell a story of these assumptions.", "zh": "在这本书中，我讲述的就是这些假设的故事。", "w": []}], [{"en": "Appropriately, the book took shape during a summer spent between sea and mountains.", "zh": "恰如其分的是，这本书是在一个往返于大海与群山之间的夏天里成形的。", "w": [{"t": "core", "h": "appropriately", "m": "adv. 恰当地", "sp": [[0, 13]]}, {"t": "phr", "h": "take shape", "m": "成形", "sp": [[24, 34]]}]}, {"en": "A month after visiting the French Riviera and enjoying the sandy beaches of Nice and Menton, I went hiking with friends in the Pala group.", "zh": "在游览法国里维埃拉、享受了尼斯和芒通的沙滩一个月后，我和朋友们去帕拉山群徒步。", "w": [{"t": "core", "h": "sandy", "m": "adj. 多沙的；沙质的", "sp": [[59, 64]]}, {"t": "phr", "h": "go hiking", "m": "去徒步旅行", "sp": [[95, 106]]}]}, {"en": "Resting on a pass near the Pradidali hut, we began discussing the readings offered by our altimeters (测高仪).", "zh": "在普拉迪达利小屋附近的一处山口休息时，我们开始讨论各自测高仪给出的读数。", "w": [{"t": "core", "h": "pass", "m": "n. 山口；关隘", "sp": [[13, 17]]}, {"t": "core", "h": "discuss", "m": "v. 讨论", "sp": [[51, 61]]}, {"t": "core", "h": "offer", "m": "v. 提供；给出", "sp": [[75, 82]]}, {"t": "ext", "h": "altimeter", "m": "n. 测高仪", "sp": [[90, 100]]}]}, {"en": "Why did they vary ever so slightly from one instrument to the next?", "zh": "为什么不同仪器之间的读数会有那么一丁点差异呢？", "w": [{"t": "core", "h": "vary", "m": "v. 不同；变化", "sp": [[13, 17]]}, {"t": "phr", "h": "ever so", "m": "非常；极其", "sp": [[18, 25]]}, {"t": "core", "h": "slightly", "m": "adv. 稍微", "sp": [[26, 34]]}, {"t": "core", "h": "instrument", "m": "n. 仪器", "sp": [[44, 54]]}]}, {"en": "This sense of uncertainty led me to think about the meaning of zero.", "zh": "这种不确定感促使我思考“零”的含义。", "w": [{"t": "core", "h": "uncertainty", "m": "n. 不确定性", "sp": [[14, 25]]}, {"t": "phr", "h": "lead…to", "m": "导致；促使", "sp": [[26, 29], [33, 35]]}]}, {"en": "This is how I began my search for the conceptual history of sea level.", "zh": "我就是这样开始探寻海平面这一概念的历史的。", "w": [{"t": "phr", "h": "search for", "m": "寻找；探寻", "sp": [[23, 33]]}, {"t": "ext", "h": "conceptual", "m": "adj. 概念的", "sp": [[38, 48]]}]}], [{"en": "In this book I examine three crucial stages in the history of mean sea level.", "zh": "在本书中，我考察了平均海平面历史上的三个关键阶段。", "w": [{"t": "core", "h": "examine", "m": "v. 考察；审视", "sp": [[15, 22]]}, {"t": "core", "h": "crucial", "m": "adj. 关键的", "sp": [[29, 36]]}, {"t": "core", "h": "stage", "m": "n. 阶段", "sp": [[37, 43]]}, {"t": "core", "h": "mean", "m": "adj. 平均的", "sp": [[62, 66]]}]}, {"en": "These stages mirror the development of human conceptions of the sea.", "zh": "这些阶段反映了人类对海洋认识的发展。", "w": [{"t": "core", "h": "mirror", "m": "v. 反映", "sp": [[13, 19]]}, {"t": "core", "h": "development", "m": "n. 发展", "sp": [[24, 35]]}, {"t": "core", "h": "conception", "m": "n. 观念；认识", "sp": [[45, 56]]}]}, {"en": "Since I began thinking about this project in August 2011, the issue of sea-level rise and the need to place it historically have only become more urgent: between then and the end of 2022 the global sea rose by almost 5 centimeters, about half of the overall rise recorded by satellites since 1993.", "zh": "自2011年8月我开始构思这个项目以来，海平面上升问题以及从历史角度看待它的必要性都变得愈发紧迫：从那时到2022年底，全球海平面上升了近5厘米，约为1993年以来卫星记录的总上升幅度的一半。", "w": [{"t": "core", "h": "project", "m": "n. 项目", "sp": [[34, 41]]}, {"t": "core", "h": "issue", "m": "n. 问题", "sp": [[62, 67]]}, {"t": "core", "h": "historically", "m": "adv. 从历史角度", "sp": [[111, 123]]}, {"t": "core", "h": "urgent", "m": "adj. 紧迫的", "sp": [[146, 152]]}, {"t": "core", "h": "global", "m": "adj. 全球的", "sp": [[191, 197]]}, {"t": "core", "h": "centimeter", "m": "n. 厘米", "sp": [[219, 230]]}, {"t": "core", "h": "overall", "m": "adj. 总的；全部的", "sp": [[250, 257]]}, {"t": "core", "h": "record", "m": "v. 记录", "sp": [[263, 271]]}, {"t": "core", "h": "satellite", "m": "n. 卫星", "sp": [[275, 285]]}]}]], "nv": 65}, {"id": "p61", "year": 2026, "paper": "全国Ⅱ卷", "part": "D", "words": 301, "file": "f38", "name": "2026 全国Ⅱ卷 阅读D", "done": false, "paras": [[{"en": "The Barcelona subway pulls into the station, the doors slide open and passengers pour out to go about their daily business.", "zh": "", "w": []}, {"en": "Little do they know that as they do so, a burst of energy is sent up to street level to help charge an electric car.", "zh": "", "w": []}], [{"en": "Barcelona has put together a package of clean energy technologies to help public transportation go greener, while also doing its part to tackle climate change and aid Europe’s difficult shift to the privately owned electric vehicle market.", "zh": "", "w": []}], [{"en": "Sixteen stations of Barcelona’s subway system are part of its new MetroCharge project, whereby the energy from the underground trains’ brakes (刹车) is used to power the trains and the stations themselves, while the remainder is sent snaking through cables (电缆) to the surface to power plug-in stations for privately owned vehicles.", "zh": "", "w": []}], [{"en": "Bernardo Espinoza, an engineer who takes the subway every day, owns an electric car.", "zh": "", "w": []}, {"en": "“I am pleasantly surprised, because I am always looking for where to plug it in,” Espinoza said before catching the subway in a working-class area of southern Barcelona.", "zh": "", "w": []}, {"en": "“And if it is from energy from the trains’ brakes, then even better.”", "zh": "", "w": []}], [{"en": "Regenerative brakes have been in trains for decades and are also used in some cars.", "zh": "", "w": []}, {"en": "They consist of an electric motor which collects energy used in the braking action that would be lost as heat by conventional brakes.", "zh": "", "w": []}, {"en": "That energy can be immediately used to accelerate (加速) the vehicle or, in the case of the Barcelona subway system, sent along cables to supply electricity for the station or for electric car chargers.", "zh": "", "w": []}], [{"en": "Alvaro Luna, a professor of electrical engineering, said that the system is innovative in so far as it allows for recycled energy to be redirected to specific local uses — in this case powering electric cars parked nearby.", "zh": "", "w": []}, {"en": "That, he said, boosts efficiency.", "zh": "", "w": []}]], "nv": 0}, {"id": "p62", "year": 2026, "paper": "北京卷", "part": "C", "words": 340, "file": "f39", "name": "2026 北京卷 阅读C", "done": false, "paras": [[{"en": "Smells are all around us.", "zh": "", "w": []}, {"en": "What we know as a scent (气味) is a collection of natural or artificial airborne chemicals released from objects.", "zh": "", "w": []}, {"en": "But smell is often overlooked and undervalued.", "zh": "", "w": []}, {"en": "So, as climate change and biodiversity loss threaten natural scents, many people may not even notice.", "zh": "", "w": []}], [{"en": "Whether or not we pay attention to the world’s “scentscape”, heat and pollution are causing it to shift.", "zh": "", "w": []}, {"en": "As temperatures rise, man-made substances release more scent molecules (分子), and biodiversity loss due to climate change threatens the plants that scent the environment.", "zh": "", "w": []}, {"en": "“If you go to a forest, you have a given environment and temperature.", "zh": "", "w": []}, {"en": "If that temperature goes a little bit high, the profile of the chemical components in the air changes,” since temperature can affect the amount of smell-carrying gas particles (粒子) released from substances, explains John Smith, a chemical engineer.", "zh": "", "w": []}, {"en": "“And therefore, the perception of how the forest smells changes.”", "zh": "", "w": []}], [{"en": "That effect extends beyond forests.", "zh": "", "w": []}, {"en": "Snow — already threatened by a warming climate — absorbs different chemicals from the atmosphere as temperatures rise, which changes its cold-clean scent.", "zh": "", "w": []}, {"en": "Warmer conditions can intensify smells, leading the snow to smell more unpleasant and potentially gather more pollutants.", "zh": "", "w": []}], [{"en": "Climate change is also quickening the loss of biodiversity, threatening to erase certain smells entirely.", "zh": "", "w": []}, {"en": "When plants disappear, their scents become more difficult to produce.", "zh": "", "w": []}], [{"en": "Some scents are linked to cultural heritage.", "zh": "", "w": []}, {"en": "A recent study reported that native communities in Peru noticed a change in the smell of the Amazon River due to industrial pollution.", "zh": "", "w": []}, {"en": "Over generations, communities became desensitised to increasingly smelly rivers, a sign of broader ecosystem degradation.", "zh": "", "w": []}, {"en": "At the same time, in some Amazonian belief systems, declining water quality and the unpleasant smells will lead to the dispersal (消散) of the river’s spiritual beings.", "zh": "", "w": []}, {"en": "The damage to the scentscape could result in harm to both health and spiritual practice.", "zh": "", "w": []}], [{"en": "Even though we have other valuable things endangered by climate change, like food access, there is also an element of cultural identity, cultural survival, and history.", "zh": "", "w": []}, {"en": "If we don’t look at it, we lose all the richness behind it.", "zh": "", "w": []}]], "nv": 0}, {"id": "p63", "year": 2026, "paper": "北京卷", "part": "D", "words": 410, "file": "f39", "name": "2026 北京卷 阅读D", "done": false, "paras": [[{"en": "The 21st century has created a whole range of new types of professionals that we have never had before — or if not quite new, at least newly repackaged.", "zh": "", "w": []}, {"en": "The world has always had influential people, for instance, but only now do we have “Influencer”.", "zh": "", "w": []}, {"en": "Similarly, the corporate world has certainly known its fair share of disruption, yet it is only in the last couple of decades that the “Disruptor” has become a recognisable figure in the way we talk about big business.", "zh": "", "w": []}], [{"en": "In an earlier era, the Disruptor would have been called an Innovator.", "zh": "", "w": []}, {"en": "Yet while an Innovator creates something new, the Disruptor is defined as much by what they destroy as by what they create.", "zh": "", "w": []}, {"en": "The Disruptor forces change; the clean-up is somebody else’s problem.", "zh": "", "w": []}, {"en": "It’s an attitude best summed up as “Move fast and break things.”", "zh": "", "w": []}], [{"en": "Back in 1929, G. K. Chesterton identified the core problem with moving fast and breaking things through a thought experiment.", "zh": "", "w": []}, {"en": "Imagine there is a fence along a road.", "zh": "", "w": []}, {"en": "Suppose it’s been there a long time, and was put there for some purpose.", "zh": "", "w": []}, {"en": "But that purpose is lost over time.", "zh": "", "w": []}, {"en": "To us, now, the fence seems to be nothing but an impediment.", "zh": "", "w": []}, {"en": "Why not remove it?", "zh": "", "w": []}], [{"en": "When faced with such a fence, Chesterton thinks the fact that we can’t see the point of the fence is why we should not tear it down.", "zh": "", "w": []}, {"en": "Some fences keep foxes out of henhouses, for instance.", "zh": "", "w": []}, {"en": "If you think you can do without the fence because you’ve never seen a fox, consider if the existence of the fence is precisely why you’ve never seen one.", "zh": "", "w": []}], [{"en": "Importantly, Chesterton is not saying that things can never be reformed.", "zh": "", "w": []}, {"en": "His is a preventive principle rather than an outright prohibition.", "zh": "", "w": []}, {"en": "We could rephrase it like this: understand the wisdom in past decisions before you reject them.", "zh": "", "w": []}, {"en": "If we’re too impetuous, we can end up tearing out things we don’t yet realise we rely upon.", "zh": "", "w": []}, {"en": "But uncritical devotion to the “way things are done” can also deny us the possibility of better days.", "zh": "", "w": []}], [{"en": "What is required, then, is not the fearlessness of the Disruptor, but the humility (谦卑) to stop and ask questions and to know that our own perspective is neither unique nor comprehensive.", "zh": "", "w": []}, {"en": "Disruption can be a force for good.", "zh": "", "w": []}, {"en": "It can also just leave a big mess.", "zh": "", "w": []}, {"en": "We need the ability to work out which messes are worth avoiding — because however impressively fast you move, some things can’t be easily unbroken.", "zh": "", "w": []}]], "nv": 0}, {"id": "p64", "year": 2026, "paper": "天津卷（第一次·3月）", "part": "C", "words": 354, "file": "f34", "name": "2026 天津卷（第一次·3月） 阅读C", "done": false, "paras": [[{"en": "I don’t ever want to talk about being a woman scientist again.", "zh": "", "w": []}, {"en": "There was a time in my life when people asked constantly for stories about what it’s like to work in a field dominated by men.", "zh": "", "w": []}, {"en": "I was never very good at telling those stories because truthfully I never found them interesting.", "zh": "", "w": []}, {"en": "What I do find interesting is the origin of the universe, the shape of space-time and the nature of black holes.", "zh": "", "w": []}], [{"en": "At 19, when I began studying astrophysics, it did not bother me in the least to be the only woman in the classroom.", "zh": "", "w": []}, {"en": "But while earning my Ph.D. at MIT and then as a post-doctor doing space research, the issue started to bother me.", "zh": "", "w": []}, {"en": "My every achievement—jobs, research papers, awards—was viewed through the lens of gender (性别) politics.", "zh": "", "w": []}, {"en": "So were my failures.", "zh": "", "w": []}, {"en": "Sometimes, when I was pushed into an argument on left brain versus (相对于) right brain, or nature versus nurture (培育), I would instantly fight fiercely on my behalf and all womankind.", "zh": "", "w": []}], [{"en": "Then one day a few years ago, out of my mouth came a sentence that would eventually become my reply to any and all provocations: I don’t talk about that anymore.", "zh": "", "w": []}, {"en": "It took me 10 years to get back the confidence I had at 19 and to realize that I didn’t want to deal with gender issues.", "zh": "", "w": []}, {"en": "Why should curing sexism be yet another terrible burden on every female scientist?", "zh": "", "w": []}, {"en": "After all, I don’t study sociology or political theory.", "zh": "", "w": []}], [{"en": "Today I research and teach at Barnard, a women’s college in New York City.", "zh": "", "w": []}, {"en": "Recently, someone asked me how many of the 45 students in my class were women.", "zh": "", "w": []}, {"en": "You cannot imagine my satisfaction at being able to answer, 45.", "zh": "", "w": []}, {"en": "I know some of my students worry how they will manage their scientific research and a desire for children.", "zh": "", "w": []}, {"en": "And I don’t dismiss those concerns.", "zh": "", "w": []}, {"en": "Still, I don’t tell them “war” stories.", "zh": "", "w": []}, {"en": "Instead, I have given them this: the visual of their physics professor heavily pregnant doing physics experiments.", "zh": "", "w": []}, {"en": "And in turn they have given me the image of 45 women driven by a love of science.", "zh": "", "w": []}, {"en": "And that’s a sight worth talking about.", "zh": "", "w": []}]], "nv": 0}, {"id": "p65", "year": 2026, "paper": "天津卷（第一次·3月）", "part": "D", "words": 381, "file": "f34", "name": "2026 天津卷（第一次·3月） 阅读D", "done": false, "paras": [[{"en": "On 23 April 2005, YouTube posted its first video.", "zh": "", "w": []}, {"en": "20 years later, YouTube is the world’s number one streaming service, where users clock billions of hours of watching every day.", "zh": "", "w": []}, {"en": "That’s the vision of YouTube the company promotes — professional, entertaining and loud — but from one perspective, it’s all a facade.", "zh": "", "w": []}], [{"en": "Through another lens, the essence of YouTube is more like this video from 2020.", "zh": "", "w": []}, {"en": "Before I watched, it had only been seen twice.", "zh": "", "w": []}, {"en": "A man points the camera out of his bedroom window as the winter snow falls.", "zh": "", "w": []}, {"en": "“Here it is,” he says.", "zh": "", "w": []}, {"en": "“The falling snow.”", "zh": "", "w": []}, {"en": "A bird lands on a nearby fence.", "zh": "", "w": []}, {"en": "19 minutes go by.", "zh": "", "w": []}, {"en": "Nothing happens.", "zh": "", "w": []}, {"en": "When we just focus on what’s popular, we miss how the vast majority of people actually use YouTube as uploaders, and overlook the role it plays in our society, says Ryan McGrady, a senior researcher.", "zh": "", "w": []}], [{"en": "This is not just the case with YouTube but with every major online video platform around the world.", "zh": "", "w": []}, {"en": "For example, if you spend some time dipping into the corners of Douyin and Kuaishou, two of China’s most popular online video apps, you could see a side of the Internet that sometimes feels lost, one full of pure, unvarnished (质朴的) self-expression.", "zh": "", "w": []}, {"en": "It’s an entire world that the algorithm (算法) won’t show you.", "zh": "", "w": []}], [{"en": "Most of these videos are poorly produced, lack context or just meaninglessly show this and that.", "zh": "", "w": []}, {"en": "They exist because people need a digital attic to store their memories.", "zh": "", "w": []}, {"en": "It’s an Internet unshaped by the pressures of algorithms — a glimpse into a place where content doesn’t have to perform, where it can simply exist.", "zh": "", "w": []}, {"en": "And perhaps the most important thing about these videos is that if you watch enough of them, you can piece together a complete narrative of life, work, and society in a specific region and time period.", "zh": "", "w": []}, {"en": "This knowledge could be — and sometimes is — more valuable than a book or an online class.", "zh": "", "w": []}], [{"en": "“The Internet is deeply troubled, and we can’t ignore the way tech companies are exacerbating (使恶化) those problems,” McGrady says.", "zh": "", "w": []}, {"en": "“What makes me hopeful is that when you find a way to look at how people are really using the web, a lot of it still feels like the early Internet.", "zh": "", "w": []}, {"en": "It’s expression, communication, and connection.", "zh": "", "w": []}, {"en": "Fundamentally, it’s a place where regular people share themselves and do wonderful things.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p66", "year": 2026, "paper": "天津卷（第二次·6月）", "part": "C", "words": 468, "file": "f35", "name": "2026 天津卷（第二次·6月） 阅读C", "done": false, "paras": [[{"en": "For decades, scientists hypothesized that cognitively demanding tasks, such as writing or solving math problems, require more energy than easier tasks like scrolling short videos on the phone or looking out of the window.", "zh": "", "w": []}, {"en": "However, recent research proves the view wrong.", "zh": "", "w": []}, {"en": "Our brains perform massively complex and metabolically costly computations all day long.", "zh": "", "w": []}, {"en": "“Whether you’re engaged in a cognitively demanding task at work or you’re staring off into space, your brain is using roughly the same amount of energy,” says neuroscientist Todd Braver of Washington University in St. Louis.", "zh": "", "w": []}], [{"en": "In fact, what feels more challenging is when a task requires the brain to go against its usual habits.", "zh": "", "w": []}], [{"en": "Cognitively demanding work often requires the coordination of many different brain regions in novel patterns, while silencing circuits that frequently fire together.", "zh": "", "w": []}], [{"en": "Studies have found that pushing against our brain’s habits triggers an emotional response, making us feel uncomfortable.", "zh": "", "w": []}, {"en": "“It’s aversive, and it just feels bad,” says Michael Inzlicht, a psychologist from the University of Toronto.", "zh": "", "w": []}, {"en": "But he points out that emotional responses are subjective: they are interpretations of sensations in our bodies and brains.", "zh": "", "w": []}, {"en": "And we can influence how much we pay attention to these sensations and even how we interpret them.", "zh": "", "w": []}], [{"en": "We often overestimate the struggle and pain required to complete cognitive tasks.", "zh": "", "w": []}, {"en": "This initial overestimation can lead us to procrastinate, or even avoid the task altogether.", "zh": "", "w": []}], [{"en": "Studies suggest that if we can get past that initial hurdle of starting a task, then thinking becomes easier.", "zh": "", "w": []}, {"en": "One way to do that is to pay attention to the benefits instead of the efforts required.", "zh": "", "w": []}, {"en": "In a study published in the journal Science in 2020, Andrew Westbrook, a neuroscientist at Rutgers University, and his colleagues gave participants the choice of solving an easy memory puzzle for a small amount of money or a much harder puzzle for more money.", "zh": "", "w": []}, {"en": "The options were displayed on a screen, and participants’ eye movements were tracked as they decided which puzzle to attempt.", "zh": "", "w": []}, {"en": "When people spent more time looking at the reward for the challenging puzzle, they were more likely to choose it.", "zh": "", "w": []}, {"en": "If our mind’s eye, or our attentional focus, is on the benefits of an option, over time we’re more likely to choose to do hard things.", "zh": "", "w": []}], [{"en": "Performing complex mental tasks will also be less painful if the exertion of mental effort is habituated.", "zh": "", "w": []}, {"en": "When we don’t have to make a decision to focus every day, we will save ourselves considering the costs or consequences.", "zh": "", "w": []}, {"en": "To make cognitively demanding tasks a habit, try to do them every day at the same time and in the same place.", "zh": "", "w": []}, {"en": "Add a ritual before the work starts, such as turning off the phone and launching an app to block distracting websites.", "zh": "", "w": []}, {"en": "After a few weeks, concentrating deeply won’t just feel easier, it will actually be easier.", "zh": "", "w": []}]], "nv": 0}, {"id": "p67", "year": 2026, "paper": "天津卷（第二次·6月）", "part": "D", "words": 399, "file": "f35", "name": "2026 天津卷（第二次·6月） 阅读D", "done": false, "paras": [[{"en": "In a groundbreaking new study, researchers discovered bottled water sold in stores can contain 10 to 100 times more bits of plastic than previously estimated — nanoplastics (纳米塑料) are so tiny that they cannot be seen under a microscope.", "zh": "", "w": []}], [{"en": "Nanoplastics are just 1/1000th the width of an average human hair — so tiny that experts say they can migrate through the tissues of the digestive tract (消化道) or lungs into the bloodstream, distributing potentially harmful artificial chemicals throughout the body and into cells.", "zh": "", "w": []}], [{"en": "One liter of water — equal to two standard- size bottled waters — contained an average of 240,000 plastic particles (粒子) from seven types of plastics, of which 90% were identified as nanoplastics and the rest were microplastics, according to the new study.", "zh": "", "w": []}], [{"en": "Microplastics are polymer fragments that can range from less than 0.2 inch (5 millimeters) down to 1/20000th of an inch (1 micrometer).", "zh": "", "w": []}, {"en": "Anything smaller is a nanoplastic that must be measured in billionths of a meter.", "zh": "", "w": []}], [{"en": "In the new study, published Monday in the journal Proceedings of the National Academy of Sciences, researchers from Columbia University presented a new technology that can see, count and analyze the chemical structure of nanoparticles in bottled water.", "zh": "", "w": []}], [{"en": "Instead of 300 per liter, the team behind the latest study found the actual number of plastic bits in three popular brands of water sold in the United States to be in between 110,000 and 370,000, not higher.", "zh": "", "w": []}], [{"en": "“The innovative techniques presented in the study open the door for further research to better understand the potential risks to human health,” said Jane Houlihan, research director for Healthy Babies, Bright Futures — a nonprofit committed to reducing babies’ exposures to neurotoxic (毒害神经的) chemicals, who was not involved in the study.", "zh": "", "w": []}], [{"en": "“Infants and young children may face the greatest risks, as their developing brains and bodies are often more vulnerable to impacts from toxic exposures,” said Houlihan in an email.", "zh": "", "w": []}], [{"en": "Nanoplastics are the most worrisome type of plastic pollution for human health, experts say.", "zh": "", "w": []}, {"en": "That’s because the particles can invade individual cells and tissues in major organs, potentially interrupting cellular processes and depositing harmful chemicals such as bisphenols, phthalates, PFAS, and heavy metals.", "zh": "", "w": []}], [{"en": "There are things people can do to reduce their exposure to plastics, said Houlihan.", "zh": "", "w": []}, {"en": "“We can avoid consuming foods and drinks in plastic containers.", "zh": "", "w": []}, {"en": "We can wear clothing made from natural fabrics and buy consumer products made from natural materials,” Houlihan said.", "zh": "", "w": []}, {"en": "“We can simply assess the plastic in our daily lives and find alternatives whenever possible.”", "zh": "", "w": []}]], "nv": 0}, {"id": "p68", "year": 2026, "paper": "上海卷（秋考）", "part": "C", "words": 424, "file": "f33", "name": "2026 上海卷（秋考） 阅读C", "done": false, "paras": [[{"en": "In the global push for renewable energy, a surprising conflict has emerged: the race for electric vehicles (EVs) is colliding with the need to preserve the world's remaining ancient forests.", "zh": "", "w": []}, {"en": "The heart of the issue lies in the lithium-ion battery.", "zh": "", "w": []}, {"en": "To make these batteries lighter and more efficient, manufacturers use a coating on the copper foil that holds the electricity.", "zh": "", "w": []}, {"en": "The most effective material for this coating is a resin derived from petrochemicals, but a growing number of companies are switching to an alternative bio-based material: rubber.", "zh": "", "w": []}], [{"en": "Natural rubber is not a new invention, but its use in high-tech batteries is.", "zh": "", "w": []}, {"en": "This shift has created a massive new demand for the sap of the Pará rubber tree.", "zh": "", "w": []}, {"en": "While rubber plantations can be sustainable, the problem is that the majority of the world’s remaining wild rubber trees are located deep within the rainforests of the Congo Basin and the Amazon.", "zh": "", "w": []}, {"en": "Tapping these wild trees does not require cutting them down, which is good.", "zh": "", "w": []}, {"en": "However, the sudden economic incentive to find more rubber is leading loggers and poachers deep into protected areas.", "zh": "", "w": []}], [{"en": "Previously, these remote forests were less attractive to exploit because the cost of extracting the timber was too high relative to the profit.", "zh": "", "w": []}, {"en": "But a single wild rubber tree can now generate a steady annual income.", "zh": "", "w": []}, {"en": "This has led to a “gold rush” mentality.", "zh": "", "w": []}, {"en": "Prospectors are building illegal roads to reach stands of wild rubber trees.", "zh": "", "w": []}, {"en": "Once a road is built, it acts as a spine, allowing not just rubber tappers, but also industrial loggers and bushmeat hunters to penetrate previously untouched areas.", "zh": "", "w": []}, {"en": "A study published in the journal Nature last month showed that for every kilometer of legal rubber-tapping road, there are an estimated three kilometers of illegal branches carved out for timber and hunting.", "zh": "", "w": []}], [{"en": "This creates a difficult paradox for the EV industry.", "zh": "", "w": []}, {"en": "On one hand, they need rubber to escape the petrochemical economy.", "zh": "", "w": []}, {"en": "On the other, the demand for natural rubber is indirectly causing deforestation, which releases massive amounts of stored carbon and destroys biodiversity—the very problems that EVs are supposed to solve.", "zh": "", "w": []}, {"en": "Some battery scientists are now racing to find a third option: a synthetic bio-polymer that mimics rubber’s properties but is made from plant waste like corn stalks or sugarcane bagasse, which can be grown on existing farmland rather than in rainforests.", "zh": "", "w": []}], [{"en": "Until that technology is ready, the world faces a zero-sum game: batteries that hurt the climate via oil, or batteries that hurt the climate via forests.", "zh": "", "w": []}, {"en": "The choice is not as green as consumers might assume.", "zh": "", "w": []}]], "nv": 0}, {"id": "p69", "year": 2026, "paper": "浙江卷（1月）", "part": "C", "words": 348, "file": "f36", "name": "2026 浙江卷（1月） 阅读C", "done": false, "paras": [[{"en": "Human beings have always loved reviews: word of mouth has long been regarded as one of the most valuable marketing tools available to a company.", "zh": "", "w": []}, {"en": "Consumers enjoy reading and giving reviews.", "zh": "", "w": []}, {"en": "However, the problem is that a lot of the reviews are fake (假的).", "zh": "", "w": []}, {"en": "Shabnam Azimi and Alexander Krasnikov of Loyola University of Chicago and Kwong Chan of Northeastern University recently published a study on fake reviews.", "zh": "", "w": []}], [{"en": "The study used a data set of 1,600 reviews of Chicago hotels.", "zh": "", "w": []}, {"en": "Some of them were real; others were fake.", "zh": "", "w": []}, {"en": "The reviews were presented to 400 subjects.", "zh": "", "w": []}, {"en": "Each subject got eight reviews to read: a balanced set of two positive fake, two positive real, two negative fake and two negative real, presented in a random order.", "zh": "", "w": []}, {"en": "The reviews were written by real people who were given information about the hotel.", "zh": "", "w": []}], [{"en": "The results show that consumers generally trust negative reviews more than positive ones.", "zh": "", "w": []}, {"en": "Moreover, we humans tend to assume that positive reviews might be fake.", "zh": "", "w": []}, {"en": "“Overall, negative reviews are less common.", "zh": "", "w": []}, {"en": "So, we pay more attention to them.", "zh": "", "w": []}, {"en": "When a negative review is fake, we get tricked,” Azimi says.", "zh": "", "w": []}], [{"en": "When it came to faking a review, length was important to believability, as was detail.", "zh": "", "w": []}, {"en": "A long, negative review of a hotel, complete with lots of information, tended to convince participants.", "zh": "", "w": []}, {"en": "A lengthy, positive review, on the other hand, was regarded as suspicious, and participants tended to trust writers that kept their glowing reviews short.", "zh": "", "w": []}, {"en": "Emotion was also important in convincing readers — or the lack of emotion, at least.", "zh": "", "w": []}, {"en": "Azimi says study participants tended not to trust reviews where the writers expressed their feelings in a big way.", "zh": "", "w": []}, {"en": "The more dispassionate that negative write-up, the more likely it was to take the reader in.", "zh": "", "w": []}], [{"en": "The fake reviews written for Azimi’s study were put together by humans, but increasingly, fake reviews are being written by AI, which makes them look more real.", "zh": "", "w": []}, {"en": "Though many companies use algorithms (算法) to weed out fake reviews, Azimi points out that the machines are programmed by humans, and given our limited ability to spot fake reviews, this isn’t a good sign.", "zh": "", "w": []}]], "nv": 0}, {"id": "p70", "year": 2026, "paper": "浙江卷（1月）", "part": "D", "words": 312, "file": "f36", "name": "2026 浙江卷（1月） 阅读D", "done": false, "paras": [[{"en": "Carbon removal is crucial for fighting climate change.", "zh": "", "w": []}, {"en": "Scientists at Salk Institute are making use of the natural capacity of plants to absorb carbon dioxide by enhancing their root systems.", "zh": "", "w": []}, {"en": "This optimization (优化) aims to increase the amount of carbon stored and extend the duration of its storage.", "zh": "", "w": []}], [{"en": "To design these climate-saving plants, the scientists are using a research tool called SLEAP — an AI software that tracks multiple features of root growth.", "zh": "", "w": []}, {"en": "Created by Salk Fellow Talmo Pereira, SLEAP was initially designed to track animal movement in the lab.", "zh": "", "w": []}, {"en": "Now, Pereira has teamed up with plant scientist Professor Wolfgang Busch to apply SLEAP to plants.", "zh": "", "w": []}], [{"en": "In a study published in Plant Phenomics, Busch and Pereira establish a new procedure for using SLEAP to analyze plant root phenotypes — how deep and wide they grow, how massive their root systems become, and other physical qualities.", "zh": "", "w": []}, {"en": "Prior to SLEAP, tracking the physical characteristics of both plants and animals required a lot of labor that slowed the scientific process.", "zh": "", "w": []}, {"en": "SLEAP uses computer vision (the ability for computers to understand images) and deep learning (an AI approach for training a computer to learn and work like the human brain) to help researchers process images much more quickly.", "zh": "", "w": []}], [{"en": "The application of SLEAP to plants has already enabled researchers to establish the most extensive catalog (目录) of plant root phenotypes to date.", "zh": "", "w": []}, {"en": "What’s more, tracking these physical root system characteristics helps scientists find genes (基因) associated with those characteristics, as well as whether multiple root characteristics are determined by the same genes or independently.", "zh": "", "w": []}, {"en": "This allows the Salk team to determine what genes are most beneficial to their plant designs.", "zh": "", "w": []}], [{"en": "“Our cooperation is truly proof of what makes Salk science so special and impactful,” says Pereira.", "zh": "", "w": []}, {"en": "“We’re not just ‘borrowing’ from different disciplines — we’re really putting them on equal footing in order to create something greater than the sum of its parts.”", "zh": "", "w": []}]], "nv": 0}], "bank": [{"h": "process", "t": "core", "m": ["v. 处理"], "src": ["p59"], "freq": ["p04", "p09", "p12", "p13", "p14", "p15", "p16", "p19", "p23", "p29", "p35", "p40", "p43", "p46", "p48", "p50", "p57", "p59", "p67", "p70"]}, {"h": "result", "t": "core", "m": ["v. 由……产生；导致"], "src": ["p58"], "freq": ["p08", "p09", "p14", "p16", "p17", "p18", "p20", "p23", "p28", "p36", "p37", "p38", "p43", "p47", "p53", "p56", "p58", "p62", "p69"]}, {"h": "le   sp.sort((x,y)=>x[0]-y[0]);
  let o='',pos=0;
  sp.forEach(([a,b,t,i])=>{if(a<pos)return;o+=esc(s.en.slice(pos,a))+`<mark class="w ${t}" data-h="${esc(s.w[i].h)}" data-m="${esc(s.w[i].m)}" data-t="${t}">${esc(s.en.slice(a,b))}</mark>`;pos=b});

}
function chipsHTML(s){

}
function ui(){
  const a=A(); const pp=$('#pp'); if(!a||!pp)return;
  pp.textContent=au.paused?'▶ 播放全文':'⏸ 暂停';
  const d=a.dur, t=au.src.endsWith(encodeURI(a.file))?au.currentTime:0;
  $('#pfill').style.width=(t/d*100)+'%'; $('#ptime').textContent=fmt(t)+' / '+fmt(d);
}
function bindPlayer(p){
  if(!p.audio)return;
  $('#pp').onclick=()=>{if(!ensureSrc())return; if(au.paused){stopAt=null;au.play();tick()}else au.pause(); ui()};
  $('#pbar').onclick=e=>{if(!ensureSrc())return;const r=e.currentTarget.getBoundingClientRect();const go=()=>{au.currentTime=(e.clientX-r.left)/r.width*A().dur;ui();mark(kAt(au.currentTime))};au.readyState>=1?go():au.addEventListener('loadedmetadata',go,{once:true})};
  document.querySelectorAll('#pv button').forEach(b=>b.onclick=()=>{const was=!au.paused,k=kAt(au.currentTime)||1;voice=b.dataset.v;store.set('voice',voice);stopAudio();renderPassage();if(was)playFrom(k,false)});
  document.querySelectorAll('#pr button').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;store.set('rate',rate);au.playbackRate=rate;document.querySelectorAll('#pr button').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('.s .k').forEach(e=>e.onclick=()=>playFrom(+e.parentElement.dataset.k,true));
  ui();
}
au.addEventListener('play',ui);au.addEventListener('pause',ui);

// ---------------------------------------------------------------- word bank
let bq=store.get('bq',{q:'',t:'all',sort:'freq',hide:false});
function renderBank(){
  const sel=catHTML();
  const doneN=P.filter(p=>p.done).length;
  $('#main').innerHTML=sel+`<section class="card">
   <div class="bk-h"><h1>总词库（去重）</h1><p>来自已完成标注的 ${doneN} / ${P.length} 篇文章，共 <b>${DATA.bank.length}</b> 个词条。“出现篇数”统计该词在全部 ${P.length} 篇文章中出现的次数——次数越多越该优先背。勾选表示已掌握。</p></div>
   <div class="bk-c"><input type="search" id="bqq" placeholder="搜索英文或中文…" value="${esc(bq.q)}">
    <select id="bqt"><option value="all">全部类型</option><option value="core">★ 高中核心</option><option value="ext">☆ 超纲拓展</option><option value="phr">◆ 短语搭配</option></select>
    <select id="bqs"><option value="freq">按出现篇数</option><option value="az">按字母 A–Z</option></select>
    <button class="tg ${bq.hide?'on':''}" id="bqh">隐藏已掌握</button><span class="fq" id="bqn"></span></div>
   <div class="rows" id="rows"></div></section>`;
  $('#bqt').value=bq.t;$('#bqs').value=bq.sort;
  const upd=()=>{bq={q:$('#bqq').value,t:$('#bqt').value,sort:$('#bqs').value,hide:bq.hide};store.set('bq',bq);rows()};
  $('#bqq').oninput=upd;$('#bqt').onchange=upd;$('#bqs').onchange=upd;
  $('#bqh').onclick=()=>{bq.hide=!bq.hide;store.set('bq',bq);renderBank()};
  bindSel();rows();
}
function rows(){
  const q=bq.q.trim().toLowerCase();
  let L=DATA.bank.filter(b=>(bq.t==='all'||b.t===bq.t)&&(!q||b.h.toLowerCase().includes(q)||b.m.join('；').includes(q))&&!(bq.hide&&known.has(b.h.toLowerCase())));
  if(bq.sort==='az')L=[...L].sort((a,b)=>a.h.toLowerCase().localeCompare(b.h.toLowerCase()));
  $('#bqn').textContent=L.length+' 条';
  $('#rows').innerHTML=L.length?L.map(b=>{const key=b.h.toLowerCase();return `<div class="row ${known.has(key)?'known':''}"><input type="checkbox" data-k="${esc(key)}" ${known.has(key)?'checked':''} aria-label="已掌握"><div class="hw ${b.t}">${esc(b.h)}</div><div class="mm">${esc(b.m.join('；'))}</div><div class="fq">${b.freq.length} 篇</div><div class="src">${b.freq.slice(0,12).map(id=>`<button data-go="${id}" data-w="${esc(key)}" ${open_(byId[id])?'':'disabled'} title="${esc(byId[id].name)}">${esc(short(byId[id]))}</button>`).join('')}${b.freq.length>12?`<span class="fq">等 ${b.freq.length} 篇</span>`:''}</div></div>`}).join(''):'<div class="empty">没有匹配的词条</div>';
  document.querySelectorAll('.row input').forEach(c=>c.onchange=()=>{c.checked?known.add(c.dataset.k):known.delete(c.dataset.k);store.set('known',[...known]);c.closest('.row').classList.toggle('known',c.checked)});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openP(b.dataset.go,b.dataset.w));
}
function setView(v){view=v;$('#tabP').classList.toggle('on',v==='p');$('#tabB').classList.toggle('on',v==='b');v==='p'?renderPassage():renderBank()}
$('#tabP').onclick=()=>setView('p');$('#tabB').onclick=()=>{stopAudio();setView('b')};

// ---------------------------------------------------------------- popover
const pop=$('#pop');
document.addEventListener('click',e=>{
  const m=e.target.closest('mark.w');
  if(m){const key=m.dataset.h.toLowerCase(),b=bankBy[key];
    pop.innerHTML=`<div class="tier" style="color:var(--${m.dataset.t})">${TIER[m.dataset.t]}</div><h4>${esc(m.dataset.h)}</h4><div class="m">${esc(m.dataset.m)}</div>${b?`<div class="f">在全部 ${P.length} 篇中出现 ${b.freq.length} 篇${b.m.length>1?'；其他释义：'+esc(b.m.filter(x=>x!==m.dataset.m).join('；')):''}</div>`:''}<button class="tg ${known.has(key)?'on':''}" id="pk">${known.has(key)?'✓ 已掌握':'标记为已掌握'}</button>`;
    pop.style.display='block';const r=m.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;pop.style.left=x+'px';pop.style.top=y+'px';
    $('#pk').onclick=ev=>{ev.stopPropagation();known.has(key)?known.delete(key):known.add(key);store.set('known',[...known]);pop.style.display='none'};
    e.stopPropagation();return}
  if(!e.target.closest('#pop'))pop.style.display='none';
});

// ---------------------------------------------------------------- reader (逐句模式)
let rdI=0,rdS=[],rdAuto=false,rdO=Object.assign({zh:true,ch:true},store.get('rdo',{}));
function openReader(i){const p=byId[cur];rdS=p.paras.flat();rdI=Math.max(0,i);$('#rdT').textContent=p.name+(p.title?' · '+p.title:'');$('#rd').classList.add('on');document.body.style.overflow='hidden';drawR()}
function drawR(){const s=rdS[rdI];const p=byId[cur];
  $('#rdIn').innerHTML=`<div class="en">${sentHTML(s)}</div>${rdO.zh&&s.zh?`<div class="zh">${esc(s.zh)}</div>`:''}${rdO.ch&&s.w.length?`<div class="chips">${chipsHTML(s)}</div>`:''}`;
  $('#rdPg').textContent=(rdI+1)+' / '+rdS.length;$('#rdP').style.width=((rdI+1)/rdS.length*100)+'%';
  $('#rdZh').classList.toggle('on',rdO.zh);$('#rdCh').classList.toggle('on',rdO.ch);
  $('#rdV').innerHTML=p.audio?Object.keys(p.audio).map(v=>`<button data-v="${v}" class="${v===voice?'on':''}">${VOICE[v]||v}</button>`).join(''):'';
  $('#rdV').style.display=p.audio?'':'none';$('#rdPlay').style.display=p.audio?'':'none';
  $('#rdPlay').textContent=rdAuto?'⏸ 暂停':'▶ 自动播放';
  document.querySelectorAll('#rdV button').forEach(b=>b.onclick=()=>{voice=b.dataset.v;store.set('voice',voice);const was=rdAuto;stopAudio();rdAuto=false;if(was){rdAuto=true;playFrom(rdI+1,false)}drawR()});
}
const closeR=()=>{$('#rd').classList.remove('on');document.body.style.overflow='';if(rdAuto){rdAuto=false;stopAudio()}renderPassage()};
const rdGo=d=>{const n=rdI+d;if(n<0||n>=rdS.length)return;rdI=n;drawR();if(byId[cur].audio){playFrom(rdI+1,!rdAuto)}};
$('#rdPrev').onclick=()=>rdGo(-1);$('#rdNext').onclick=()=>rdGo(1);
$('#rdPlay').onclick=()=>{if(rdAuto){rdAuto=false;au.pause()}else{rdAuto=true;playFrom(rdI+1,false)}drawR()};
$('#rdX').onclick=closeR;
$('#rdZh').onclick=()=>{rdO.zh=!rdO.zh;store.set('rdo',rdO);drawR()};$('#rdCh').onclick=()=>{rdO.ch=!rdO.ch;store.set('rdo',rdO);drawR()};
document.addEventListener('keydown',e=>{if(!$('#rd').classList.contains('on'))return;if(e.key==='ArrowRight'){e.preventDefault();rdGo(1)}else if(e.key==='ArrowLeft')rdGo(-1);else if(e.key===' '){e.preventDefault();$('#rdPlay').click()}else if(e.key==='Escape')closeR()});
setView('p');

</script>
</body>
</html>
