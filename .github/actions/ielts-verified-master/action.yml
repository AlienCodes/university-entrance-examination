name: 雅思学术阅读已核验视频母版
description: 原六级黑板主题、语音与片尾检测、逐屏 PDF 及逐篇回下载
inputs:
  early_review:
    description: 保存早期各册的定稿及逐屏证据
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/cet6-chalk-env
      with:
        browser: '141'
        asr: 'true'
    - name: 逐屏检查排版、译文与语境标注
      id: native_layout
      continue-on-error: ${{ inputs.early_review == 'true' }}
      shell: bash
      run: |
        if [[ -n "${IELTS_WORK:-}" ]]; then exec > >(tee "$IELTS_WORK/native-layout.log") 2>&1; fi
        /opt/ttsenv/bin/python "$TARGET/tools/pilot_video.py" stills
        /opt/ttsenv/bin/python "$TARGET/tools/series_render.py" lock

    - uses: ./.github/actions/ielts-local-editor
      if: inputs.early_review == 'true' && steps.native_layout.outcome == 'failure' && env.IELTS_EDITOR_BIN == ''
    - uses: ./.github/actions/ielts-translation
      if: inputs.early_review == 'true' && steps.native_layout.outcome == 'failure' && env.IELTS_MT_BIN == ''
    - name: 按实测画面重排超出的意群并重新核验
      if: inputs.early_review == 'true' && steps.native_layout.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          bash .github/run-ielts-editors.sh /opt/ttsenv/bin/python "$TARGET/tools/repair_early_layout.py" 2>&1 | tee -a "$IELTS_WORK/native-reflow.log"
          if /opt/ttsenv/bin/python "$TARGET/tools/pilot_video.py" stills > "$IELTS_WORK/native-layout.log" 2>&1; then
            /opt/ttsenv/bin/python "$TARGET/tools/series_render.py" lock
            exit 0
          fi
        done
        cat "$IELTS_WORK/native-layout.log"
        exit 1
    - name: 保存早期册逐屏复核定稿
      if: inputs.early_review == 'true'
      shell: bash
      run: python "$TARGET/tools/early_editor.py" seal
    - name: 生成或恢复认证朗读
      shell: bash
      run: |
        if [[ -n "${IELTS_WORK:-}" ]]; then exec > >(tee "$IELTS_WORK/native-audio.log") 2>&1; fi
        set -euo pipefail
        audioid=$(python -c 'import json,hashlib,os,pathlib;p=pathlib.Path(os.environ["TARGET"]+"/篇目")/os.environ["IELTS_LESSON"]; m=json.loads((p/"篇目信息.json").read_text()); text=[x.split("\t")[0] for x in (p/"双语精读.tsv").read_text().splitlines() if x]; print(hashlib.sha256(json.dumps([text,m.get("pronunciation",{}),pathlib.Path(os.environ["TARGET"]+"/tools/audio_lesson.py").read_text()],ensure_ascii=False).encode()).hexdigest()[:16])')
        asset="$IELTS_LESSON-audio-$audioid.zip"
        accepted=$(jq -r --arg pid "$IELTS_LESSON" '.audio_assets[$pid] // empty' .github/ielts-series-render.json)
        if [[ -n "$accepted" ]]; then
          [[ "$accepted" =~ ^${IELTS_LESSON}-audio-[0-9a-f]{16}\.zip$ ]]
          asset="$accepted"
        fi
        python "$TARGET/tools/release_assets.py" "$STAGING" "$asset" "$RUNNER_TEMP" --if-present
        if [[ -s "$RUNNER_TEMP/$asset" ]]; then
          python -m zipfile -e "$RUNNER_TEMP/$asset" "$TARGET"
        else
          if [[ -n "$accepted" ]]; then echo "Cannot restore the selected certified audio $accepted"; exit 1; fi
          sudo apt-get install -y -qq espeak-ng
          python -m venv "$RUNNER_TEMP/speech"
          sp="$RUNNER_TEMP/speech/bin/python"
          "$sp" -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          "$sp" -m pip install -q 'click==8.1.8' 'typer==0.16.0' 'numpy<2.3' 'spacy==3.8.7' 'thinc==8.3.6' 'preshed==3.0.9' 'cymem==2.0.13' 'murmurhash==1.0.12' 'kokoro-onnx==0.6.1' 'misaki[en]==0.9.4' num2words soxr pyloudnorm soundfile lameenc scipy
          "$sp" -m pip install -q --no-deps https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          "$sp" tools/tts/download_models.py
          "$sp" "$TARGET/tools/audio_lesson.py"
          python .github/check-audio-cert.py "$TARGET/audio"
          (cd "$TARGET" && python -m zipfile -c "$RUNNER_TEMP/$asset" audio)
          gh release upload "$STAGING" "$RUNNER_TEMP/$asset" --clobber
        fi
        python .github/check-audio-cert.py "$TARGET/audio"
    - name: 核对分屏朗读、渲染4K视频和验证片尾
      env:
        KEEP_FAILED: 1
      shell: bash
      run: |
        if [[ -n "${IELTS_WORK:-}" ]]; then exec > >(tee "$IELTS_WORK/native-video.log") 2>&1; fi
        set -euo pipefail
        /opt/ttsenv/bin/python "$TARGET/tools/series_render.py" align
        export IELTS_SYSTEM_FFMPEG="$(command -v ffmpeg)"
        export PATH="$PWD/$TARGET/tools/静帧编码:$PATH"
        /opt/ttsenv/bin/python "$TARGET/tools/pilot_video.py" video
        mkdir -p "$RUNNER_TEMP/out"
        files=("$TARGET"/最终视频/*.mp4)
        test "${#files[@]}" -eq 1
        /opt/ttsenv/bin/python "$TARGET/tools/check_ending.py" "${files[0]}" "$RUNNER_TEMP/out/ending.json"
    - name: 逐屏导出20 MB以内讲义并回下载复核
      shell: bash
      run: |
        if [[ -n "${IELTS_WORK:-}" ]]; then exec > >(tee "$IELTS_WORK/native-package.log") 2>&1; fi
        set -euo pipefail
        /opt/ttsenv/bin/python -m pip install -q img2pdf==0.6.3 PyMuPDF==1.26.6
        out="$RUNNER_TEMP/out"
        files=("$TARGET"/最终视频/*.mp4)
        /opt/ttsenv/bin/python "$TARGET/tools/reading_notes.py" "${files[0]}" "$out/Reading-notes.pdf" "$out/pdf-proof.json"
        /opt/ttsenv/bin/python "$TARGET/tools/series_render.py" package --out "$out"
        key=$(jq -r .material_sha256 "$out/$IELTS_LESSON-receipt.json")
        version="$IELTS_LESSON-${key:0:16}.zip"
        mv "$out/$IELTS_LESSON.zip" "$out/$version"
        gh release upload "$STAGING" "$out/$version" "$out/$IELTS_LESSON-receipt.json" --clobber
        python "$TARGET/tools/release_assets.py" "$STAGING" "$version" "$RUNNER_TEMP/check"
        cmp "$out/$version" "$RUNNER_TEMP/check/$version"
