# token预算：0；仅生成一篇已校对的剑20样片。
name: 剑桥雅思20黑板精读样片
on:
  push:
    branches: ['codex/ielts-academic-reading']
    paths: ['.github/ielts-academic-pilot.json']
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGING: ielts-academic-pilot-production
      FINAL: ielts-academic-20-test-1-passage-1-pilot
      TARGET: 雅思/学术阅读
      MEDIA: Cambridge-IELTS-20-Test-1-Passage-1-The-kakapo.mp4
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /雅思/学术阅读/
            /tools/video/
            /tools/tts/*.py
            /tools/tts/*.json
            /专八/tools/
            /六级/tools/
            /四级/tools/
            /中考/tools/画面核查/
      - name: 核对单篇及运行阶段
        id: cfg
        run: |
          python3 - <<'PY'
          import json,os
          c=json.load(open('.github/ielts-academic-pilot.json'))
          assert c['id']=='C20T1P1' and c['stage'] in ('stills','video')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('stage='+c['stage'],file=f)
          PY
      - uses: ./.github/actions/cet6-chalk-env
        with:
          browser: '141'
          asr: ${{ steps.cfg.outputs.stage == 'video' && 'true' || 'false' }}
      - name: 逐屏比对双语定稿、词条、字号、溢出与字体
        if: steps.cfg.outputs.stage == 'stills'
        run: /opt/ttsenv/bin/python "$TARGET/tools/pilot_video.py" stills
      - name: 保存本次所有截图和检查记录
        if: always() && steps.cfg.outputs.stage == 'stills'
        run: |
          cd "$TARGET"
          test -f 样片/review.json
          python -m zipfile -c "$RUNNER_TEMP/stills-$GITHUB_RUN_ID.zip" 样片
          gh release view "$STAGING" >/dev/null 2>&1 || gh release create "$STAGING" --target "$GITHUB_REF_NAME" --title '雅思阅读样片制作素材' --notes '剑20第一篇制作素材。' --prerelease
          gh release upload "$STAGING" "$RUNNER_TEMP/stills-$GITHUB_RUN_ID.zip"
      - name: 取回同一篇已核验音轨和审阅截图
        if: steps.cfg.outputs.stage == 'video'
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tempfile,zipfile
          from pathlib import Path
          c=json.load(open('.github/ielts-academic-pilot.json'))
          for k in ('audio','stills'):
              name,digest=c[k]['name'],c[k]['sha256']
              subprocess.run(['gh','release','download',os.environ['STAGING'],'-p',name,'-D',os.environ['RUNNER_TEMP']],check=True)
              path=Path(os.environ['RUNNER_TEMP'])/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  z.extractall(os.environ['TARGET'])
          PY
      - name: 六级4K成片渲染与逐屏、逐句核验
        if: steps.cfg.outputs.stage == 'video'
        env:
          KEEP_FAILED: '1'
        run: |
          export IELTS_SYSTEM_FFMPEG="$(command -v ffmpeg)"
          export PATH="$PWD/$TARGET/tools/静帧编码:$PATH"
          /opt/ttsenv/bin/python "$TARGET/tools/pilot_video.py" video
      - name: 独立核对配音合格证，保存已经核验的成片
        if: steps.cfg.outputs.stage == 'video'
        run: python .github/check-audio-cert.py "$TARGET/audio"
      - name: 核验音视频片尾、逐帧解码与浏览器自然播放结束
        if: steps.cfg.outputs.stage == 'video'
        run: |
          shopt -s nullglob
          files=("$TARGET"/最终视频/*.mp4)
          test "${#files[@]}" -eq 1
          /opt/ttsenv/bin/python "$TARGET/tools/check_ending.py" "${files[0]}" "$TARGET/样片/成品核查/ending.json"
      - uses: actions/upload-artifact@v4
        if: "!cancelled() && steps.cfg.outputs.stage == 'video'"
        with:
          name: C20T1P1-${{ job.status == 'success' && 'verified-video' || 'review-needed' }}
          path: |
            雅思/学术阅读/最终视频/*.mp4
            雅思/学术阅读/样片/成品核查/*.json
          compression-level: 0
          if-no-files-found: error
      - name: 优先发布经过片尾核验的 MP4
        if: steps.cfg.outputs.stage == 'video'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$TARGET"/最终视频/*.mp4)
          reports=("$TARGET"/样片/成品核查/*_核查.json)
          test "${#files[@]}" -eq 1 && test "${#reports[@]}" -eq 1
          jq -e '.ok == true and all(.checks[]; .ok == true)' "${reports[0]}"
          cp "${files[0]}" "$RUNNER_TEMP/$MEDIA"
          jq -s '.[0] + {ending: .[1]}' "${reports[0]}" "$TARGET/样片/成品核查/ending.json" > "$RUNNER_TEMP/verification.json"
          cd "$RUNNER_TEMP"
          gh release view "$FINAL" >/dev/null 2>&1 || gh release create "$FINAL" --target "$GITHUB_SHA" --draft --title '剑桥雅思20 · Test 1 Passage 1《鸮鹦鹉》完整精读样片' --notes '学术类阅读。视频采用六级教室黑板主题与四六级男声。逐屏截图讲义制作完成后将附在同一发布页。'
          gh release upload "$FINAL" "$MEDIA" verification.json --clobber
          mkdir -p mp4-verify
          gh release download "$FINAL" --dir mp4-verify --pattern "$MEDIA" --pattern verification.json --clobber
          cmp "$MEDIA" "mp4-verify/$MEDIA"
          cmp verification.json mp4-verify/verification.json
          gh release edit "$FINAL" --draft=false --latest=false
      - name: 从已发布的 4K 成片逐屏截帧并核对轻量讲义
        if: steps.cfg.outputs.stage == 'video'
        run: |
          set -euo pipefail
          /opt/ttsenv/bin/python -m pip -q install img2pdf==0.6.3 PyMuPDF==1.26.6
          /opt/ttsenv/bin/python "$TARGET/tools/reading_notes.py" "$RUNNER_TEMP/$MEDIA" "$RUNNER_TEMP/Reading-notes.pdf" "$RUNNER_TEMP/pdf-proof.json"
          cd "$RUNNER_TEMP"
          jq -s '.[0] + {pdf: .[1]}' verification.json pdf-proof.json > media-and-pdf.json
          mv media-and-pdf.json verification.json
          sha256sum "$MEDIA" verification.json Reading-notes.pdf > SHA256SUMS
          gh release upload "$FINAL" Reading-notes.pdf verification.json SHA256SUMS --clobber
          gh release download "$FINAL" --dir mp4-verify --pattern Reading-notes.pdf --pattern verification.json --pattern SHA256SUMS --clobber
          (cd mp4-verify && sha256sum -c SHA256SUMS)
          gh release edit "$FINAL" --latest=false --notes '剑桥雅思 20 学术类 · Test 1 Passage 1《The kākāpō 鸮鹦鹉》。完整 4K 精读视频，时长 6 分 21 秒。全篇 51 句，47 句一屏读完，4 句按意群分屏，共收录 215 个不同的词与搭配。Reading-notes.pdf 含 57 页，每页直接从同一 MP4 截帧并压缩，全册讲义小于 20 MB。'
