# 修改 .github/zk-materials-release.txt 并推送时：把 中考/听写卡/ 下每篇一个文件夹（逐句精读 + 三份听写卡 PDF）加上该篇的朗读音频，打包成 zip，生成 GitHub Release
# 清单格式：第一行标签名（如 zk-materials）；之后每行“文件夹名|朗读音频（相对 中考/audio/）”，顺序与 B 站 40P 相同（中考/tools/封面/make_post.py 的 BILIBILI）
# 发布用 GitHub 自带的 gh（第三方 softprops/action-gh-release 曾连续 403，CLAUDE.md 踩坑 42）
name: 发布中考学习资料压缩包
on:
  push:
    paths: ['.github/zk-materials-release.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 组装文件夹并打包
        run: |
          set -e
          tag=$(head -1 .github/zk-materials-release.txt | tr -d '[:space:]')
          top="中考英语阅读40篇学习资料"
          python3 - "$top" <<'PY'
          import shutil, sys
          from pathlib import Path
          top = sys.argv[1]
          lines = [l for l in Path('.github/zk-materials-release.txt').read_text('utf-8').split('\n')[1:] if l.strip()]
          out = Path('dist') / top
          out.mkdir(parents=True)
          rows, order = [], []
          for i, l in enumerate(lines, 1):
              name, audio = l.split('|')
              src = Path('中考/听写卡') / name
              pdfs = sorted(x.name for x in src.glob('*.pdf'))
              assert pdfs == [f'{name} - {k}.pdf' for k in ('0 逐句精读', '1 汉译英', '2 英译汉', '3 文章填空')], (name, pdfs)
              shutil.copytree(src, out / name)
              shutil.copy(Path('中考/audio') / audio, out / name / f'{name} - 朗读音频.mp3')
              rows.append(f'| P{i} | {name} |')
              order.append(f'{top}/{name}')
          assert len(lines) == 40, len(lines)
          Path('order.txt').write_text('\n'.join(order) + '\n', 'utf-8')
          Path('notes.md').write_text(
              f'中考英语阅读真题学习资料，共 {len(lines)} 篇，与 B 站 40P 合集一一对应、顺序相同（P1—P40）。每篇一个文件夹，5 个文件：\n\n'
              '- 0 逐句精读.pdf：与视频画面一模一样（片头 + 每句一页：英文高亮、中文翻译、生词编号注释；特别长的句子分两页）\n'
              '- 1 汉译英.pdf：看中文写英文\n- 2 英译汉.pdf：看英文写中文\n'
              '- 3 文章填空.pdf：原文挖空（试卷的中文注释已去掉），附整句翻译和每空释义\n'
              '- 朗读音频.mp3：男声逐句朗读（四六级同款声音，与视频是同一份朗读，已去除电磁音）\n\n'
              '三份听写卡 PDF 的最后一页是答案；A4 纸，可直接打印。\n\n| # | 篇目 |\n|---|---|\n' + '\n'.join(rows) + '\n', 'utf-8')
          PY
          zipname="ZHONGKAO-reading-materials-${tag}.zip"
          mapfile -t dirs < order.txt
          (cd dist && zip -r -q "../${zipname}" "${dirs[@]}")
          unzip -l "${zipname}" | tail -1
          echo "ZIPNAME=${zipname}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          title="中考英语阅读40篇 学习资料（逐句精读 + 听写卡 + 朗读音频）"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIPNAME" --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIPNAME" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          fi
