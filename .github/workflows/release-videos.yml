# 推送 videos-* 标签时，把该提交里 最终视频/ 的全部 MP4 打包成 zip，生成 GitHub Release
name: 发布视频压缩包
on:
  push:
    tags: ['videos-*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包视频
        run: |
          set -e
          n=$(ls 最终视频/*.mp4 | wc -l)
          zipname="gaokao-english-reading-CD-videos-${n}.zip"
          cd 最终视频
          # MP4 本身已压缩，-0 只打包不再压缩；文件名保持原来的“年份 试卷 阅读C/D 题目.mp4”
          zip -0 -q "../${zipname}" *.mp4 核查报告.md
          cd ..
          unzip -l "${zipname}" | tail -1
          {
            echo "高考英语阅读 C/D 逐句精读视频，共 ${n} 个（4K，女声朗读，中文翻译 + 生词表）。"
            echo
            echo "下载下面的 \`${zipname}\`，解压即可。每个视频都通过了 核查报告.md 里的全部核查（响度、停顿、静音、流畅度、朗读与画面一致）。"
            echo
            echo "| # | 文件名 |"
            echo "|---|---|"
            i=0; for f in 最终视频/*.mp4; do i=$((i+1)); echo "| $i | $(basename "$f") |"; done
          } > notes.md
          echo "ZIPNAME=${zipname}" >> "$GITHUB_ENV"
          echo "N=${n}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: 高考英语阅读精读视频（${{ env.N }} 个）
          body_path: notes.md
          files: ${{ env.ZIPNAME }}
