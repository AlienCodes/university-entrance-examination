name: 剑桥雅思 Aiden 单批制作与发布
on:
  workflow_call:
    inputs:
      batch:
        type: string
        required: true
      recovery_index:
        type: string
        default: ''
      pilot_only:
        type: boolean
        default: false
      certified_audio:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  word_review:
    if: inputs.batch == '13-6' && !inputs.pilot_only
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        books: ['13 12', '11 10', '9 8', '7 6']
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      IELTS_NARRATOR: Aiden
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ielts-academic-reading
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
            tools/tts
            高考语法填空/tools
      - uses: ./.github/actions/ielts-word-listening
        with:
          books: ${{ matrix.books }}
  plan:
    needs: word_review
    if: ${{ !cancelled() && (needs.word_review.result == 'success' || needs.word_review.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      IELTS_NARRATOR: Aiden
    outputs:
      batch: ${{ steps.queue.outputs.batch }}
      pilot: ${{ steps.queue.outputs.pilot }}
      remaining: ${{ steps.queue.outputs.remaining }}
      pilot_only: ${{ steps.queue.outputs.pilot_only }}
      certified_audio: ${{ steps.queue.outputs.certified_audio }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch == '13-6' && !inputs.pilot_only && 'codex/ielts-academic-reading' || github.sha }}
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
            tools/tts
            高考语法填空/tools
      - id: queue
        env:
          EDITION: ${{ inputs.batch }}
          PILOT_ONLY: ${{ inputs.pilot_only }}
          CERTIFIED_AUDIO: ${{ inputs.certified_audio }}
        run: |
          echo "pilot_only=$PILOT_ONLY" >> "$GITHUB_OUTPUT"
          echo "certified_audio=$CERTIFIED_AUDIO" >> "$GITHUB_OUTPUT"
          python '雅思/学术阅读/tools/aiden_batch.py' plan "$EDITION"
  pilot:
    needs: plan
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ needs.plan.outputs.pilot }}
      aiden_batch: ${{ needs.plan.outputs.batch }}
      verified_audio_only: ${{ needs.plan.outputs.certified_audio == 'true' }}
      recovery_index: ${{ inputs.recovery_index }}
      current_tools: ${{ needs.plan.outputs.batch == '13-6' && needs.plan.outputs.pilot_only != 'true' }}
  preview:
    needs: [plan, pilot]
    if: needs.plan.outputs.pilot_only == 'true' || needs.plan.outputs.batch == '13-6'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IELTS_NARRATOR: Aiden
      IELTS_LESSON: ${{ needs.plan.outputs.pilot }}
      IELTS_AIDEN_BATCH: ${{ needs.plan.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: 雅思/学术阅读
      - name: 从公开下载入口复核已审样片
        if: needs.plan.outputs.batch == '13-6' && needs.plan.outputs.pilot_only != 'true'
        run: python '雅思/学术阅读/tools/aiden_preview.py' "$RUNNER_TEMP/preview" --check-approved
      - name: 发布单个 MP4 并从公开链接回下载整片
        if: needs.plan.outputs.pilot_only == 'true'
        run: python '雅思/学术阅读/tools/aiden_preview.py' "$RUNNER_TEMP/preview"
  production:
    needs: [plan, pilot, preview]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.pilot.result == 'success' &&
      (needs.preview.result == 'success' || (needs.plan.outputs.batch != '13-6' && needs.preview.result == 'skipped')) &&
      needs.plan.outputs.pilot_only != 'true' && needs.plan.outputs.remaining != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lesson: ${{ fromJSON(needs.plan.outputs.remaining) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      aiden_batch: ${{ needs.plan.outputs.batch }}
      recovery_index: ${{ inputs.recovery_index }}
      current_tools: true

  delivery:
    needs: [plan, pilot, preview, production]
    if: >-
      always() && !cancelled() && needs.plan.outputs.pilot_only != 'true' &&
      needs.plan.result == 'success' && needs.pilot.result == 'success' &&
      (needs.preview.result == 'success' || (needs.plan.outputs.batch != '13-6' && needs.preview.result == 'skipped')) &&
      (needs.production.result == 'success' || (needs.plan.outputs.remaining == '[]' && needs.production.result == 'skipped') ||
       (needs.plan.outputs.batch == '13-6' && needs.production.result == 'failure'))
    uses: ./.github/workflows/ielts-early-delivery.yml
    with:
      aiden_batch: ${{ needs.plan.outputs.batch }}
