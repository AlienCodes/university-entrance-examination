name: 语法填空配音：合成机被收回时自动重跑一次
# 踩坑 100（2026-11-03）：GitHub 中途收回合成机（exit 143 / The runner has received a shutdown signal），整个运行判失败、缺一个 take。
# 第一次失败（run_attempt == 1）就只重跑失败的作业一次（collect 依赖它们，会跟着重跑、补进同一个 runs/<任务>-<运行号>/）；
# 第二次再失败照常报出（真代码错误不会被掩盖）；被取消的（cancelled）不重跑。判断条件只写在这一处，双向验证 tools/防复发/验证/自动重跑.py。
on:
  workflow_run:
    workflows: ['语法填空配音（Qwen3-TTS）']
    types: [completed]
permissions:
  actions: write
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: 只重跑失败的作业（一次）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo "${{ github.repository }}"
