# 修改 .github/cet6-chalk-release.txt 并推送时生成 GitHub Release：六级仔细阅读精读视频（教室黑板、大字版，2026-10-17 起的新版）。
# 第一行 = 标签名（如 cet6-chalk）；第 2 行起逐行列出 六级/最终视频_黑板/ 下要发布的 MP4 文件名（按篇目顺序）。
# 每 20 个打一个 zip（一个 Release 附件不能超过 2 GB；zip 里保留完整中文文件名）；用 GitHub 自带的 gh 发布（踩坑 42：第三方插件 403）。
# 只检出要用的目录（仓库里各项目的视频很多，全检出会挤满运行器磁盘）。
name: 发布六级视频（教室黑板）
on:
  push:
    paths: ['.github/cet6-chalk-release.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            六级/最终视频_黑板
            六级/核查报告_黑板.md
          sparse-checkout-cone-mode: false
      - name: 打包（每 20 个一个 zip）
        run: |
          set -e
          tag=$(head -1 .github/cet6-chalk-release.txt | tr -d '[:space:]')
          mapfile -t files < <(tail -n +2 .github/cet6-chalk-release.txt | sed '/^[[:space:]]*$/d')
          n=${#files[@]}; [ "$n" -gt 0 ] || { echo "没有列出视频"; exit 1; }
          for f in "${files[@]}"; do [ -f "六级/最终视频_黑板/$f" ] || { echo "找不到：$f"; exit 1; }; done
          parts=$(( (n + 19) / 20 )); zips=()
          for ((p=0; p<parts; p++)); do
            z="CET6-chalkboard-videos-part$((p+1))-of-${parts}.zip"
            (cd 六级/最终视频_黑板 && zip -0 -q "../../$z" "${files[@]:p*20:20}")
            zips+=("$z"); ls -la "$z"
          done
          {
            echo "大学英语六级 仔细阅读（Section C）逐句精读视频 · 教室黑板大字版，共 ${n} 个（分 ${parts} 个压缩包，每包 20 个，解压即可）。"
            echo
            echo "4K（3840×2160）、30 帧/秒恒定；英文 Inter 加粗、中文黑体，生词黄色、短语粉色；男声朗读（已去电磁音），句与句之间停顿 0.8 秒；每个视频 ≤ 95 MB。"
            echo
            echo "每个视频都通过了全部成品核查（分辨率、流畅度、声画等长、片头 1.5 秒 / 结尾 2 秒静音、句间停顿、响度、无电磁音、朗读与画面逐句一致、逐屏与审过的截图一致、体积），并单独复测（verify_all）。"
            echo
            echo "| # | 文件名 | 压缩包 |"
            echo "|---|---|---|"
            i=0; for f in "${files[@]}"; do i=$((i+1)); echo "| $i | $f | part$(( (i-1)/20 + 1 )) |"; done
          } > notes.md
          echo "TAG=${tag}" >> "$GITHUB_ENV"; echo "N=${n}" >> "$GITHUB_ENV"
          printf '%s\n' "${zips[@]}" > zips.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          mapfile -t zips < zips.txt
          title="六级仔细阅读精读视频 · 教室黑板大字版（${N} 个）"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${zips[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" "${zips[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          fi
