# token预算：约0万；已核定资料的排版/音频/编码/发布由程序执行。
name: 专八两篇失败精听独立两步编码
on:
  push:
    branches: ['codex/tem8-listening-2009-2024']
    paths: ['.github/tem8-listening-intensive-two-stage.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: tem8-listening-intensive-two-stage-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  list:
    if: github.repository == 'AlienCodes/university-entrance-examination' && github.ref == 'refs/heads/codex/tem8-listening-2009-2024'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      stage: ${{ steps.list.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            专八/听力/批量
            专八/听力/tools
            专八/听力/原文/tools
            专八/真题/2025年 英语专业八级真题.pdf
            专八/tools
            四级/tools
            六级/tools
            中考/tools/画面核查
            高考听力/精读/tools/本机预览.py
            tools
            !/tools/tts/models/
      - name: 核所有输入审核、依赖指纹与完整批次范围
        id: list
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 .github/check-release-target.py
          python3 - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          s=importlib.util.spec_from_file_location('pub',Path('专八/听力/批量/tools/发布汇集.py'));m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          P=m
          allowed=['2022-A','2024-A']
          assert set(m.INTENSIVE_TWO_STAGE_IDS)==set(allowed) and len(m.INTENSIVE_TWO_STAGE_IDS)==2
          c=P.load_control(Path('.github/tem8-listening-intensive-two-stage.json'))
          assert c['mode']=='sample' and c['stage']=='render' and c['render'] is True and c['cache_only'] is True
          assert c['exam']==[] and c.get('render_exam',[])==[]
          assert c['intensive']==allowed and c['render_intensive']==allowed
          assert c['render_targets']=={'exam':[],'intensive':allowed}
          for ident in allowed:
              P.gate('intensive',ident)
          rows=P.matrix(c)
          expected=[{'kind':'intensive','id':ident,'year':int(ident[:4])} for ident in allowed]
          assert len(rows)<=2 and len({r['id'] for r in rows})==len(rows) and all(r in expected for r in rows)
          if rows:
              P.ensure_release(P.CACHE_TAG,'专八历年听力已核验成品与来源存档','仅存当前审批的内部精听片段；正式交付须按年组装，不将中间片段冒充整套。')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(rows)+'\n');f.write('stage='+c['stage']+'\n')
          print('本次两步编码目标',allowed,'；实际需制作',len(rows),'项，全部只存内部缓存。')
          PY
  render:
    needs: list
    if: needs.list.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            专八/听力/批量
            专八/听力/tools
            专八/听力/2025
            专八/听力/原文/tools
            专八/真题/2025年 英语专业八级真题.pdf
            专八/tools
            四级/tools
            六级/tools
            中考/tools/画面核查
            高考听力/精读/tools/本机预览.py
            tools
            !/tools/tts/models/
      - uses: ./.github/actions/cet6-chalk-env
        with: {asr: 'false', browser: '153'}
      - name: 精听自动分屏所需NLP（按已验证版本，避免新版本OverflowError）
        run: |
          set -euo pipefail
          /opt/ttsenv/bin/pip install -q --disable-pip-version-check spacy==3.8.7 thinc==8.3.6 preshed==3.0.9 cymem==2.0.11 murmurhash==1.0.12 typer==0.15.4 click==8.1.8
          /opt/ttsenv/bin/pip install -q --disable-pip-version-check --no-deps https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          /opt/ttsenv/bin/python -c "import spacy; spacy.load('en_core_web_sm')('It is ready.'); print('分屏NLP模型加载通过')"
      - name: 同款原卷字体与正式输入门禁
        run: |
          set -euo pipefail
          /opt/ttsenv/bin/pip install -q --disable-pip-version-check pypdf==6.21.4 fonttools==4.68.0 cryptography==50.0.2
          /opt/ttsenv/bin/python 专八/听力/tools/取字体.py
          /opt/ttsenv/bin/python 专八/听力/批量/tools/发布汇集.py gate 'intensive' '${{ matrix.item.id }}'
      - name: 准备原采样率/声道音频（不擅自剪音乐）
        run: |
          set -euo pipefail
          mkdir -p in work
          if [ '${{ matrix.item.year }}' = '2022' ]; then
            /opt/ttsenv/bin/python 专八/听力/批量/tools/原音准备.py 2022 --out in/audio
          else
            curl -fL --retry 5 --retry-delay 3 -o in/default.zip https://github.com/AlienCodes/university-entrance-examination/releases/download/tem8-listening-raw/default.zip
            /opt/ttsenv/bin/python 专八/听力/批量/tools/原音准备.py '${{ matrix.item.year }}' --archive in/default.zip --out in/audio
            rm in/default.zip
          fi
          cp in/audio/原音准备.json work/源音频准备.json
      - name: 两步入口预检、原声与完整截图
        env:
          TEM8_BROWSER: /opt/pw-browsers/chromium
          TEM8_THREADS: '2'
        run: |
          set -euo pipefail
          P=/opt/ttsenv/bin/python
          U='专八/听力/批量/精听数据/${{ matrix.item.id }}.json'
          $P 专八/听力/批量/tools/精听两步编码.py "$U" precheck --autosplit --original in/audio/原音.wav --out work --browser /opt/pw-browsers/chromium
      - name: 核当前截图与真实审阅登记一致，再编码与独立核验
        if: needs.list.outputs.stage == 'render'
        env:
          TEM8_BROWSER: /opt/pw-browsers/chromium
          TEM8_THREADS: '2'
        run: |
          set -euo pipefail
          P=/opt/ttsenv/bin/python
          $P 专八/听力/批量/tools/发布汇集.py gate 'intensive' '${{ matrix.item.id }}' --work work --record current-review.json
          U='专八/听力/批量/精听数据/${{ matrix.item.id }}.json'
          NOTE=$(python3 -c 'import json;print(json.load(open("current-review.json"))["evidence"])')
          $P 专八/听力/批量/tools/精听两步编码.py "$U" approve --review-note "$NOTE" --out work --browser /opt/pw-browsers/chromium
          $P 专八/听力/批量/tools/精听两步编码.py "$U" video --out work --browser /opt/pw-browsers/chromium
          $P 专八/听力/批量/tools/精听两步编码.py "$U" verify --out work --browser /opt/pw-browsers/chromium
      - name: 成功结果立即持久保存（临时artifact不是唯一副本）
        if: needs.list.outputs.stage == 'render'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          P=/opt/ttsenv/bin/python
          $P 专八/听力/批量/tools/发布汇集.py stage 'intensive' '${{ matrix.item.id }}' --work work --out up
          $P 专八/听力/批量/tools/发布汇集.py store up
      - uses: actions/upload-artifact@v4
        if: needs.list.outputs.stage == 'render'
        continue-on-error: true
        with:
          name: tem8-intensive-two-stage-${{ matrix.item.id }}
          path: up
          compression-level: 0
          retention-days: 30
      - name: 失败诊断（不代替成品持久保存）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tem8-intensive-two-stage-diagnostic-${{ matrix.item.id }}
          path: |
            work/**/*.json
            current-review.json
          if-no-files-found: ignore
          retention-days: 14
