# 修改 .github/zk-videos-release.txt 并推送时生成 GitHub Release（中考视频专用，与高考、四六级、专八的发布流程分开）：
# 第一行写标签名（10 篇一批：男声 zk-m01 = z01—z10，zk-m02 = z11—z20，zk-m03 = z21—z30，zk-m04 = z31—z40；女声的 zk-01 已发布、保留）；第 2 行起逐行列出 中考/最终视频/ 下要发布的 MP4 文件名
# 发布内容：一个打包好的 zip（GitHub 会把附件名里的中文和空格改掉，所以只发 zip，压缩包里保留完整中文文件名）
name: 发布中考视频
on:
  push:
    paths: ['.github/zk-videos-release.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包视频
        run: |
          set -e
          tag=$(head -1 .github/zk-videos-release.txt | tr -d '[:space:]')
          mapfile -t files < <(tail -n +2 .github/zk-videos-release.txt | sed '/^[[:space:]]*$/d')
          [ ${#files[@]} -gt 0 ] || { echo "没有列出视频"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "中考/最终视频/$f" ] || { echo "找不到：$f"; exit 1; }
          done
          n=${#files[@]}
          # 标签 zk-m01、zk-m02 … 是男声版（用户 2026-10-14 改用四六级男声；女声的 zk-01 保留不动）
          if [[ "$tag" == zk-m* ]]; then VOICE_TXT="男声（四六级同款）"; else VOICE_TXT="女声"; fi
          zipname="ZHONGKAO-reading-videos-${tag}.zip"
          (cd 中考/最终视频 && zip -0 -q "../../${zipname}" "${files[@]}")
          unzip -l "${zipname}" | tail -1
          {
            echo "中考英语阅读理解逐句精读视频（适合初中生背单词：每句英文 + 中文翻译 + 生词编号注释），本次共 ${n} 个。"
            echo
            echo "4K（3840×2160）、30 帧/秒，${VOICE_TXT}朗读（已去除电磁音），中文翻译 + 生词编号注释；句与句之间停顿 0.8 秒。"
            echo
            echo "下载下面的 \`${zipname}\`，解压即可。"
            echo
            echo "每个视频都通过了全部核查（无电磁音、分辨率、流畅度、声画等长、片头/结尾静音、句间停顿、响度一致、朗读与画面逐句一致），核查报告见仓库 \`中考/核查报告.md\`。"
            echo
            echo "| # | 文件名 |"
            echo "|---|---|"
            i=0; for f in "${files[@]}"; do i=$((i+1)); echo "| $i | $f |"; done
          } > notes.md
          echo "ZIPNAME=${zipname}" >> "$GITHUB_ENV"
          echo "N=${n}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          no=${tag#zk-}
          if [[ "$tag" == zk-m* ]]; then no="（男声）${tag#zk-m}"; fi
          echo "NO=${no}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 中考英语阅读精读视频 ${{ env.NO }}（${{ env.N }} 个）
          body_path: notes.md
          files: ${{ env.ZIPNAME }}
