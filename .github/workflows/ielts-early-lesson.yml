name: 雅思早期册单篇教学定稿与成片
on:
  workflow_call:
    inputs:
      lesson:
        required: true
        type: string
      aiden_batch:
        type: string
        default: ''
      current_tools:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  master:
    concurrency:
      group: ielts-early-lesson-${{ inputs.lesson }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IELTS_LESSON: ${{ inputs.lesson }}
      STAGING: ${{ inputs.aiden_batch && format('ielts-academic-aiden-cache-{0}', inputs.aiden_batch) || 'ielts-academic-cache-10-1' }}
      IELTS_NARRATOR: ${{ inputs.aiden_batch && 'Aiden' || '' }}
      IELTS_AIDEN_BATCH: ${{ inputs.aiden_batch }}
      MALLOC_ARENA_MAX: '2'
      HF_HUB_DISABLE_XET: '1'
      TARGET: 雅思/学术阅读
      OMP_NUM_THREADS: 3
      OPENBLAS_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_tools && 'codex/ielts-academic-reading' || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /雅思/学术阅读/
            /tools/video/
            /tools/tts/
            /专八/tools/
            /六级/tools/
            /四级/tools/
            /中考/tools/画面核查/
      - name: 核对本篇的原稿版本和现成视频
        id: cache
        run: |
          set -euo pipefail
          export IELTS_WORK="$RUNNER_TEMP/early"
          mkdir -p "$IELTS_WORK"
          echo "IELTS_WORK=$IELTS_WORK" >> "$GITHUB_ENV"
          echo "IELTS_TOOL_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -n "$IELTS_AIDEN_BATCH" && "$IELTS_LESSON" =~ ^C1[123]T ]]; then
            echo 'early=false' >> "$GITHUB_OUTPUT"
            python -c 'import os,sys;from pathlib import Path;p=Path(os.environ["TARGET"]);sys.path.insert(0,str(p/"tools"));from submit_reviewed import approved;from material import verify_original;pid=os.environ["IELTS_LESSON"];approved(p/"篇目"/pid);verify_original(p,pid)'
            echo 'teaching=true' >> "$GITHUB_OUTPUT"
            echo "done=$(python "$TARGET/tools/aiden_batch.py" cached "$IELTS_AIDEN_BATCH" --lesson "$IELTS_LESSON")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'early=true' >> "$GITHUB_OUTPUT"
          python "$TARGET/tools/early_plan.py" sync-notes
          if [[ -n "$IELTS_AIDEN_BATCH" ]]; then
            done_master=$(python "$TARGET/tools/aiden_batch.py" cached "$IELTS_AIDEN_BATCH" --lesson "$IELTS_LESSON")
          else
            done_master=$(python "$TARGET/tools/early_plan.py" cached)
          fi
          echo "done=$done_master" >> "$GITHUB_OUTPUT"
          if [[ "$done_master" != true ]]; then
            saved=$(python "$TARGET/tools/early_editor.py" restore)
            echo "teaching=$saved" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cache.outputs.done != 'true' && steps.cache.outputs.teaching != 'true'
        uses: ./.github/actions/ielts-local-editor
      - name: 恢复试听版的固定 Aiden 模型
        if: inputs.aiden_batch != '' && steps.cache.outputs.done != 'true'
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ielts-aiden-model
          key: ielts-aiden-audition-${{ hashFiles('雅思/学术阅读/tools/aiden-model-lock.json') }}
      - name: 按原版清单校验 Aiden 模型和语音分词器
        if: inputs.aiden_batch != '' && steps.cache.outputs.done != 'true'
        run: |
          python "$TARGET/tools/aiden_model.py" "$RUNNER_TEMP/ielts-aiden-model"
          echo "IELTS_AIDEN_MODEL_PATH=$RUNNER_TEMP/ielts-aiden-model" >> "$GITHUB_ENV"
      - name: 保存通过原版校验的模型供下次使用
        if: inputs.aiden_batch != '' && steps.cache.outputs.done != 'true' && steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ielts-aiden-model
          key: ${{ steps.model_cache.outputs.cache-primary-key }}
      - if: steps.cache.outputs.done != 'true' && steps.cache.outputs.teaching != 'true'
        uses: ./.github/actions/ielts-translation
      - name: 逐句翻译、筛选适合背记的词与搭配，再对照原书校订
        if: steps.cache.outputs.done != 'true' && steps.cache.outputs.teaching != 'true'
        run: |
          set -euo pipefail
          bash .github/run-ielts-editors.sh python -u "$TARGET/tools/early_editor.py" edit 2>&1 | tee "$IELTS_WORK/editor.log"
      - if: steps.cache.outputs.done != 'true'
        uses: ./.github/actions/ielts-verified-master
        with:
          early_review: ${{ steps.cache.outputs.early }}
      - name: 存档已完成的逐句工作和待修处
        if: failure() && env.IELTS_WORK != '' && steps.cache.outputs.early == 'true'
        run: |
          python "$TARGET/tools/early_editor.py" checkpoint
          python "$TARGET/tools/early_plan.py" diagnosis
      - name: 保存样片的逐句录音与原始检查记录
        if: failure() && inputs.aiden_batch != '' && env.IELTS_WORK != ''
        uses: actions/upload-artifact@v4
        with:
          name: aiden-${{ inputs.lesson }}-checks-${{ github.run_attempt }}
          path: |
            ${{ env.IELTS_WORK }}/native-*.log
            ${{ env.IELTS_WORK }}/aiden-takes
          retention-days: 14
          if-no-files-found: ignore
