name: 剑桥雅思学术阅读整批发布
on:
  workflow_call:
    inputs:
      part:
        type: string
        required: true
      source_revision:
        type: string
        required: true
  push:
    branches: ['codex/ielts-academic-reading']
    paths: ['.github/ielts-release-plan.json']
concurrency:
  group: ielts-academic-collection-${{ inputs.part || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      books: ${{ steps.plan.outputs.books }}
      mode: ${{ steps.plan.outputs.mode }}
      part: ${{ steps.plan.outputs.part }}
      source_revision: ${{ steps.plan.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /雅思/学术阅读/tools/editions.py
      - id: plan
        env:
          SELECTED_PART: ${{ inputs.part }}
          REQUESTED_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          part="$SELECTED_PART"
          mode=publish
          if [[ -z "$part" ]]; then
            part=$(jq -r .part .github/ielts-release-plan.json)
            mode=$(jq -r '.mode // "publish"' .github/ielts-release-plan.json)
          fi
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "source_revision=$revision" >> "$GITHUB_OUTPUT"
          books=$(python '雅思/学术阅读/tools/editions.py' books "$part")
          case "$mode" in
            prepare) [[ "$part" == "21-11" ]]; books=$(jq -c 'map(select(. < 21))' <<< "$books") ;;
            publish) ;;
            *) exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "books=$books" >> "$GITHUB_OUTPUT"
          tag="ielts-academic-reading-$part"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$revision" --draft --title "剑桥雅思学术阅读第 ${part/-/ 至 } 册 · 4K 精读视频与逐屏讲义" --notes '正在核验完整批次。'
  book:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        n: ${{ fromJSON(needs.select.outputs.books) }}
    env:
      PART: ${{ needs.select.outputs.part }}
      IELTS_SOURCE_REV: ${{ needs.select.outputs.source_revision }}
      BOOK: ${{ matrix.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          ref: ${{ needs.select.outputs.source_revision }}
          sparse-checkout: 雅思/学术阅读
      - run: |
          set -euo pipefail
          out="$RUNNER_TEMP/book"
          reuse=$(python '雅思/学术阅读/tools/collect_edition.py' reuse "$out" --part "$PART" --book "$BOOK")
          if [[ "$reuse" == true ]]; then exit 0; fi
          python '雅思/学术阅读/tools/collect_edition.py' book "$out" --part "$PART" --book "$BOOK"
          gh release upload "ielts-academic-reading-$PART" "$out"/*.zip --clobber
          group=$(python '雅思/学术阅读/tools/editions.py' group "$BOOK")
          for f in "$out"/*.zip; do
            gh release download "ielts-academic-reading-$PART" -p "$(basename "$f")" -D "$RUNNER_TEMP/back"
            cmp "$f" "$RUNNER_TEMP/back/$(basename "$f")"
            rm "$RUNNER_TEMP/back/$(basename "$f")"
          done
          gh release upload "ielts-academic-cache-$group" "$out/book-$BOOK-index.json" --clobber
  publish:
    needs: [select,book]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    env:
      PART: ${{ needs.select.outputs.part }}
      IELTS_SOURCE_REV: ${{ needs.select.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          ref: ${{ needs.select.outputs.source_revision }}
          sparse-checkout: 雅思/学术阅读
      - run: python '雅思/学术阅读/tools/collect_edition.py' publish "$RUNNER_TEMP/publish" --part "$PART"
