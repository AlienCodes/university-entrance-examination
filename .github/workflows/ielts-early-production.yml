name: 剑桥雅思学术阅读第10至1册精读视频
on:
  push:
    branches: ['codex/ielts-academic-reading']
    paths: ['.github/ielts-early-production.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: ielts-academic-early-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      samples: ${{ steps.select.outputs.samples }}
      lessons: ${{ steps.select.outputs.lessons }}
      current_tools: ${{ steps.select.outputs.current_tools }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读/原稿
            雅思/学术阅读/备课
            雅思/学术阅读/审校
            雅思/学术阅读/配套讲义
            雅思/学术阅读/tools
      - id: select
        run: |
          set -euo pipefail
          python '雅思/学术阅读/tools/early_plan.py' plan
          tag=ielts-academic-cache-10-1
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title '剑桥雅思学术阅读第10至1册 · 逐篇母版' --notes '按篇保存核验通过的 4K 视频和制作记录，供整包恢复使用。'
  sample:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lesson: ${{ fromJSON(needs.plan.outputs.samples) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      current_tools: ${{ needs.plan.outputs.current_tools == 'true' }}
  schedule:
    needs: [plan,sample]
    runs-on: ubuntu-24.04
    outputs:
      immediate: ${{ steps.slots.outputs.immediate }}
      deferred: ${{ steps.slots.outputs.deferred }}
      immediate_limit: ${{ steps.slots.outputs.immediate_limit }}
      deferred_limit: ${{ steps.slots.outputs.deferred_limit }}
      current_tools: ${{ needs.plan.outputs.current_tools }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IELTS_REMAINING: ${{ needs.plan.outputs.lessons }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读/tools
      - id: slots
        run: python '雅思/学术阅读/tools/early_plan.py' admit

  production:
    needs: schedule
    if: needs.schedule.outputs.immediate != '[]'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.schedule.outputs.immediate_limit) }}
      matrix:
        lesson: ${{ fromJSON(needs.schedule.outputs.immediate) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      current_tools: ${{ needs.schedule.outputs.current_tools == 'true' }}

  wait:
    needs: schedule
    if: needs.schedule.outputs.deferred != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读/tools
      - run: python '雅思/学术阅读/tools/early_plan.py' wait

  deferred:
    needs: [schedule,wait]
    if: needs.schedule.outputs.deferred != '[]'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.schedule.outputs.deferred_limit) }}
      matrix:
        lesson: ${{ fromJSON(needs.schedule.outputs.deferred) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      current_tools: ${{ needs.schedule.outputs.current_tools == 'true' }}

  delivery:
    needs: [plan,sample,schedule,production,wait,deferred]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.sample.result == 'success' &&
      needs.schedule.result == 'success' && (needs.production.result == 'success' || needs.production.result == 'skipped') &&
      (needs.wait.result == 'success' || needs.wait.result == 'skipped') &&
      (needs.deferred.result == 'success' || needs.deferred.result == 'skipped')
    uses: ./.github/workflows/ielts-early-delivery.yml
