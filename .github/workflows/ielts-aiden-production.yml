name: 剑桥雅思 Aiden 精读视频
on:
  push:
    branches: [codex/ielts-academic-reading]
    paths: ['.github/ielts-aiden-batch.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ielts-aiden-production
  cancel-in-progress: false
jobs:
  specification:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      batch: ${{ steps.read.outputs.batch }}
      certified_audio: ${{ steps.read.outputs.certified_audio }}
      pilot_only: ${{ steps.read.outputs.pilot_only }}
      repair_lessons: ${{ steps.read.outputs.repair_lessons }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
            六级/tools
            tools/tts
      - id: read
        run: |
          set -euo pipefail
          file=.github/ielts-aiden-batch.json
          jq -e '.speaker=="Aiden" and (.batch=="13-6" or .batch=="5-1")' "$file" >/dev/null
          echo "batch=$(jq -r .batch "$file")" >> "$GITHUB_OUTPUT"
          repair=$(jq -ce '
            (.repair_lessons // []) as $ids |
            if ($ids | type) == "array" and ($ids | length) == ($ids | unique | length)
               and all($ids[]; type == "string" and test("^C(1[0-3]|[6-9])T[1-4]P[1-3]$"))
               and (($ids | length) == 0 or (.batch == "13-6" and (.pilot_only != true) and (.certified_audio != true)))
            then $ids else error("Invalid list of individual lessons to repair") end
          ' "$file")
          echo "repair_lessons=$repair" >> "$GITHUB_OUTPUT"
          for option in certified_audio pilot_only; do
            echo "$option=$(jq -r --arg k "$option" '.[$k] // false' "$file")" >> "$GITHUB_OUTPUT"
          done
      - name: 等待本批指定的首篇认证音轨
        if: steps.read.outputs.certified_audio == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IELTS_NARRATOR: Aiden
          IELTS_AIDEN_BATCH: ${{ steps.read.outputs.batch }}
        run: |
          set -euo pipefail
          export IELTS_LESSON="C${IELTS_AIDEN_BATCH%-*}T1P1"
          while [[ "$(python '雅思/学术阅读/tools/aiden_parallel.py' have)" != true ]]; do
            sleep 45
          done
  edition:
    needs: specification
    if: needs.specification.outputs.repair_lessons == '[]'
    uses: ./.github/workflows/ielts-aiden-edition.yml
    with:
      batch: ${{ needs.specification.outputs.batch }}
      certified_audio: ${{ needs.specification.outputs.certified_audio == 'true' }}
      pilot_only: ${{ needs.specification.outputs.pilot_only == 'true' }}

  repair:
    needs: specification
    if: needs.specification.outputs.repair_lessons != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lesson: ${{ fromJSON(needs.specification.outputs.repair_lessons) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      aiden_batch: ${{ needs.specification.outputs.batch }}
      current_tools: true
