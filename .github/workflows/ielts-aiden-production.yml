name: 剑桥雅思 Aiden 精读视频
on:
  push:
    branches: [codex/ielts-academic-reading]
    paths: ['.github/ielts-aiden-batch.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ielts-aiden-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      IELTS_NARRATOR: Aiden
    outputs:
      batch: ${{ steps.queue.outputs.batch }}
      pilot: ${{ steps.queue.outputs.pilot }}
      remaining: ${{ steps.queue.outputs.remaining }}
      pilot_only: ${{ steps.queue.outputs.pilot_only }}
      certified_audio: ${{ steps.queue.outputs.certified_audio }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
      - id: queue
        run: |
          batch=$(jq -er .batch .github/ielts-aiden-batch.json)
          echo "pilot_only=$(jq -r '.pilot_only // false' .github/ielts-aiden-batch.json)" >> "$GITHUB_OUTPUT"
          echo "certified_audio=$(jq -r '.certified_audio // false' .github/ielts-aiden-batch.json)" >> "$GITHUB_OUTPUT"
          python '雅思/学术阅读/tools/aiden_batch.py' plan "$batch"
  pilot:
    needs: plan
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ needs.plan.outputs.pilot }}
      aiden_batch: ${{ needs.plan.outputs.batch }}
      verified_audio_only: ${{ needs.plan.outputs.certified_audio == 'true' }}
  preview:
    needs: [plan, pilot]
    if: needs.plan.outputs.pilot_only == 'true' || needs.plan.outputs.batch == '13-6'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IELTS_NARRATOR: Aiden
      IELTS_LESSON: ${{ needs.plan.outputs.pilot }}
      IELTS_AIDEN_BATCH: ${{ needs.plan.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: 雅思/学术阅读
      - name: 发布单个 MP4 并从公开链接回下载整片
        run: python '雅思/学术阅读/tools/aiden_preview.py' "$RUNNER_TEMP/preview"
  production:
    needs: [plan, pilot, preview]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.pilot.result == 'success' &&
      (needs.preview.result == 'success' || (needs.plan.outputs.batch != '13-6' && needs.preview.result == 'skipped')) &&
      needs.plan.outputs.pilot_only != 'true' && needs.plan.outputs.remaining != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lesson: ${{ fromJSON(needs.plan.outputs.remaining) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      aiden_batch: ${{ needs.plan.outputs.batch }}
