# 高考听力 视频版真题考试：推送 .github/gaokao-listening-render.txt（每行一个套号）时：
#   precheck（第一道关）：每套 题目 → 时间轴 → 版式 → 自检 → 只查音频；任何一套不过，render 不开工（踩坑 122）
#   render：每套一台机器：时间轴 → 版式 → 自检 → 截图（排版 + 题间空隙 + 字体回退 + 答案泄露）→ 试跑 → 编码（专八引擎成品核查，原音逐样本比对）
#   publish：全部套齐了才发布 Release gaokao-listening（ASCII 资产名 + 中文标签 + 中文名 zip，目标用分支名，踩坑 53、123）
# 由 render-cet4-listening.yml 复制改成高考（高考听力/tools/听力视频.py；原音从老师 Release gaokao-listening-raw 的 default.zip 取，取原音.py 核 sha256）。
# 同时运行 ≤ 10 个任务（总协调）；浏览器 Chrome 153（本机样片同一版本，踩坑 78）；runs-on 固定 ubuntu-24.04（踩坑 117）。
name: 高考听力练习视频
on:
  push:
    branches: ['**']  # 文件清单只由分支提交触发，创建原音/成品Release标签不启动旧任务
    paths: ['.github/gaokao-listening-render.txt']
permissions:
  contents: write
  actions: read
jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.l.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - id: l
        run: echo "ids=$(grep -v '^\s*$' .github/gaokao-listening-render.txt | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin]))')" >> "$GITHUB_OUTPUT"
  precheck:
    needs: list
    if: needs.list.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: ${{ fromJson(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            高考听力
            专八/听力/tools
            专八/听力/2025
            六级/听力/tools/听力视频.py
            四级/tools/fonts
            专八/真题/2025年 英语专业八级真题.pdf
            tools/题目间隔.py
      - uses: ./.github/actions/cet6-chalk-env
        with: {asr: 'false', browser: '153'}
      - name: 字体（原卷 PDF）
        run: |
          /opt/ttsenv/bin/pip install -q --disable-pip-version-check pypdf==6.21.4 fonttools==4.68.0 cryptography==50.0.2
          /opt/ttsenv/bin/python 专八/听力/tools/取字体.py
      - name: 取原音、核 sha256
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 -I 高考听力/tools/取原音.py ${{ matrix.id }} in/gk.mp3
          rm -f /tmp/gaokao-default.zip
      - name: 预检：时间轴 → 版式 → 自检 → 只查音频（不截图、不编码）；时间轴必须与仓库里的逐字节相同
        env: {GK_OUT: '${{ runner.temp }}/out'}
        run: |
          set -euo pipefail
          P=/opt/ttsenv/bin/python; T=高考听力/tools/听力视频.py; S=${{ matrix.id }}
          $P $T $S timeline in/gk.mp3
          git diff --exit-code -- 高考听力/数据/$S/时间轴.json
          $P $T $S layout
          $P $T $S --自检
          $P $T $S audio in/gk.mp3
  render:
    needs: [list, precheck]
    if: needs.list.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: ${{ fromJson(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            高考听力
            专八/听力/tools
            专八/听力/2025
            六级/听力/tools/听力视频.py
            四级/tools/fonts
            专八/真题/2025年 英语专业八级真题.pdf
            tools/题目间隔.py
      - uses: ./.github/actions/cet6-chalk-env
        with: {asr: 'false', browser: '153'}
      - name: 字体（原卷 PDF）
        run: |
          /opt/ttsenv/bin/pip install -q --disable-pip-version-check pypdf==6.21.4 fonttools==4.68.0 cryptography==50.0.2
          /opt/ttsenv/bin/python 专八/听力/tools/取字体.py
      - name: 取原音、核 sha256
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 -I 高考听力/tools/取原音.py ${{ matrix.id }} in/gk.mp3
          rm -f /tmp/gaokao-default.zip
      - name: 时间轴 → 版式 → 自检 → 截图 → 试跑 → 编码（出错即停）
        env: {GK_OUT: '${{ runner.temp }}/out'}
        run: |
          set -euo pipefail
          P=/opt/ttsenv/bin/python; T=高考听力/tools/听力视频.py; S=${{ matrix.id }}
          $P $T $S timeline in/gk.mp3
          git diff --exit-code -- 高考听力/数据/$S/时间轴.json
          $P $T $S layout
          $P $T $S --自检
          $P $T $S stills
          $P $T $S video in/gk.mp3 --试跑
          $P $T $S video in/gk.mp3
          mkdir -p up
          mv "$GK_OUT"/*考试.mp4 up/
          cp 高考听力/数据/$S/时间轴.json up/
          $P - "$S" <<'PY'
          import hashlib, json, sys, pathlib
          up = pathlib.Path('up'); sid = sys.argv[1]
          h = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          mp4 = next(up.glob('*.mp4'))
          json.dump({'套': sid, 'kind': 'exam', 'mp4': mp4.name, 'mp4_sha256': h(mp4), 'mp4_bytes': mp4.stat().st_size,
                     '原音_sha256': h(pathlib.Path('in/gk.mp3'))}, open(up / 'meta.json', 'w'), ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'gklisten-${{ matrix.id }}', path: up, compression-level: 0}
  publish:
    needs: [list, render]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            高考听力/tools
            高考听力/套.json
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {path: art, pattern: 'gklisten-*'}
      - name: 收之前运行里已通过的视频（.github/gaokao-listening-collect.txt 每行一个运行号；本次有的不覆盖）
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p art
          for rid in $(grep -v '^\s*$' .github/gaokao-listening-collect.txt 2>/dev/null || true); do
            for n in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name' | grep -E '^gklisten-'); do
              [ -d "art/$n" ] && continue
              gh run download "$rid" -R "$GITHUB_REPOSITORY" -n "$n" -D "art/$n"; echo "收 $rid / $n"
            done
          done
      - name: 核对齐全（.github/gaokao-listening-all.txt）、发布、下载核对
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 .github/gaokao-listening-publish.py --自检
          python3 .github/gaokao-listening-publish.py plan exam "$(python3 -c 'import json,sys;print(json.dumps([l.strip() for l in open(".github/gaokao-listening-all.txt") if l.strip()]))')" art up
          TAG=gaokao-listening
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --target "$GITHUB_REF_NAME" -t "高考英语听力 视频版真题考试" -n "见下方说明"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > rel.json
          python3 .github/gaokao-listening-publish.py relabel up/plan.json rel.json | while IFS=$'\t' read -r aid label; do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$aid" -f "label=$label" >/dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > rel.json
          python3 .github/gaokao-listening-publish.py todo up/plan.json rel.json | while IFS=$'\t' read -r a l; do
            gh release upload $TAG "up/$a#$l" --clobber; echo "上传 $a"
          done
          gh release upload $TAG up/gaokao-listening-filenames.txt --clobber
          python3 .github/gaokao-listening-publish.py notes up/plan.json notes.md
          gh release edit $TAG -t "高考英语真题 视频版考试（50套）" --notes-file notes.md
          python3 .github/gaokao-listening-publish.py pack up/plan.json .
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > rel.json
          for z in $(python3 .github/gaokao-listening-publish.py zips up/plan.json); do
            d=$(python3 -c "import json,sys;print(next((a.get('digest') or '' for a in json.load(open('rel.json'))['assets'] if a['name']==sys.argv[1]),''))" $z)
            [ "$d" = "sha256:$(sha256sum $z | cut -d' ' -f1)" ] && echo "已在 $z" || { gh release upload $TAG $z --clobber; echo "上传 $z"; }
            rm -f $z; mkdir -p zchk
            gh release download $TAG -p $z -D zchk --clobber
            python3 .github/gaokao-listening-publish.py checkzip up/plan.json zchk/$z
            rm -f zchk/$z
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > rel.json
          python3 .github/gaokao-listening-publish.py verify-digest up/plan.json rel.json
