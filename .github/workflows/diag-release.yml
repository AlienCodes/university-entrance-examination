# 诊断：GITHUB_TOKEN 建 Release 为什么 403（六级黑板发布 2026-10-17 两次 403，令牌显示 Contents: write）。
# 推送 .github/diag-release.txt 触发。第 1 轮（权限、草稿、标签、正式 Release）全部成功 → 第 2 轮照原样重现发布命令：
#   F 与发布任务完全相同的 gh release create（同标题、同说明、带附件、--target 本提交），换一个诊断标签
#   G 真实标签名 cet6-chalk + 同标题同说明，只建草稿（草稿不建标签）
#   H 同 G，target 换成失败那次运行的提交 278c9bc
# 本任务建出来的东西当场删掉。
name: 诊断 Release 权限
on:
  push:
    paths: ['.github/diag-release.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', R: '${{ github.repository }}'}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: 照原样重现
        run: |
          gh --version | head -1
          t="diag-${GITHUB_RUN_ID}"
          title="六级仔细阅读精读视频 · 教室黑板大字版（60 个）"
          head -c 1048576 /dev/urandom > CET6-chalkboard-videos-part1-of-3.zip
          echo "=== F gh release create（同标题、同说明、带附件、--target 本提交）"
          if gh release create "$t-f" CET6-chalkboard-videos-part1-of-3.zip --target "$GITHUB_SHA" --title "$title" --notes-file .github/diag-notes.md; then
            echo "F 成功"; gh release delete "$t-f" -y --cleanup-tag && echo "已删 $t-f"; else echo "F 失败 rc=$?"; fi
          for v in "G $GITHUB_SHA" "H 278c9bc241509168da670cac3921baa87e306e70"; do
            set -- $v
            echo "=== $1 草稿 tag=cet6-chalk target=$2 同标题同说明"
            if out=$(gh api -X POST "repos/$R/releases" -f tag_name=cet6-chalk -f target_commitish="$2" -f name="$title" -F body=@.github/diag-notes.md -F draft=true 2>&1); then
              echo "$1 成功"; gh api -X DELETE "repos/$R/releases/$(echo "$out" | jq -r .id)" && echo "已删草稿"
            else echo "$1 失败：$(echo "$out" | head -c 400)"; fi
          done
          echo "=== 结束"
