name: 剑桥雅思学术阅读译文与语境词汇初校
on:
  push:
    branches: ['codex/ielts-academic-reading']
    paths: ['.github/ielts-series-text.json']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      units: ${{ steps.plan.outputs.units }}
      tag: ${{ steps.plan.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读/原稿
      - id: plan
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          q=json.loads(Path('.github/ielts-series-text.json').read_text())
          assert q['part'] in ['20-11','10-1'] and len(q['lessons'])==len(set(q['lessons']))
          for pid in q['lessons']:
              m=re.fullmatch(r'C(\d+)T[1-4]P[1-3]',pid)
              assert m and (11<=int(m[1])<=20 if q['part']=='20-11' else 1<=int(m[1])<=10)
              assert (Path('雅思/学术阅读/原稿')/(pid+'.json')).is_file()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('units='+json.dumps(q['lessons']),file=f)
              print('tag=ielts-academic-editorial-'+q['part'],file=f)
          PY
          tag="ielts-academic-editorial-$(jq -r .part .github/ielts-series-text.json)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_REF_NAME" --prerelease --title "剑桥雅思学术阅读 · 教辅初校存档" --notes '初稿与检查结果，复核后进入视频制作。'
      - uses: ./.github/actions/ielts-local-editor
  draft:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    strategy:
      max-parallel: 18
      fail-fast: false
      matrix:
        lesson: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      PID: ${{ matrix.lesson }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
      - uses: ./.github/actions/ielts-local-editor
      - name: 在运行器上离线起草与独立上下文复读
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$(dirname "$IELTS_EDITOR_BIN"):${LD_LIBRARY_PATH:-}"
          "$IELTS_EDITOR_BIN" -m "$IELTS_EDITOR_MODEL" -t 4 -c 10000 -np 1 -ngl 0 --host 127.0.0.1 --port 8123 --log-disable > "$RUNNER_TEMP/llama.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8123/health >/dev/null; then break; fi
            if ! kill -0 "$server"; then tail -50 "$RUNNER_TEMP/llama.log"; exit 1; fi
            sleep 2
          done
          python -u '雅思/学术阅读/tools/draft_lesson.py' "雅思/学术阅读/原稿/$PID.json" "$RUNNER_TEMP/$PID"
          cd "$RUNNER_TEMP"
          python -m zipfile -c "$PID-draft.zip" "$PID"
          gh release upload "$TAG" "$PID-draft.zip" --clobber
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-${{ matrix.lesson }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.lesson }}/*.json
            ${{ runner.temp }}/llama.log
          if-no-files-found: ignore
