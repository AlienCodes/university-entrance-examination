name: 剑桥雅思学术阅读译文与语境词汇初校
on:
  push:
    branches: ['codex/ielts-academic-reading']
    paths: ['.github/ielts-series-text.json']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      units: ${{ steps.plan.outputs.units }}
      tag: ${{ steps.plan.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读/原稿
            雅思/学术阅读/备课
            雅思/学术阅读/来源/第21册
            雅思/学术阅读/tools
      - id: plan
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'雅思/学术阅读/tools')
          from editions import validate_lessons
          q=json.loads(Path('.github/ielts-series-text.json').read_text())
          validate_lessons(q['part'],q['lessons'])
          for pid in q['lessons']:
              source=json.loads((Path('雅思/学术阅读/原稿')/(pid+'.json')).read_text())
              if source.get('passage_provenance',{}).get('kind')=='docx':
                  import hashlib
                  original=Path('雅思/学术阅读/来源')/f"第{source['book']}册"
                  evidence=json.loads((original/'核对'/(pid+'.json')).read_text())
                  assert evidence['id']==pid and evidence['source_sha256']==source['source_sha256']
                  assert source['source_sha256']==hashlib.sha256((original/evidence['source_file']).read_bytes()).hexdigest()
                  assert evidence['sentence_counts_after']==list(map(len,source['paragraphs']))
              else:
                  assert source.get('source_status','').startswith('已逐篇')
              notes=json.loads((Path('雅思/学术阅读/备课')/(pid+'.json')).read_text())
              assert [s for group in source['paragraphs'] for s in group]==[row['en'] for row in notes['rows']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('units='+json.dumps(q['lessons']),file=f)
              print('tag=ielts-academic-editorial-'+q['part'],file=f)
          PY
          tag="ielts-academic-editorial-$(jq -r .part .github/ielts-series-text.json)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_REF_NAME" --prerelease --title "剑桥雅思学术阅读 · 教辅初校存档" --notes '初稿与检查结果，复核后进入视频制作。'
      - uses: ./.github/actions/ielts-local-editor
      - uses: ./.github/actions/ielts-translation
      - name: 验证两种独立模型能区分专业词义并生成齐全的逐词释义
        run: bash .github/run-ielts-editors.sh python -u '雅思/学术阅读/tools/editor_sample.py'
  draft:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 275
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        lesson: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      PID: ${{ matrix.lesson }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
      - uses: ./.github/actions/ielts-local-editor
      - uses: ./.github/actions/ielts-translation
      - name: 在运行器上离线起草与独立上下文复读
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/$PID"
          src=$(sha256sum "雅思/学术阅读/原稿/$PID.json" | cut -c1-16)
          for checkpoint in translation-progress draft-progress; do
            saved="$PID-$src-$checkpoint.json"
            python '雅思/学术阅读/tools/release_assets.py' "$TAG" "$saved" "$RUNNER_TEMP" --if-present
            if [[ -s "$RUNNER_TEMP/$saved" ]]; then cp "$RUNNER_TEMP/$saved" "$RUNNER_TEMP/$PID/$checkpoint.json"; fi
          done
          bash .github/run-ielts-editors.sh python -u '雅思/学术阅读/tools/draft_lesson.py' "雅思/学术阅读/原稿/$PID.json" "$RUNNER_TEMP/$PID"
          cd "$RUNNER_TEMP"
          python -m zipfile -c "$PID-draft.zip" "$PID"
          gh release upload "$TAG" "$PID-draft.zip" --clobber
      - if: failure()
        name: 按原稿版本保存可恢复的审校进度
        run: |
          src=$(sha256sum "雅思/学术阅读/原稿/$PID.json" | cut -c1-16)
          for key in translation-progress draft-progress; do
            f="$RUNNER_TEMP/$PID/$key.json"
            if test -s "$f"; then
              save="$RUNNER_TEMP/$PID-$src-$key.json"
              cp "$f" "$save"
              gh release upload "$TAG" "$save" --clobber
            fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-${{ matrix.lesson }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.lesson }}/*.json
            ${{ runner.temp }}/llama.log
          if-no-files-found: ignore
