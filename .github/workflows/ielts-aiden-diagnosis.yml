name: 诊断 Aiden 样片的实际朗读与核对耗时
on:
  push:
    branches: [codex/ielts-academic-reading]
    paths: ['.github/ielts-aiden-diagnosis.json']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.sample.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          filter: blob:none
      - id: sample
        run: |
          jq -erc '. as $request | (.cases // [$request.numbers[] | {lesson: $request.lesson, number: .}])
            | "matrix=" + ({include: .} | tojson)' .github/ielts-aiden-diagnosis.json >> "$GITHUB_OUTPUT"
  sentence:
    name: sentence (${{ matrix.lesson }}, ${{ matrix.number }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: 雅思/学术阅读
      GH_TOKEN: ${{ github.token }}
      IELTS_NARRATOR: Aiden
      IELTS_LESSON: ${{ matrix.lesson }}
      MALLOC_ARENA_MAX: '2'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: 3
      OPENBLAS_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      NUMBER: ${{ matrix.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
            tools/tts
            六级/tools
            四级/tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: 恢复已核验的 Aiden 权重
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ielts-aiden-model
          key: ielts-aiden-audition-${{ hashFiles('雅思/学术阅读/tools/aiden-model-lock.json') }}
      - name: 确认试听版全部权重
        run: python "$TARGET/tools/aiden_model.py" "$RUNNER_TEMP/ielts-aiden-model"
      - name: 恢复逐句听对模型
        id: asr
        uses: actions/cache/restore@v4
        with:
          path: tools/tts/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          key: asr-sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
      - name: 补齐缺失的识别器
        if: steps.asr.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/tts/models
          curl -fsSL --retry 5 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2 | tar xj -C tools/tts/models
      - name: 安装与正式视频相同的 CPU 运行环境
        run: bash .github/install-ielts-native-speech.sh
      - uses: ./.github/actions/ielts-phrase-listening
      - name: 分别实测整句朗读、语音识别和按意群补读
        run: |
          export IELTS_AIDEN_MODEL_PATH="$RUNNER_TEMP/ielts-aiden-model"
          export IELTS_WORK="$RUNNER_TEMP/diagnosis"
          mkdir -p "$IELTS_WORK"
          STAGING=ielts-academic-aiden-cache-13-6 python "$TARGET/tools/aiden_checkpoint.py"
          "$RUNNER_TEMP/speech/bin/python" -u "$TARGET/tools/measure_aiden_sentence.py" "$NUMBER" "$IELTS_WORK/$IELTS_LESSON-$NUMBER.json" --keep-rendered
      - name: 保存耗时及可复用录音
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiden-measured-${{ env.IELTS_LESSON }}-${{ matrix.number }}
          path: ${{ runner.temp }}/diagnosis
          retention-days: 14
          if-no-files-found: ignore
