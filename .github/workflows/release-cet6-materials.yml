# 六级学习资料发布（用户 2026-10-21）：修改 .github/cet6-materials-release.txt（第一行写标签名，如 cet6-materials-60）并推送时，
# 把 六级/听写卡/ 下每篇一个文件夹（0 逐句精读 + 1 汉译英 + 2 英译汉 + 3 文章填空 + 4 长难句分析，共 5 份 PDF，本机生成后入库）加上该篇的朗读音频，
# 用 Python zipfile 打包（踩坑 52：中文文件名要有 UTF-8 标记）、逐个核对，发布 GitHub Release（gh，目标用分支名：踩坑 53）。顺序与六级黑板视频相同：s01 → s60。
name: 发布六级学习资料压缩包
on:
  push:
    paths: ['.github/cet6-materials-release.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            六级/听写卡
            六级/audio
            六级/data
      - name: Release 目标检查（踩坑 53）
        run: python3 .github/check-release-target.py
      - name: 组装文件夹、打包、逐个核对
        run: |
          set -e
          tag=$(head -1 .github/cet6-materials-release.txt | tr -d '[:space:]')
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          export TAG="${tag}"            # 同一步里后面的 Python 也要用（$GITHUB_ENV 只对后面的步骤生效）
          python3 - <<'PY'
          import json, os, shutil, zipfile
          from pathlib import Path
          D = [p for p in json.load(open('六级/data/vocab.json', encoding='utf-8'))['passages'] if p.get('done')]
          T = json.load(open('六级/audio/timings.json', encoding='utf-8'))['cet4_male']
          root = '六级阅读真题60篇学习资料'
          out = Path('dist') / root
          out.mkdir(parents=True)
          folders = sorted(Path('六级/听写卡').iterdir())
          assert len(folders) == len(D) == 60, (len(folders), len(D))
          kinds = ['0 逐句精读.pdf', '1 汉译英.pdf', '2 英译汉.pdf', '3 文章填空.pdf', '4 长难句分析.pdf']
          for i, (f, p) in enumerate(zip(folders, D), 1):
              assert f.name.startswith(f'{i:02d} {p["paper"]} {p["passage"]} '), (f.name, p['id'])
              pdfs = sorted(f.glob('*.pdf'))
              assert [x.name.split(' - ')[-1] for x in pdfs] == kinds, (f.name, [x.name for x in pdfs])
              dst = out / f.name
              shutil.copytree(f, dst)
              for x in sorted(dst.glob('*.pdf')):         # 文件序号从 1 开始（用户 2026-10-21：0 逐句精读 → 1 逐句精读……，朗读音频排最后）
                  a, b = x.name.rsplit(' - ', 1)
                  k, rest = b.split(' ', 1)
                  x.rename(dst / f'{a} - {int(k) + 1} {rest}')
              shutil.copy(Path('六级/audio') / T[p['id']]['file'], dst / f'{f.name[3:]} - {len(pdfs) + 1} 朗读音频.mp3')
          PY
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          tag = os.environ['TAG']
          z = Path(f'CET6-reading-materials-{tag}.zip')
          files = sorted(x for x in Path('dist').rglob('*') if x.is_file())
          with zipfile.ZipFile(z, 'w', zipfile.ZIP_STORED, allowZip64=True) as zf:
              for x in files:
                  zf.write(x, x.relative_to('dist').as_posix())
          with zipfile.ZipFile(z) as zf:                   # 踩坑 43：一律用 Python zipfile 核对
              infos = zf.infolist()
              assert len(infos) == len(files) == 60 * 6, len(infos)
              for i, x in zip(infos, files):
                  assert i.filename == x.relative_to('dist').as_posix() and i.file_size == x.stat().st_size, i.filename
                  assert i.flag_bits & 0x800 or i.filename.isascii(), f'{i.filename} 没有 UTF-8 标记'
              assert zf.testzip() is None
          assert z.stat().st_size < 2 * 2**30, f'{z} 超过 2 GB'
          print(f'{z.name}：{len(infos)} 个文件，{z.stat().st_size / 2**20:.0f} MB，zipfile 核对通过')
          Path('zip.txt').write_text(z.name, 'utf-8')
          D = [p for p in json.load(open('六级/data/vocab.json', encoding='utf-8'))['passages'] if p.get('done')]
          rows = [f'| {i} | {f.name[3:]} |' for i, f in enumerate(sorted(Path('六级/听写卡').iterdir()), 1)]
          Path('notes.md').write_text(
              '大学英语六级阅读真题（仔细阅读 Section C）学习资料，共 60 篇，与六级黑板视频（Release cet6-chalk）一一对应、顺序相同。每篇一个文件夹：\n\n'
              '- 1 逐句精读.pdf：视频画面（教室黑板大字版），片头 + 每屏一页\n'
              '- 2 汉译英.pdf：看中文写英文\n- 3 英译汉.pdf：看英文写中文\n- 4 文章填空.pdf：原文挖空，附整句翻译和每空释义\n'
              '- 5 长难句分析.pdf：每篇挑出 2—5 个又长又复杂的句子：找主干、层层拆解、怎么读懂、怎么翻译、包含哪些知识点\n'
              '- 6 朗读音频.mp3：男声逐句朗读（与视频是同一份朗读）\n\n'
              '三份听写卡 PDF 的最后一页是答案。\n\n| # | 篇目 |\n|---|---|\n' + '\n'.join(rows) + '\n', 'utf-8')
          PY
      - name: 发布 Release（gh；目标用分支名）
        run: |
          z=$(cat zip.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$z" --clobber
            gh release edit "$TAG" --title "六级阅读真题60篇 学习资料（逐句精读 + 听写卡 + 长难句分析 + 朗读音频）" --notes-file notes.md
          else
            gh release create "$TAG" "$z" --target "$GITHUB_REF_NAME" --title "六级阅读真题60篇 学习资料（逐句精读 + 听写卡 + 长难句分析 + 朗读音频）" --notes-file notes.md
          fi
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size)"'
          test "$(gh release view "$TAG" --json assets -q ".assets[] | select(.name == \"$z\") | .size")" = "$(stat -c %s "$z")"
