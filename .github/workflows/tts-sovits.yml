name: 讲解配音（GPT-SoVITS 专属模型，CPU）
# 老师用声音分身 VoiceTwin 训练的 GPT-SoVITS v2ProPlus 模型（或底模）在免费 CPU 机器上合成讲解配音。
# 任务清单与 Qwen 同一格式（候选 mode: gptsovits），输出同一结构，提交到分支 gram-tts-out 的 runs/<任务>-<运行号>/。
# 触发：推送 高考语法填空/tts/当前任务_sovits.txt（底模任务），或 workflow_dispatch（老师的模型：model_url 填云盘链接）。
# 模型 zip 只在 fetch 任务里取一次（Range 远程读，不行再整包下载），传成 artifact sovits-model 给合成分片（老师 2026-11-04：模型包是公共资源，可以公开）；
#       gram-tts-out 只收合成结果（collect 只下 wav-*；合成后 取模型.py --check-out 核对 out/ 里没有模型、参考录音）。
on:
  push:
    branches: [claude/epic-edison-4gkcfb]
    paths: ['高考语法填空/tts/当前任务_sovits.txt']
  workflow_dispatch:
    inputs:
      task:
        description: 任务清单（高考语法填空/tts/ 下的文件名；空 = 当前任务_sovits.txt 里写的）
        required: false
      model_url:
        description: 老师模型 zip 的云盘链接（只在 weights=teacher 时用；会被掩掉）
        required: false
permissions:
  contents: write
env:
  GSV_COMMIT: abe984395cb6d8ed2055f5496d0bb26007f30365   # 老师电脑上的版本（VoiceTwin 注释 @ abe9843，20250606v2pro 之后）
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      task: ${{ steps.p.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: 高考语法填空
      - id: p
        env:
          IN_TASK: ${{ github.event.inputs.task }}
        run: |
          N="${IN_TASK:-$(head -1 高考语法填空/tts/当前任务_sovits.txt | tr -d '\r\n ')}"
          T="高考语法填空/tts/$N"
          test -f "$T"
          echo "task=$T" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 高考语法填空/tools/sovits_synth.py --task "$T" --list)" >> "$GITHUB_OUTPUT"
  fetch:
    # 老师的模型 zip（20.8 GB）只在这里取一次：先试 HTTP Range 远程读（只读中央目录和选中的权重、参考，几百 MB），
    # 不行就整包下到 /mnt 解出再删；取出的东西传成 artifact（老师同意公开），合成分片去取，不各自下载（Drive 配额、磁盘）。
    needs: plan
    if: github.event.inputs.model_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: 高考语法填空/tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 取老师的模型
        env:
          U: ${{ github.event.inputs.model_url }}
        run: |
          pip install -q gdown requests
          sudo mkdir -p /mnt/dl /mnt/sovits && sudo chown "$USER" /mnt/dl /mnt/sovits
          python 高考语法填空/tools/取模型.py --url-env U --dl /mnt/dl --out /mnt/sovits
          sudo rm -rf /mnt/dl          # /mnt 属 root；zip 已在 取模型.py 里删掉（Range 读时根本没下）
          (cd /mnt/sovits && sha256sum weights/* refs/* && du -sh .)
      - uses: actions/upload-artifact@v4
        with:
          name: sovits-model
          path: /mnt/sovits
          retention-days: 3
  synth:
    needs: [plan, fetch]
    if: always() && needs.plan.result == 'success' && needs.fetch.result != 'failure' && needs.fetch.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            高考语法填空
            高考续写/讲解
            tools/tts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装 GPT-SoVITS（官方代码 + 依赖）
        run: |
          sudo apt-get install -y -qq sox ffmpeg >/dev/null
          curl -sSfL --retry 5 -o gsv.tgz "https://codeload.github.com/RVC-Boss/GPT-SoVITS/tar.gz/$GSV_COMMIT"
          mkdir GPT-SoVITS && tar -xzf gsv.tgz -C GPT-SoVITS --strip-components=1 && rm gsv.tgz
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          # 只装推理用得到的：GPU 版 onnxruntime 换 CPU 版；opencc 用现成的轮子（不从源码编）；去掉网页界面、识别、韩语
          grep -vE '^(--no-binary|onnxruntime|gradio|funasr|fastapi|ctranslate2|python_mecab_ko|tensorboard)' GPT-SoVITS/requirements.txt > req.txt
          pip install -q -r req.txt onnxruntime matplotlib huggingface_hub gdown soundfile soxr pyloudnorm lameenc num2words
          python -m nltk.downloader -q averaged_perceptron_tagger averaged_perceptron_tagger_eng cmudict
          # 导入预检（只导入不加载模型的部分）：缺包几秒就停（铁律 15）
          cd GPT-SoVITS && PYTHONPATH=.:GPT_SoVITS python -c "import AR.models.t2s_lightning_module, module.models, sv, feature_extractor.cnhubert; print('导入预检通过')"
      - name: 下载底模（Hugging Face lj1995/GPT-SoVITS）
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download('lj1995/GPT-SoVITS', local_dir='GPT-SoVITS/GPT_SoVITS/pretrained_models',
                            allow_patterns=['chinese-hubert-base/*', 'chinese-roberta-wwm-ext-large/*', 's1v3.ckpt',
                                            'v2Pro/s2Gv2ProPlus.pth', 'sv/*'])
          EOF
          du -sh GPT-SoVITS/GPT_SoVITS/pretrained_models/*
          cd GPT-SoVITS
          for f in s1v3.ckpt v2Pro/s2Gv2ProPlus.pth sv/pretrained_eres2netv2w24s4ep4.ckpt chinese-roberta-wwm-ext-large/config.json chinese-hubert-base/config.json; do
            test -s "GPT_SoVITS/pretrained_models/$f" || { echo "缺底模 $f"; exit 1; }; done
          # 整合包里事先建好、代码自己不建的目录（fast_langdetect 语言识别模型下载到这里）
          mkdir -p GPT_SoVITS/pretrained_models/fast_langdetect
          # 文本前端空跑：中英混合一句走 语种切分（fast_langdetect）→ 中文 G2PW（首次从 modelscope 下到 GPT_SoVITS/text/G2PWModel）
          # → 英文 g2p_en / nltk，把缺文件、缺目录一次暴露（路径都相对仓库根目录）
          PYTHONPATH=.:GPT_SoVITS python - <<'EOF'
          from TTS_infer_pack.TTS import TTS, TTS_Config
          from text.LangSegmenter import LangSegmenter
          from text import chinese2, english
          t = '那现在我们就把 when 还原成 in the year。'
          print(LangSegmenter.getTexts(t))
          print(chinese2.g2p(chinese2.text_normalize('好，那接下来我们就开始讲一下这篇续写。'))[0][:8])
          print(english.g2p(english.text_normalize('There was a station nearby, they explained.'))[:8])
          print('文本前端预检通过')
          EOF
          ls GPT_SoVITS/text/G2PWModel | head -5
      - name: 取老师的模型（fetch 传来的 artifact）
        if: needs.fetch.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sovits-model
          path: /home/runner/sovits
      - name: 合成
        env:
          MALLOC_ARENA_MAX: '2'
          GSV_ROOT: GPT-SoVITS
          SOVITS_DIR: /home/runner/sovits
        run: python 高考语法填空/tools/sovits_synth.py --task "${{ needs.plan.outputs.task }}" --shard ${{ matrix.shard }} --out out
      - name: 隐私核对（out/ 里不许有模型和素材）
        if: always()
        run: python 高考语法填空/tools/取模型.py --check-out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wav-${{ matrix.shard }}
          path: out
          retention-days: 7
  collect:
    needs: [plan, synth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arts
          pattern: wav-*          # 只要合成结果；模型 artifact 不进 gram-tts-out
      - name: 提交到 gram-tts-out
        run: |
          T=$(basename "${{ needs.plan.outputs.task }}" .json)
          D="runs/${T}-${{ github.run_number }}"      # 与 Qwen 同名格式：合成完整性.task_of 按“任务-运行号”找任务清单
          mkdir repo && cd repo && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin gram-tts-out; then git checkout -q -b gram-tts-out FETCH_HEAD; else git checkout -q --orphan gram-tts-out; fi
          mkdir -p "$D"
          for a in ../arts/wav-*; do cp -r "$a"/. "$D"/; done
          ls -R "$D" | head -50
          git add "$D"
          git config user.name github-actions && git config user.email actions@github.com   # pull --rebase 也要身份（运行 #14：Committer identity unknown）
          git commit -qm "配音原始音频 $D"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git push -q origin gram-tts-out; then ok=1; break; fi
            sleep $((2**i)); git pull -q --rebase origin gram-tts-out || true   # 几个补合成同时推会抢 ref：拉下来再推
          done
          [ "$ok" = 1 ] || { echo "推 gram-tts-out 失败（重试 6 次）"; exit 1; }
