name: 完成已核准录音的雅思画面与篇首插图
on:
  push:
    branches: [codex/ielts-academic-reading]
    paths: ['.github/ielts-aiden-available-illustrations.json']
permissions:
  contents: read
  actions: read
# The next production matrix waits for its pilot. Its workers can then reuse
# the finished illustrations when they check their per-lesson receipts.
concurrency:
  group: ielts-early-lesson-C13T1P1
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  IELTS_NARRATOR: Aiden
  TARGET: 雅思/学术阅读

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      lessons: ${{ steps.plan.outputs.lessons }}
      slots: ${{ steps.plan.outputs.slots }}
      revised: ${{ steps.plan.outputs.revised }}
      recovery_index: ${{ steps.index.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
      - id: plan
        name: 核对正文、音轨和已完成的篇目
        shell: python
        run: |
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '雅思/学术阅读/tools')
          from aiden_batch import BATCHES, cached
          from aiden_profile import IDENTITY
          from early_editor import key_for
          from editions import lesson_ids
          from material import verify_original
          from release_assets import fetch, inventory
          from submit_reviewed import approved
          import tempfile

          spec = json.loads(Path('.github/ielts-aiden-available-illustrations.json').read_text())
          edition = lesson_ids(BATCHES['13-6'])
          requested = set(spec['lessons'])
          if not requested <= set(edition):
              raise ValueError('A requested lesson is outside books 13 to 6')
          revised = spec.get('reviewed_text', False)
          read_repair = spec.get('recover_failed_reads', False)
          if type(revised) is not bool or type(read_repair) is not bool or (revised and read_repair):
              raise ValueError('Invalid edition selector')
          source = f"repos/{os.environ['GH_REPO']}/actions/runs/{int(spec['source_run'])}"
          route = source + '/jobs?per_page=100'
          listing = subprocess.check_output(['gh','api','--paginate',route,'--jq',
              '.jobs[] | {name,status,conclusion,failed:[.steps[]? | select(.conclusion=="failure") | .name]} | @json'],
              text=True)
          jobs = [json.loads(line) for line in listing.splitlines()]
          busy = [job for job in jobs if job['status'] != 'completed']
          lesson_job = re.compile(r'(?:production|repair) \((C\d+T\d+P\d+)\)')
          active = {m[1] for job in busy if (m := lesson_job.search(job['name']))}
          slots = max(0, min(12, 19 - len(busy)))
          available = [p for p in edition if slots and p in requested - active and p != edition[0]]
          if read_repair:
              info = json.loads(subprocess.check_output(['gh','api',source,'--jq','{head_branch,path}']))
              if info != dict(head_branch='codex/ielts-academic-reading', path='.github/workflows/ielts-aiden-production.yml'):
                  raise ValueError('Unexpected source for previously failed recording reads')
              inflight = json.loads(Path('.github/ielts-aiden-batch.json').read_text()).get('repair_lessons', [])
              # This workflow holds the next full edition at its pilot. The queued individual
              # repairs can start without that pilot, so reserve their slots as well.
              slots = max(0, min(12, 19 - len(busy) - len(inflight)))
              failed_steps = {'恢复同篇已核验的完整录音', '核对本篇的原稿版本和现成视频',
                              'Run ./.github/actions/ielts-verified-master'}
              failed_reads = {m[1] for job in jobs if job['conclusion'] == 'failure'
                              and failed_steps.intersection(job['failed'])
                              and (m := lesson_job.search(job['name']))}
              lessons = [p for p in available if slots and p in failed_reads and p not in inflight
                         and not cached(p, '13-6', include_illustration=True)]
          elif revised:
              root = Path('雅思/学术阅读')
              measured = json.loads((root / '审校/Aiden/13-6/原书与版式复核.json').read_text())
              assets = inventory('ielts-academic-aiden-cache-13-6')
              lessons = []
              with tempfile.TemporaryDirectory() as temp:
                  for p in available:
                      # The next edition's pilot has its own worker in this workflow's concurrency group.
                      if p == edition[0]:
                          continue
                      if int(p[1:p.index('T')]) <= 10:
                          if p not in measured or measured[p]['key'] != key_for(root, p):
                              continue
                      else:
                          approved(root / '篇目' / p)
                          verify_original(root, p)
                      source = assets.get(p + '-receipt.json')
                      if not source or not source.get('digest') or cached(p, '13-6'):
                          continue
                      receipt = json.loads(fetch(source, temp).read_bytes())
                      if (receipt.get('lesson') == p and receipt.get('narrator') == IDENTITY
                              and receipt.get('verified_phrases') and receipt.get('audio_sha256')
                              and receipt['audio_sha256'] == receipt.get('encoded_reference_sha256')):
                          lessons.append(p)
          else:
              lessons = [p for p in available if cached(p, '13-6')
                         and not cached(p, '13-6', include_illustration=True)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('lessons=' + json.dumps(lessons, separators=(',', ':')), file=out)
              print('slots=' + str(max(1, slots)), file=out)
              print('revised=' + str(revised or read_repair).lower(), file=out)
          print(f'{len(lessons)} lessons selected, {slots} worker slots available')

      - name: 读取本轮各篇共用的历史录音清单
        id: index
        if: steps.plan.outputs.revised == 'true' && steps.plan.outputs.lessons != '[]'
        run: |
          python '雅思/学术阅读/tools/aiden_recovery_index.py' "$RUNNER_TEMP/recordings.json"
          echo "artifact=aiden-recovery-index-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.index.outputs.artifact != ''
        with:
          name: ${{ steps.index.outputs.artifact }}
          path: ${{ runner.temp }}/recordings.json
          if-no-files-found: error
          retention-days: 14

  illustrate:
    needs: select
    if: needs.select.outputs.lessons != '[]' && needs.select.outputs.revised != 'true'
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.select.outputs.slots) }}
      matrix:
        lesson: ${{ fromJSON(needs.select.outputs.lessons) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IELTS_LESSON: ${{ matrix.lesson }}
      IELTS_AIDEN_BATCH: '13-6'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            雅思/学术阅读
      - name: 从已核准的正文插入同篇插图并实播、回下载
        run: bash .github/actions/ielts-verified-master/illustrate.sh

  remaster:
    needs: select
    if: needs.select.outputs.lessons != '[]' && needs.select.outputs.revised == 'true'
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.select.outputs.slots) }}
      matrix:
        lesson: ${{ fromJSON(needs.select.outputs.lessons) }}
    uses: ./.github/workflows/ielts-early-lesson.yml
    with:
      lesson: ${{ matrix.lesson }}
      aiden_batch: '13-6'
      current_tools: true
      recovery_index: ${{ needs.select.outputs.recovery_index }}
