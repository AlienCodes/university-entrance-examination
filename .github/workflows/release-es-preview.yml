# 修改 .github/es-preview-release.txt 并推送时：打包西班牙语视频生成程序 + Supertonic 3 模型 + 6 种背景样式（先行版），
# Qwen3-TTS 1.7B Base 模型在运行器上从 Hugging Face 下载，打成 zip 后切成 < 1.9 GB 的分卷；生成 SHA256SUMS.txt；用 gh 发布（踩坑 42）。
# 清单第一行 = 标签名。检查不通过的样音和旧草稿视频不打包（铁律 10：给用户的音频必须全部检查通过）。
name: 发布西班牙语视频生成包（先行版）
on:
  push:
    paths: ['.github/es-preview-release.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 组装程序包
        run: |
          set -e
          top="西班牙语视频生成包（先行版）"
          echo "TOP=${top}" >> "$GITHUB_ENV"
          mkdir -p "dist/${top}"
          for d in 西班牙语 四级/tools tools/tts tools/video; do
            mkdir -p "dist/${top}/$(dirname "$d")"
            rsync -a --exclude '__pycache__' --exclude '*.pyc' "$d" "dist/${top}/$(dirname "$d")/"
          done
          # 检查没有全部通过的样音、旧草稿视频和它的音频不打包（铁律 10）
          rm -rf "dist/${top}/西班牙语/配音选型/样音_"* "dist/${top}/西班牙语/最终视频/"* "dist/${top}/西班牙语/audio"
          ls "dist/${top}/西班牙语"
          sty="dist/${top}/背景样式（6种）"
          mkdir -p "$sty/fonts"
          cp 中考/tools/样式设计/样本/* "$sty/"
          cp 中考/tools/样式.css "$sty/Z5_紫黄撞色_正式版.css"
          cp 中考/tools/样式设计/README.md "$sty/说明（中考版）.md"
          cp -r 中考/tools/fonts/* "$sty/fonts/"
          cp .github/es-preview/先行版说明.md "dist/${top}/使用说明.md"
          # Supertonic 3 模型（sherpa-onnx 发布的 int8 版）
          m="dist/${top}/西班牙语/models/supertonic3"
          mkdir -p "$m" tmp_st
          curl -sSfL -o st.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          tar xjf st.tar.bz2 -C tmp_st && rm st.tar.bz2
          cp tmp_st/sherpa-onnx-supertonic-3-tts-int8-2026-05-11/* "$m/" && rm -rf tmp_st
          ls -la "$m"
          du -sh "dist/${top}"
      - name: 打成 zip（Python zipfile，中文文件名不乱码）
        run: |
          set -e
          tag=$(head -1 .github/es-preview-release.txt | tr -d '[:space:]')
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          python3 - "$TOP" <<'PY'
          import os, sys, zipfile
          top = sys.argv[1]
          n = 0
          with zipfile.ZipFile('SPANISH-video-kit-preview.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk(os.path.join('dist', top)):
                  dirs.sort()
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, 'dist'))
                      n += 1
          print('files', n, 'zip', os.path.getsize('SPANISH-video-kit-preview.zip') // 2**20, 'MB')
          PY
          rm -rf dist
      - name: 下载 Qwen3-TTS 1.7B Base 并分卷
        run: |
          set -e
          pip install -q "huggingface_hub>=0.30"
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('Qwen/Qwen3-TTS-12Hz-1.7B-Base', local_dir='qwen3-base')
          PY
          rm -rf qwen3-base/.cache
          du -sh qwen3-base
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('qwen3-tts-1.7b-base.zip', 'w', zipfile.ZIP_STORED, allowZip64=True) as z:
              for root, dirs, files in os.walk('qwen3-base'):
                  dirs.sort()
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          size = os.path.getsize('qwen3-tts-1.7b-base.zip')
          part = 1900 * 2**20
          with open('qwen3-tts-1.7b-base.zip', 'rb') as f:
              i = 0
              while True:
                  b = f.read(part)
                  if not b:
                      break
                  i += 1
                  with open(f'qwen3-tts-1.7b-base.zip.{i:03d}', 'wb') as g:
                      g.write(b)
          print('zip', size // 2**20, 'MB ->', i, 'parts')
          PY
          rm -rf qwen3-base qwen3-tts-1.7b-base.zip
          cat > join_qwen3_parts.py <<'PY'
          """把 qwen3-tts-1.7b-base.zip.001、.002 … 合并成 qwen3-tts-1.7b-base.zip（和本文件放在同一个文件夹，运行 python join_qwen3_parts.py）。"""
          import glob, hashlib, os
          parts = sorted(glob.glob('qwen3-tts-1.7b-base.zip.[0-9][0-9][0-9]'))
          if not parts:
              raise SystemExit('找不到分卷文件 qwen3-tts-1.7b-base.zip.001 …')
          h = hashlib.sha256()
          with open('qwen3-tts-1.7b-base.zip', 'wb') as out:
              for p in parts:
                  with open(p, 'rb') as f:
                      while True:
                          b = f.read(1 << 24)
                          if not b:
                              break
                          out.write(b)
                          h.update(b)
          print('合并了', len(parts), '个分卷 → qwen3-tts-1.7b-base.zip，SHA256', h.hexdigest())
          print('请与 SHA256SUMS.txt 里 qwen3-tts-1.7b-base.zip 那一行核对，一致后解压到 西班牙语/models/ 下（得到 qwen3-base 文件夹）')
          PY
          ls -la
      - name: 校验值
        run: |
          set -e
          python3 - <<'PY'
          import glob, hashlib
          lines = []
          for f in sorted(glob.glob('SPANISH-video-kit-preview.zip') + glob.glob('qwen3-tts-1.7b-base.zip.[0-9][0-9][0-9]') + ['join_qwen3_parts.py']):
              h = hashlib.sha256()
              with open(f, 'rb') as g:
                  for b in iter(lambda: g.read(1 << 24), b''):
                      h.update(b)
              lines.append(f'{h.hexdigest()}  {f}')
          # 合并后的整包校验值
          h = hashlib.sha256()
          for f in sorted(glob.glob('qwen3-tts-1.7b-base.zip.[0-9][0-9][0-9]')):
              with open(f, 'rb') as g:
                  for b in iter(lambda: g.read(1 << 24), b''):
                      h.update(b)
          lines.append(f'{h.hexdigest()}  qwen3-tts-1.7b-base.zip')
          open('SHA256SUMS.txt', 'w').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          title="西班牙语逐句精读视频：模型与生成程序（先行版）"
          cat > notes.md <<'EOF'
          西班牙语逐句精读视频的模型与全部生成程序（先行版，2026-10-15）。完整工具包（一键安装、批量生成、6 种背景适配西班牙语、检查全部通过的示例视频和样音）测试通过后另发，标签 es-kit。

          - SPANISH-video-kit-preview.zip：生成程序（朗读音频、4K 视频、自动核查）、音色设置（推荐 qwen3_M1F5_25：更细、稍高、最像真人；supertonic3_* 快速轻量）、Supertonic 3 模型、示例文章、Qwen3 克隆参考声音、6 种背景样式（CSS + 预览）。解压后先看 使用说明.md。
          - qwen3-tts-1.7b-base.zip.001 / .002 / …：Qwen3-TTS 1.7B 模型分卷（合起来约 4.5 GB）。全部下载到同一文件夹，运行 python join_qwen3_parts.py 合并（或 Windows：copy /b 依次相加；macOS/Linux：cat qwen3-tts-1.7b-base.zip.0* > qwen3-tts-1.7b-base.zip），用 SHA256SUMS.txt 核对后解压到 西班牙语/models/。
          - SHA256SUMS.txt：所有文件（以及合并后的 qwen3-tts-1.7b-base.zip）的 SHA256。
          EOF
          sed -i 's/^          //' notes.md
          files=(SPANISH-video-kit-preview.zip qwen3-tts-1.7b-base.zip.[0-9][0-9][0-9] join_qwen3_parts.py SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          fi
