# 修改 .github/delete-releases.txt 并推送时删除其中列出的 GitHub Release（每行一个标签名）。
# 用户 2026-10-10：四级、六级的 Release 都已下载、视频也都保存在仓库里，全部删掉。只删 Release（附件），git 标签保留。
# 用户 2026-10-14：高考、四级的 Release 全部删掉，只保留六级和专八（以及中考）的。
# 用户 2026-10-17：西班牙语相关的全部删掉（含 Release es-kit、es-kit-preview）。
# 用户 2026-10-26：旧 Release 都可以删。先删内容已在别的 Release 里的 6 个：zk-01（女声，已由男声版取代）、zk-m01—m04（都在 zk-m-all 合集里）、tem8-01（已由 tem8-ink 27 个取代）；其余等用户确认。
# 为防误删，只允许删高考、四级、西班牙语的 Release（videos-*、dictation-*、papers-*、cet4-*、007、es-kit、es-kit-preview，以及上面那 6 个）；六级 cet6-*、专八 tem8-*、中考 zk-* 及其他标签一律报错、一个都不删。
name: 删除 Release
on:
  push:
    paths: ['.github/delete-releases.txt']
permissions:
  contents: write
  actions: write      # 西班牙语：一并删掉 Actions 里的产物、缓存、运行记录
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 删除
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mapfile -t tags < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' .github/delete-releases.txt | sed '/^$/d')
          [ ${#tags[@]} -gt 0 ] || { echo "没有列出标签"; exit 1; }
          for t in "${tags[@]}"; do
            [[ "$t" =~ ^(videos-.+|dictation-.+|papers-.+|cet4-.+|007|es-kit|es-kit-preview|zk-01|zk-m0[1-4]|tem8-01)$ ]] || { echo "不允许删除：$t"; exit 1; }
          done
          for t in "${tags[@]}"; do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [[ "$t" == es-* ]]; then gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" && echo "已删除（连同标签）：$t"
              else gh release delete "$t" --yes --repo "$GITHUB_REPOSITORY" && echo "已删除：$t"; fi
            else
              echo "不存在（已删过）：$t"
            fi
          done
          if printf '%s\n' "${tags[@]}" | grep -q '^es-'; then        # 西班牙语（用户 2026-10-17：云端所有相关的东西全部删掉）
            R="repos/$GITHUB_REPOSITORY"
            for t in $(git ls-remote --tags origin | grep -oE 'refs/tags/es-kit(-preview)?$' | sed 's#refs/tags/##'); do
              gh api -X DELETE "$R/git/refs/tags/$t" && echo "已删标签 $t"
            done
            git ls-remote --tags origin | grep -E 'refs/tags/es-' || echo "西班牙语标签：已无"
            for wf in release-es-kit.yml release-es-preview.yml; do
              wid=$(gh api "$R/actions/workflows" --paginate -q ".workflows[] | select(.path == \".github/workflows/$wf\") | .id" || true)
              [ -n "$wid" ] || { echo "工作流 $wf：找不到"; continue; }
              for run in $(gh api "$R/actions/workflows/$wid/runs?per_page=100" --paginate -q '.workflow_runs[].id'); do
                for a in $(gh api "$R/actions/runs/$run/artifacts?per_page=100" -q '.artifacts[].id'); do gh api -X DELETE "$R/actions/artifacts/$a" && echo "已删产物 $a（运行 $run）"; done
                gh api -X DELETE "$R/actions/runs/$run" && echo "已删运行记录 $run（$wf）"
              done
            done
            for k in $(gh api "$R/actions/caches?per_page=100" --paginate -q '.actions_caches[] | select(.key | test("(^|[-_])es[-_]|qwen|supertonic|spanish|西班牙"; "i")) | .id'); do
              gh api -X DELETE "$R/actions/caches/$k" && echo "已删缓存 $k"
            done
            echo "剩余缓存："; gh api "$R/actions/caches?per_page=100" -q '.actions_caches[] | "\(.key)  \(.size_in_bytes)"' || true
          fi
          echo "剩余 Release："
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100
